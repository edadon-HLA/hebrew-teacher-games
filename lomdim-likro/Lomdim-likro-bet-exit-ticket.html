<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<title>Exit Ticket — Reading 2 · בּ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@400;700;800&display=swap" rel="stylesheet">
<style>
/* 4 exit tickets on one A4 page (2 x 2), cut along the dashed lines; Letter-safe 190 x 255 mm box */
@page{size:A4;margin:21mm 10mm}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:#23233a;font-family:'Noto Sans Hebrew',Arial,sans-serif}
.sheet{width:190mm;height:255mm;margin:0 auto;display:grid;grid-template-columns:95mm 95mm;grid-template-rows:127.5mm 127.5mm;overflow:hidden;break-inside:avoid}
.t{padding:5mm 5mm 4mm;border:1px dashed #9aa3b2;display:flex;flex-direction:column;gap:2mm;height:127.5mm;min-height:0;overflow:hidden}
.hd{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #e2506a;padding-bottom:1.5mm}
.hd b{font-size:15pt;font-weight:800}
.hd span{font-size:8.5pt;color:#6b6880}
.name{font-size:11pt;font-weight:700;display:flex;gap:2mm;align-items:flex-end}
.name i{flex:1;border-bottom:1.2px solid #23233a;height:6mm}.name i.d{flex:.7}.name span.dt{margin-inline-start:3mm}
.q{font-size:9.5pt;font-weight:800;line-height:1.35}
.row{display:grid;grid-template-columns:7mm 13mm repeat(3,minmax(0,1fr));gap:2mm;align-items:center}
.row .n{display:grid;place-items:center;width:6mm;height:6mm;border-radius:50%;background:#23233a;color:#fff;font-size:9pt;font-weight:800}
.row .sy{font-size:24pt;font-weight:800;text-align:center;line-height:1.2;color:#16527d}
.row .p{height:16mm;border:1.2px solid #9aa3b2;border-radius:2.5mm;display:grid;place-items:center;overflow:hidden}
.row .p img,.row .p svg{max-height:13.5mm;max-width:90%;width:auto}
.row .p .emo{font-size:28pt;line-height:1}
.self{margin-top:1mm;display:flex;justify-content:space-between;align-items:center;gap:2mm;font-size:9.5pt}
.self .f{display:flex;gap:1.5mm;font-size:12pt;white-space:nowrap}
.self .f span{display:inline-grid;place-items:center;width:6.5mm;height:6.5mm;border:1px solid #9aa3b2;border-radius:50%}
bdi{unicode-bidi:isolate}
.t>*{flex-shrink:0}
@media screen{body{background:#eee;padding:10px}.sheet{background:#fff;box-shadow:0 2px 12px #0003}}
</style>
<script src="bet/data.js"></script>
</head>
<body>
<div class="sheet" id="sheet"></div>
<script>
const pic = it => it.pic ? `<img src="${it.pic}" alt="">` : it.svg ? BET.SVG[it.svg] : `<span class="emo">${it.emo}</span>`;
const one = `<div class="t">
  <div class="hd"><b>🎟️ Exit Ticket</b><span>Reading 2 · Letter <bdi dir="rtl">${BET.sh.plain}</bdi></span></div>
  <div class="name">Name: <i></i><span class="dt">Date:</span><i class="d"></i></div>
  <div class="q">Work alone. Read the sound in each row. Circle the picture that starts with this sound.</div>
  ${BET.exit.map((r, i) => `<div class="row"><span class="n">${i + 1}</span><bdi dir="rtl" class="sy">${r.s}</bdi>${r.items.map(it => `<div class="p">${pic(it)}</div>`).join('')}</div>`).join('')}
  <div class="self"><span>I can read and write <bdi dir="rtl">${BET.sh.ka} ${BET.sh.pa} ${BET.sh.sv}</bdi></span><span class="f"><span>😀</span><span>🙂</span><span>😕</span></span></div>
</div>`;
document.getElementById('sheet').innerHTML = one.repeat(4);
</script>
</body>
</html>
