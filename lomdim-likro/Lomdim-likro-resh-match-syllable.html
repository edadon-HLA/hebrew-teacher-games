<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>מְחַבְּרִים: תְּמוּנָה וַהֲבָרָה — ק · ר</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@400;700;800&family=Rubik:wght@800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/print-ind.css?v=1">
<style>
/* R7 #2: 6 workbook pictures — 6 first-syllable boxes (mixed); draw lines; 2 per page; p2 = answer key */
.mt{display:grid;grid-template-columns:40mm 1fr 30mm;flex:1;min-height:0;padding:0 8mm}
.col{display:grid;grid-template-rows:repeat(6,minmax(0,1fr));gap:1.6mm}
.p,.q{position:relative;display:flex;align-items:center}
.p .pi-ph{width:26mm;height:14.5mm}
.q{justify-content:center;border:.5mm solid #1f2433;border-radius:2.5mm;font-size:24pt;font-weight:800}
.dot{position:absolute;top:50%;width:3.2mm;height:3.2mm;margin-top:-1.6mm;border-radius:50%;background:#1f2433}
.p .dot{left:9mm}
.q .dot{right:-1.6mm}
</style>
<script src="../shared/print-ind.js?v=1"></script>
</head>
<body>
<div id="pages"></div>
<script>
const PICS = [['cold', 2], ['train', 1], ['legs', 4], ['banana', 5], ['orange', 3], ['clock', 0]];   /* [picture, box index] */
const BOX = ['שָׁ', 'רַ', 'קַ', 'תַ', 'רַ', 'בָּ'];
const half = ex => `${PI.top('תְּמוּנָה וַהֲבָרָה', { tag: ex ? 'Answer key' : '' })}
  ${PI.ins(0, 'חַבְּרוּ בְּקַו: תְּמוּנָה — הַצְּלִיל הָרִאשׁוֹן.')}
  <div class="mt${ex ? ' ex' : ''}"><div class="col">${PICS.map(([p, b]) => `<div class="p" data-b="${b}">${PI.pic('tzlil:' + p)}<span class="dot"></span></div>`).join('')}</div><div></div>
  <div class="col">${BOX.map((s, i) => `<div class="q" data-i="${i}">${s}<span class="dot"></span></div>`).join('')}</div></div>`;
document.getElementById('pages').innerHTML = PI.halves(half(false)) + PI.halves(half(true), '');
PI.ready(() => document.querySelectorAll('.mt.ex').forEach(m => { const pg = m.closest('.pg');
  PI.connect(pg, [...m.querySelectorAll('.p')].map(p => [p.querySelector('.dot'), m.querySelector(`.q[data-i="${p.dataset.b}"] .dot`)])); }));
</script>
</body>
</html>
