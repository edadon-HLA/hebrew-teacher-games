<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<title>Exit Ticket — Reading 1 · שׁ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@400;700;800&display=swap" rel="stylesheet">
<style>
/* 4 exit tickets on one A4 page (2 x 2), cut along the dashed lines */
@page{size:A4;margin:21mm 10mm}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:#23233a;font-family:'Noto Sans Hebrew',Arial,sans-serif}
.sheet{width:190mm;height:255mm;margin:0 auto;display:grid;grid-template-columns:95mm 95mm;grid-template-rows:127.5mm 127.5mm;overflow:hidden;break-inside:avoid}
.t{padding:5mm 5mm 4mm;border:1px dashed #9aa3b2;display:flex;flex-direction:column;gap:2.2mm;height:127.5mm;min-height:0;overflow:hidden}
.hd{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #e2506a;padding-bottom:1.5mm}
.hd b{font-size:15pt;font-weight:800}
.hd span{font-size:8.5pt;color:#6b6880}
.name{font-size:11pt;font-weight:700;display:flex;gap:2mm;align-items:flex-end}
.name i{flex:1;border-bottom:1.2px solid #23233a;height:6mm}.name i.d{flex:.7}.name span.dt{margin-inline-start:3mm}
.q{font-size:11pt;font-weight:800;margin-top:1mm}
.opts{font-size:13pt;font-weight:800;color:#16527d;direction:rtl;text-align:center;background:#eef6fd;border-radius:3mm;padding:1mm 0}
.pics{display:grid;grid-template-columns:1fr 1fr 1fr;gap:2.5mm}
.p{border:1.2px solid #9aa3b2;border-radius:2.5mm;padding:1.5mm;display:flex;flex-direction:column;align-items:center;gap:1mm}
.p img{height:15mm;width:100%;object-fit:contain}
.p i{display:block;width:80%;height:9mm;border-bottom:1.2px solid #23233a}
.self{margin-top:2mm;display:flex;flex-direction:column;gap:1.3mm;font-size:9.5pt}
.self div{display:flex;justify-content:space-between;align-items:center;gap:2mm}
.self .f{display:flex;gap:1.5mm;font-size:12pt;white-space:nowrap}
.self .f span{display:inline-grid;place-items:center;width:6.5mm;height:6.5mm;border:1px solid #9aa3b2;border-radius:50%}
bdi{unicode-bidi:isolate}
.t>*{flex-shrink:0}
@media screen{body{background:#eee;padding:10px}.sheet{background:#fff;box-shadow:0 2px 12px #0003}}
</style>
<script src="shin/data.js"></script>
</head>
<body>
<div class="sheet" id="sheet"></div>
<script>
const SELF = ['I can read <bdi dir="rtl">' + SHIN.sh.ka + ' ' + SHIN.sh.pa + ' ' + SHIN.sh.sv + '</bdi>', 'I can write the letter <bdi dir="rtl">' + SHIN.sh.plain + '</bdi>'];
const one = `<div class="t">
  <div class="hd"><b>🎟️ Exit Ticket</b><span>Reading 1 · Letter <bdi dir="rtl">${SHIN.sh.plain}</bdi></span></div>
  <div class="name">Name: <i></i><span class="dt">Date:</span><i class="d"></i></div>
  <div class="q">Write the first sound of each picture.</div>
  <div class="opts">${SHIN.sh.ka} &nbsp;/&nbsp; ${SHIN.sh.pa} &nbsp;/&nbsp; ${SHIN.sh.sv}</div>
  <div class="pics">${SHIN.exit.map(e => `<div class="p"><img src="../games/${e.pic}" alt=""><i></i></div>`).join('')}</div>
  <div class="self">${SELF.map(s => `<div><span>${s}</span><span class="f"><span>😀</span><span>🙂</span><span>😕</span></span></div>`).join('')}</div>
</div>`;
document.getElementById('sheet').innerHTML = one.repeat(4);
</script>
</body>
</html>
