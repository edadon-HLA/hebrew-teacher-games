<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>צוֹבְעִים לְפִי צְלִיל — בּ · שׁ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@400;700;800&family=Rubik:wght@800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/print-ind.css?v=1">
<style>
/* Mon 11/30 (ב alone, teacher 11/19: one letter per Monday): colour-by-sound with ב + שׁ only — a balloon on a string over grass and a tree.
   Balloon areas = בּ (blue), grass / tree = שׁ (green), sky left white. p2 = the coloured answer. (The ב · ת · שׁ house version is now
   Lomdim-likro-tav-color-by-sound.html.) */
.ckey{display:flex;gap:9mm;justify-content:center;align-items:center;border:.5mm solid #1f2433;border-radius:3mm;padding:2mm 4mm;font-size:18pt;font-weight:800}
.ckey span{display:inline-flex;align-items:center;gap:2.5mm}
.ckey i{display:inline-block;width:9mm;height:9mm;border:.5mm solid #1f2433;border-radius:2mm}
.cpic{width:186mm;height:136mm;margin:0 auto;flex-shrink:0}
.cpic svg{width:100%;height:100%}
.fb{font-size:13pt;font-weight:700;text-align:center;border:.4mm dashed #9aa1ad;border-radius:2mm;padding:1.5mm}
</style>
<script src="../shared/print-ind.js?v=1"></script>
</head>
<body>
<div id="pages"></div>
<script>
const COL = { b: '#6aa8f0', g: '#7ccf8a' };
const KEY = [['בּ', 'כָּחֹל', 'b'], ['שׁ', 'יָרֹק', 'g']];
/* a circle sector as a polygon (angles in degrees, 0 = right, clockwise in SVG) */
const wedge = (cx, cy, r, a0, a1) => { const p = [cx, cy]; for (let a = a0; a <= a1 + .01; a += (a1 - a0) / 12){ const t = a * Math.PI / 180; p.push(Math.round(cx + r * Math.cos(t)), Math.round(cy + r * Math.sin(t))); } return p; };
const R = [
  /* balloon (בּ, blue): 3 sectors + the knot */
  { t: 'poly', a: wedge(270, 160, 95, -90, 30), s: 'בָּ', c: 'b', l: [310, 135] },
  { t: 'poly', a: wedge(270, 160, 95, 30, 150), s: 'בַּ', c: 'b', l: [270, 215] },
  { t: 'poly', a: wedge(270, 160, 95, 150, 270), s: 'בְּ', c: 'b', l: [230, 135] },
  /* grass (שׁ, green) */
  { t: 'rect', a: [0, 380, 150, 60], s: 'שָׁ', c: 'g', l: [75, 412] }, { t: 'rect', a: [150, 380, 150, 60], s: 'שְׁ', c: 'g', l: [225, 412] },
  { t: 'rect', a: [300, 380, 150, 60], s: 'שַׁ', c: 'g', l: [375, 412] }, { t: 'rect', a: [450, 380, 150, 60], s: 'שָׁ', c: 'g', l: [525, 412] },
  /* tree crown (שׁ, green) */
  { t: 'poly', a: wedge(500, 215, 62, 90, 270), s: 'שַׁ', c: 'g', l: [475, 215] },
  { t: 'poly', a: wedge(500, 215, 62, -90, 90), s: 'שְׁ', c: 'g', l: [527, 215] } ];
const DECO = [{ t: 'poly', a: [258, 266, 282, 266, 270, 252], fill: '#6aa8f0' }, { t: 'rect', a: [268, 264, 4, 116], fill: '#555' }, { t: 'rect', a: [490, 270, 20, 110], fill: '#b07a4a' }];
const page = ex => PI.page(`${PI.top('צוֹבְעִים לְפִי צְלִיל', { tag: ex ? 'Answer' : '' })}
  <div class="ckey">${KEY.map(([l, w, c]) => `<span><i style="background:${COL[c]}"></i>${l} = ${w}</span>`).join('')}</div>
  ${PI.ins(0, 'צִבְעוּ כָּל חֵלֶק לְפִי הָאוֹת. הַתְּנוּעָה לֹא מְשַׁנָּה.')}
  <div class="cpic">${PI.colorSvg(R, DECO, COL, ex)}</div>
  <div class="fb">אֵין צְבָעִים? כִּתְבוּ בְּכָל חֵלֶק: 1 = בּ, 2 = שׁ.</div>`);
document.getElementById('pages').innerHTML = page(false) + page(true);
</script>
</body>
</html>
