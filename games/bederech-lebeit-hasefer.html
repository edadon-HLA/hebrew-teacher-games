<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>בדרך לבית הספר</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#eef8ff;color:#173b63}
#game{max-width:1100px;margin:0 auto;padding:18px}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.title{font-size:clamp(24px,4vw,40px);font-weight:800;text-align:center;flex:1}
.pill{background:#fff;border:2px solid #b9d9ee;border-radius:20px;padding:9px 15px;font-weight:800;white-space:nowrap}
.main{display:grid;grid-template-columns:1.55fr .75fr;gap:14px}
.scene{border:2px solid #c6dfef;border-radius:18px;overflow:hidden;background:#dff3ff}
.art{position:relative;height:520px;background:linear-gradient(#a9ddf8 0 55%,#86c875 55% 67%,#777 67% 82%,#ded7cc 82%)}
.skyline{position:absolute;bottom:45%;left:0;right:0;height:95px;opacity:.35;background:repeating-linear-gradient(90deg,#7299ad 0 28px,transparent 28px 45px)}
.cloud{position:absolute;top:34px;left:60px;width:145px;height:38px;background:#fff;border-radius:30px;opacity:.8}
.house{position:absolute;left:5%;bottom:18%;width:32%;height:40%;background:#fff;border:4px solid #675044;border-radius:7px}
.house:before{content:'';position:absolute;left:-8%;top:-38%;width:116%;height:48%;background:#c97858;clip-path:polygon(50% 0,100% 100%,0 100%);border:4px solid #675044}
.window{position:absolute;top:25%;width:25%;height:27%;background:#9dd6e9;border:4px solid #496679}
.window.a{left:12%}.window.b{right:12%}
.door{position:absolute;bottom:0;left:39%;width:24%;height:39%;background:#557994;border:4px solid #405b6e}
.school{position:absolute;right:5%;bottom:18%;width:41%;height:41%;background:#b96d4d;border:4px solid #704335;border-radius:7px}
.school:before{content:'';position:absolute;left:-3%;top:-18%;width:106%;height:23%;background:#755048;border-radius:7px}
.schooldoor{position:absolute;bottom:0;left:41%;width:19%;height:39%;background:#486b7c;border:3px solid #334d5b}
.sw{position:absolute;top:30%;width:13%;height:23%;background:#a7d9e9;border:3px solid #405b70}
.sw.a{left:10%}.sw.b{left:32%}.sw.c{right:10%}
.sign{position:absolute;top:6%;left:23%;width:54%;background:white;border:2px solid #704335;border-radius:5px;text-align:center;padding:5px;font-weight:800}
.label{position:absolute;bottom:7%;background:#fff;border-radius:12px;padding:7px 16px;font-size:20px;font-weight:800}
.home-label{left:8%}.school-label{right:9%}
.road{position:absolute;bottom:13%;left:0;right:0;border-top:5px dashed #eee}
.student{position:absolute;bottom:17%;left:43%;font-size:72px;z-index:4}
.bubble{position:absolute;left:37%;top:9%;background:#fff;border:4px solid #466b88;border-radius:38px;padding:13px 22px;font-size:50px;min-width:115px;text-align:center;z-index:6;box-shadow:0 3px 0 #b8d1df}
.bubble:after{content:'';position:absolute;bottom:-22px;left:28px;border-width:14px 10px 0;border-style:solid;border-color:#466b88 transparent transparent}
.map{position:absolute;left:5%;top:15px;width:270px;background:#fff;border:3px solid #8bbbd8;border-radius:14px;padding:9px;z-index:8}
.map-title{text-align:center;font-size:18px;font-weight:800;margin-bottom:5px}
.map svg{width:100%;height:145px;display:block}
.map path{stroke:#52758b;stroke-width:2}
.side{border:2px solid #c6dfef;border-radius:18px;background:#fff;padding:18px}
.question{font-size:27px;font-weight:800;text-align:center;margin:8px 0 20px;min-height:66px;display:flex;align-items:center;justify-content:center}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.answer{min-height:58px;border:2px solid #b8d8eb;background:#eef8ff;border-radius:14px;padding:10px;font-size:20px;font-weight:800;cursor:pointer}
.answer:hover{background:#dcefff}.answer.good{background:#c8efd0;border-color:#54a567}.answer.bad{background:#ffd2d2;border-color:#d56b6b}
.feedback{text-align:center;min-height:32px;font-size:18px;font-weight:800;margin:13px 0}
.next{width:100%;border:0;border-radius:14px;padding:13px;background:#287fb8;color:#fff;font-size:19px;font-weight:800;cursor:pointer}
.next:disabled{opacity:.45;cursor:not-allowed}
.progress{height:9px;background:#e4edf3;border-radius:9px;margin-top:13px;overflow:hidden}
.bar{height:100%;background:#287fb8;width:0;transition:.3s}
.info{display:flex;justify-content:space-around;gap:10px;margin-top:10px;padding:11px;border:2px solid #c6dfef;border-radius:14px;background:#f7fcff;text-align:center;font-weight:800}
.info span{font-size:13px;font-weight:normal;display:block;margin-top:3px}
@media(max-width:760px){.main{grid-template-columns:1fr}.art{height:470px}.map{width:220px}.bubble{left:38%;font-size:40px}.student{font-size:60px}.house{width:34%}.school{width:43%}}
</style>
</head>
<body>
<div id="game">
<div class="head">
<div class="pill" id="score">ניקוד: 0 ⭐</div>
<div class="title">בדרך לבית הספר</div>
<div class="pill" id="count">שאלה 1 מתוך 15</div>
</div>
<div class="main">
<section class="scene"><div class="art">
<div class="cloud"></div><div class="skyline"></div><div class="road"></div>
<div class="map"><div class="map-title">איפה הוא/היא גר/ה?</div>
<svg viewBox="0 0 250 145" aria-label="מפת חמשת הרבעים של ניו יורק">
<path id="m-staten" d="M18 105 Q40 92 67 105 L72 126 Q43 140 17 126Z" fill="#dbeaf2"/>
<path id="m-brooklyn" d="M102 75 Q145 66 189 82 L205 113 Q167 126 116 115 L94 94Z" fill="#dbeaf2"/>
<path id="m-queens" d="M128 37 Q178 22 229 45 L218 80 Q180 84 151 70 L119 58Z" fill="#dbeaf2"/>
<path id="m-bronx" d="M160 7 Q196 0 231 16 L229 40 Q196 48 169 35Z" fill="#dbeaf2"/>
<path id="m-manhattan" d="M118 18 L143 17 L153 72 L139 91 L123 74Z" fill="#dbeaf2"/>
<text x="151" y="27" font-size="11" font-weight="700">הברונקס</text><text x="177" y="57" font-size="11" font-weight="700">קווינס</text><text x="130" y="55" font-size="10" font-weight="700">מנהטן</text><text x="153" y="96" font-size="11" font-weight="700">ברוקלין</text><text x="29" y="121" font-size="10" font-weight="700">סטטן איילנד</text>
</svg></div>
<div class="house"><div class="window a"></div><div class="window b"></div><div class="door"></div></div>
<div class="school"><div class="sw a"></div><div class="sw b"></div><div class="sw c"></div><div class="schooldoor"></div><div class="sign">בית ספר<br>HLA</div></div>
<div class="bubble" id="bubble">🍎</div><div class="student" id="student">🧒</div>
<div class="label home-label">בית</div><div class="label school-label">בית ספר</div>
</div></section>
<aside class="side"><div class="question" id="question"></div><div class="answers" id="answers"></div><div class="feedback" id="feedback" aria-live="polite"></div><button class="next" id="next" type="button" disabled>לשאלה הבאה →</button><div class="progress"><div class="bar" id="bar"></div></div></aside>
</div>
<div class="info"><div>🏫 בית ספר<span>לאן הוא/היא הולך/ת?</span></div><div>📍 אני גר/ה<span>באיזה אזור הוא/היא גר/ה?</span></div><div>✨ חדש / ישן<span>איך נראה החפץ?</span></div></div>
</div>
<script>
(function(){
const boroughs=[{id:'brooklyn',name:'ברוקלין'},{id:'queens',name:'קווינס'},{id:'manhattan',name:'מנהטן'},{id:'bronx',name:'הברונקס'},{id:'staten',name:'סטטן איילנד'}];
const foods=[['🍕','פיצה'],['🍔','המבורגר'],['🍎','תפוח'],['🍦','גלידה'],['🍉','אבטיח'],['🍩','דונאט']];
const objects=[['🎒','תיק'],['📚','ספר'],['⚽','כדור'],['🚲','אופניים'],['🧸','דובי'],['🎸','גיטרה'],['🕶️','משקפיים'],['⌚','שעון']];
let scenarios=[];
for(let i=0;i<15;i++){const b=boroughs[i%5],go=i%2===0?'school':'home',isFood=i%3!==0,list=isFood?foods:objects,item=list[i%list.length],old=!isFood&&i%2===1;scenarios.push({b,go,isFood,item,old,student:i%2?'👧':'🧒'})}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
shuffle(scenarios);let index=0,score=0,answered=false;const $=id=>document.getElementById(id);
function makeOptions(correct,list){const unique=[correct,...list.filter(x=>x!==correct)];return shuffle(unique).slice(0,Math.min(4,unique.length))}
function render(){
answered=false;$('next').disabled=true;$('feedback').textContent='';
const s=scenarios[index];$('student').textContent=s.student;$('bubble').textContent=s.item[0];
boroughs.forEach(b=>{const p=$('m-'+b.id);p.setAttribute('fill',b.id===s.b.id?'#f4b84a':'#dbeaf2')});
const type=index%4;
if(type===0){$('question').textContent='לאן הוא/היא הולך/ת?';const correct=s.go==='school'?'בית ספר':'בית';draw(makeOptions(correct,['בית','בית ספר','פארק','חנות']),correct)}
else if(type===1){$('question').textContent='מה הוא/היא אוהב/ת?';const correct=s.isFood?s.item[1]:foods[(index+2)%foods.length][1];draw(makeOptions(correct,foods.map(x=>x[1])),correct)}
else if(type===2){$('question').textContent='איפה הוא/היא גר/ה?';draw(makeOptions(s.b.name,boroughs.map(x=>x.name)),s.b.name)}
else if(!s.isFood){$('question').textContent='החפץ בבועת המחשבה חדש או ישן?';const correct=s.old?'ישן':'חדש';draw(makeOptions(correct,['חדש','ישן','גם חדש וגם ישן','לא יודעים']),correct)}
else{$('question').textContent='איפה הוא/היא גר/ה?';draw(makeOptions(s.b.name,boroughs.map(x=>x.name)),s.b.name)}
$('count').textContent=`שאלה ${index+1} מתוך ${scenarios.length}`;$('score').textContent=`ניקוד: ${score} ⭐`;$('bar').style.width=(index/scenarios.length*100)+'%';
}
function draw(values,correct){const box=$('answers');box.innerHTML='';values.forEach(value=>{const button=document.createElement('button');button.type='button';button.className='answer';button.textContent=value;button.addEventListener('click',()=>answer(button,value,correct));box.appendChild(button)})}
function answer(button,value,correct){if(answered)return;answered=true;document.querySelectorAll('#answers .answer').forEach(b=>{b.disabled=true;if(b.textContent===correct)b.classList.add('good')});if(value===correct){score++;$('feedback').textContent='נכון! 🎉'}else{button.classList.add('bad');$('feedback').textContent='לא בדיוק. התשובה היא: '+correct}$('score').textContent=`ניקוד: ${score} ⭐`;$('next').disabled=false}
$('next').addEventListener('click',()=>{index++;if(index>=scenarios.length){shuffle(scenarios);index=0;score=0}render()});render();
})();
</script>
</body>
</html>
