<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>משחק: בית ספר</title>
<style>
:root{--bg:#f6f7fb;--fg:#1f2430;--muted:#6b7280;--card:#fff;--line:#d8dce6;--acc:#3b6df0;--good:#1f9d55;--bad:#d64545;--sky:#dff1ff;--grass:#bfe3a5;--map:#e6e9ef;--water:#cfe8fb;--hl:#ffab2e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161c;--fg:#eef0f6;--muted:#9aa3b5;--card:#1e222b;--line:#343a48;--acc:#7c9dff;--good:#2fae68;--bad:#ff7a7a;--sky:#1f3348;--grass:#2f4f2c;--map:#3a4050;--water:#1d3550;--hl:#ffb84d}}
:root[data-theme="dark"]{--bg:#14161c;--fg:#eef0f6;--muted:#9aa3b5;--card:#1e222b;--line:#343a48;--acc:#7c9dff;--good:#2fae68;--bad:#ff7a7a;--sky:#1f3348;--grass:#2f4f2c;--map:#3a4050;--water:#1d3550;--hl:#ffb84d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
main{max-width:980px;margin:0 auto;padding:12px;display:grid;gap:12px}
@media(min-width:800px){main{grid-template-columns:1.35fr 1fr}header{grid-column:1/-1}}
header{display:flex;justify-content:space-between;align-items:center;font-size:20px;font-weight:700}
.stage{position:relative;height:380px;background:linear-gradient(var(--sky) 0 50%,var(--grass) 50%);border-radius:16px;overflow:hidden;display:flex;justify-content:space-between;align-items:flex-end;padding:8px 10px;direction:ltr;border:1px solid var(--line)}
.col{display:flex;flex-direction:column;align-items:center;gap:2px}
.col svg{width:min(32vw,170px);height:auto;border-radius:14px;box-shadow:0 3px 10px rgba(0,0,0,.25);margin-bottom:6px}
.big{font-size:clamp(76px,22vw,120px);line-height:1}
.col:first-child .big{font-size:clamp(105px,30vw,155px)}
.col small{font-weight:700;font-size:17px;background:var(--card);border-radius:8px;padding:0 10px}
.walker{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;z-index:2}
.kid{font-size:56px;line-height:1}
.walk .kid{animation:bob .45s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.name{font-size:14px;font-weight:700;background:var(--card);border-radius:8px;padding:0 8px}
.bubble{position:relative;background:var(--card);border:2px solid var(--line);border-radius:24px;padding:6px 12px;margin-bottom:22px;font-size:38px;line-height:1.2;min-width:72px;text-align:center}
.bubble small{font-size:16px;position:absolute;top:-4px;right:-2px}
.bubble::after{content:"";position:absolute;bottom:-16px;left:50%;width:14px;height:14px;background:var(--card);border:2px solid var(--line);border-radius:50%}
.bubble::before{content:"";position:absolute;bottom:-26px;left:46%;width:8px;height:8px;background:var(--card);border:2px solid var(--line);border-radius:50%}
.item{position:relative;display:inline-block}
.item.new{filter:saturate(1.4) drop-shadow(0 0 6px gold)}
.item.new::after{content:"✨";position:absolute;top:-10px;right:-14px;font-size:22px}
.item.old{filter:sepia(1) brightness(.72) contrast(.85) saturate(.7);transform:rotate(-14deg) scale(.95)}
.item.old::after{content:"🕸️";position:absolute;top:-8px;right:-12px;font-size:20px;filter:none}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;direction:rtl;text-align:right;align-self:start}
.q{font-size:28px;font-weight:700;margin:0}
.en{direction:ltr;text-align:right;color:var(--muted);font-size:14px;margin:4px 0 0}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{font:inherit;font-size:22px;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer;text-align:right}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt.ok{background:var(--good);border-color:var(--good);color:#fff}
.opt.no{border-color:var(--bad);opacity:.45;text-decoration:line-through}
.fb{min-height:34px;font-size:20px;font-weight:700;margin-top:10px}
.next{font:inherit;font-size:20px;font-weight:700;padding:10px 20px;border:0;border-radius:12px;background:var(--acc);color:#fff;cursor:pointer}
.next[hidden]{display:none}
</style>
<style id="site-navigation">
.site-nav{position:sticky;top:0;z-index:9999;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 16px;background:rgba(255,255,255,.97);border-bottom:1px solid #dfe4ec;box-shadow:0 3px 12px rgba(20,30,50,.08);font-family:Arial,"Noto Sans Hebrew",sans-serif;direction:rtl}
.site-nav .nav-title{font-weight:900;color:#182235;margin-left:auto;margin-right:4px}
.site-nav a,.site-nav button{appearance:none;border:1px solid #dfe4ec;background:#fff;color:#27324a;text-decoration:none;font:700 14px Arial,"Noto Sans Hebrew",sans-serif;border-radius:10px;padding:8px 12px;cursor:pointer;white-space:nowrap}
.site-nav a:hover,.site-nav button:hover{background:#f1f4f9;border-color:#c7cfdd}
.site-nav .nav-home{background:#182235;color:#fff;border-color:#182235}
.site-nav .nav-back{background:#eef2ff;color:#3730a3;border-color:#d9defd}
@media(max-width:600px){.site-nav{padding:8px;gap:6px}.site-nav .nav-title{width:100%;margin:0 0 2px}.site-nav a,.site-nav button{font-size:13px;padding:7px 9px}}
.site-nav .nav-fs{background:#0f766e;color:#fff;border-color:#0f766e}.site-nav .nav-fs[hidden]{display:none}
</style></head>
<body><nav class="site-nav" aria-label="ניווט באתר"><span class="nav-title">🎓 משחקי עברית</span><a class="nav-home" href="../index.html">דף הבית</a><a href="../games/index.html">🎮 משחקים</a><a href="../olam-street-lessons/index.html">📚 Olam Street Lessons</a><a href="../niflaot-lessons/index.html">✨ Niflaot Lessons</a><button class="nav-back" type="button" onclick="if(history.length>1){history.back()}else{location.href='../games/index.html'}">← חזרה</button><button class="nav-fs" id="fsBtn" type="button" hidden>⛶ מסך מלא</button></nav>
<main>
<header><span>בית ספר 🏫</span><span id="score"></span></header>
<section class="stage">
  <div class="col"><div id="map"></div><div class="big">🏠</div><small>בית</small></div>
  <div class="walker" id="walker"><div class="bubble" id="bubble"></div><div class="kid" id="kid"></div><div class="name" id="nm"></div></div>
  <div class="col"><div class="big">🏫</div><small>בית ספר</small></div>
</section>
<section class="panel">
  <p class="q" id="q"></p><p class="en" id="en"></p>
  <div class="opts" id="opts"></div>
  <div class="fb" id="fb"></div>
  <button class="next" id="next" hidden>הבא ◀</button>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
const pick=a=>a[Math.random()*a.length|0];
const shuffle=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const B=[
 {he:'מנהטן',pre:'במנהטן',p:'96,46 104,54 108,64 105,80 99,100 93,118 84,133 77,131 82,112 84,92 88,72 91,58',l:[68,92],a:'end'},
 {he:'ברונקס',pre:'בברונקס',p:'92,30 100,14 128,8 152,20 156,40 142,52 120,50 104,54 96,46',l:[126,34]},
 {he:'קווינס',pre:'בקווינס',p:'112,62 132,54 158,56 178,66 190,80 188,102 172,112 160,128 138,134 120,120 110,100 110,80',l:[152,92]},
 {he:'ברוקלין',pre:'בברוקלין',p:'90,132 100,122 120,120 138,134 160,128 156,150 140,166 116,174 96,168 84,152',l:[120,152]},
 {he:'סטטן איילנד',pre:'בסטטן איילנד',p:'26,150 44,140 62,144 68,162 60,184 40,190 26,176',l:[46,164]}
];
const O=[{he:'כובע',en:'hat',e:'🧢'},{he:'ספר',en:'book',e:'📕'},{he:'תיק',en:'bag',e:'🎒'},{he:'כדור',en:'ball',e:'⚽'},{he:'שעון',en:'watch',e:'⌚'},{he:'טלפון',en:'phone',e:'📱'}];
const F=[{he:'פיצה',e:'🍕'},{he:'תפוח',e:'🍎'},{he:'גלידה',e:'🍦'},{he:'בננה',e:'🍌'},{he:'עוגה',e:'🍰'},{he:'המבורגר',e:'🍔'}];
const M=['דני','יוסי','נועם','איתי'],G=['נועה','מיכל','שירה','תמר'];
let R,score=0,total=0,streak=0,missed=false,answered=false,lastT='';

function mapSvg(b){
  const nj='0,0 70,0 72,40 76,80 74,116 62,130 44,136 20,138 0,138';
  const li='190,80 200,78 200,120 172,112 188,102';
  const txt=x=>{const on=x===b,ps=x.he.split(' ');
    return `<text text-anchor="${x.a||'middle'}" font-size="${ps.length>1?9:11}" font-weight="800" style="fill:${on?'#1a1a1a':'var(--fg)'};paint-order:stroke;stroke:${on?'rgba(255,255,255,.7)':'var(--card)'};stroke-width:2.5;stroke-linejoin:round">`+
      ps.map((w,i)=>`<tspan x="${x.l[0]}" y="${x.l[1]+i*11}">${w}</tspan>`).join('')+`</text>`};
  return `<svg viewBox="0 0 200 200"><defs><pattern id="wv" width="14" height="10" patternUnits="userSpaceOnUse"><path d="M0 5 Q3.5 2 7 5 T14 5" fill="none" style="stroke:var(--fg)" stroke-opacity=".08"/></pattern></defs>`+
  `<rect width="200" height="200" style="fill:var(--water)"/><rect width="200" height="200" fill="url(#wv)"/>`+
  `<polygon points="${nj}" style="fill:var(--map)" opacity=".55"/><polygon points="${li}" style="fill:var(--map)" opacity=".55"/>`+
  `<text x="22" y="30" font-size="9" font-weight="700" style="fill:var(--muted)">NJ</text>`+
  B.map(x=>`<polygon points="${x.p}" stroke-linejoin="round" style="fill:${x===b?'var(--hl)':'var(--map)'};stroke:${x===b?'#b86a00':'var(--fg)'};stroke-width:${x===b?2.2:1};stroke-opacity:${x===b?1:.35}"/>`).join('')+
  `<line x1="70" y1="90" x2="86" y2="90" style="stroke:var(--fg)" stroke-opacity=".5"/>`+
  B.map(txt).join('')+
  `<text x="186" y="194" font-size="9" text-anchor="end" font-weight="700" style="fill:var(--muted)">N ↑</text></svg>`;
}
function score_(){$('score').textContent=`⭐ ${score}/${total}  🔥 ${streak}`}

function newRound(){
  const f=Math.random()<.5, obj=Math.random()<.5;
  R={f,name:pick(f?G:M),dest:pick(['school','home']),b:pick(B),obj,it:pick(obj?O:F),st:obj?pick(['new','old']):''};
  $('map').innerHTML=mapSvg(R.b);
  $('kid').textContent=f?'👧':'👦';
  $('nm').textContent=R.name;
  $('bubble').innerHTML=`<small>❤️</small><span class="item ${R.st}">${R.it.e}</span>`;
  const w=$('walker');
  w.classList.remove('walk');w.style.transition='none';w.style.left='50%';void w.offsetWidth;
  w.classList.add('walk');w.style.transition='left 3.5s linear';w.style.left=R.dest==='school'?'62%':'38%';
  buildQ();
}
$('walker').addEventListener('transitionend',()=>$('walker').classList.remove('walk'));

function buildQ(){
  const g=R.f,n=R.name;
  const types=['go','live3','live1','like'];if(R.obj)types.push('state','state');
  let t;do{t=pick(types)}while(t===lastT&&types.length>1);lastT=t;
  let q,en,o;
  if(t==='go'){q=`לאן ${n} ${g?'הולכת':'הולך'}?`;en=`Where is ${n} walking?`;
    o=[{t:'לבית ספר',ok:R.dest==='school'},{t:'הביתה',ok:R.dest==='home'}];}
  else if(t==='live3'){q=`איפה ${n} ${g?'גרה':'גר'}?`;en=`Where does ${n} live?`;
    o=B.map(x=>({t:x.pre,ok:x===R.b}));}
  else if(t==='live1'){q=`מה ${n} אומר${g?'ת':''}?`;en=`What does ${n} say?`;
    const v=(f,b)=>`אני ${f?'גרה':'גר'} ${b.pre}`,ot=pick(B.filter(x=>x!==R.b));
    o=shuffle([{t:v(g,R.b),ok:true},{t:v(!g,R.b)},{t:v(g,ot)},{t:v(!g,ot)}]);}
  else if(t==='like'){q=`מה ${n} אוהב${g?'ת':''}?`;en=`What does ${n} like?`;
    const pool=R.obj?O:F;
    o=shuffle([R.it,...shuffle(pool.filter(x=>x!==R.it)).slice(0,3)]).map(x=>({t:`${x.e} ${x.he}`,ok:x===R.it}));}
  else{q=`ה${R.it.he} חדש או ישן?`;en=`Is the ${R.it.en} new or old?`;
    o=[{t:'חדש',ok:R.st==='new'},{t:'ישן',ok:R.st==='old'}];}
  $('q').textContent=q;$('en').textContent=en;$('fb').textContent='';$('next').hidden=true;
  missed=false;answered=false;
  const box=$('opts');box.innerHTML='';
  o.forEach(x=>{const b=document.createElement('button');b.className='opt';b.textContent=x.t;b.onclick=()=>ans(x,b);box.appendChild(b)});
}
function ans(x,b){
  if(answered)return;
  if(x.ok){answered=true;total++;if(!missed){score++;streak++}
    b.classList.add('ok');$('fb').textContent='כל הכבוד! 🎉';$('next').hidden=false;
    document.querySelectorAll('.opt').forEach(e=>e.disabled=true);}
  else{missed=true;streak=0;b.classList.add('no');b.disabled=true;$('fb').textContent='לא בדיוק, נסו שוב 🙂';}
  score_();
}
$('next').onclick=newRound;
score_();newRound();
</script>
<script id="fs-script">
(function(){var b=document.getElementById("fsBtn"),d=document,e=d.documentElement;
var req=e.requestFullscreen||e.webkitRequestFullscreen,ex=d.exitFullscreen||d.webkitExitFullscreen;
if(!b||!req){return}b.hidden=false;
function on(){return d.fullscreenElement||d.webkitFullscreenElement}
function lbl(){b.textContent=on()?"✕ יציאה ממסך מלא":"⛶ מסך מלא"}
b.addEventListener("click",function(){if(on()){ex.call(d)}else{req.call(e)}});
d.addEventListener("fullscreenchange",lbl);d.addEventListener("webkitfullscreenchange",lbl);})();
</script>
</body></html>
