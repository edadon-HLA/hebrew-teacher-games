<style>
:root{--bg:#fdf7ef;--card:#fff;--ink:#23233a;--muted:#6b6880;--line:#eadfce;--green:#2f9d55;--green-soft:#dcf2e3;--red:#e2506a;--red-soft:#fde3e7;--sky:#2a8bd0;--gold:#f2b01e;--f:'Rubik','Noto Sans Hebrew',Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);line-height:1.45}
.wrap{max-width:900px;margin:0 auto;padding:14px 16px 40px}
h1{margin:6px 0 2px;font-size:clamp(28px,5vw,44px);font-weight:800;text-align:center}
.sub{text-align:center;color:var(--muted);font-size:18px;margin-bottom:14px}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;box-shadow:0 8px 24px #23233a14;padding:18px}
.btn{font:700 20px var(--f);border:0;border-radius:14px;padding:12px 24px;background:var(--sky);color:#fff;cursor:pointer}
.btn:hover{filter:brightness(.92)}
.btn.ghost{background:#fff;color:var(--sky);border:2px solid var(--sky)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:14px 0}
.mode{border:3px solid var(--line);border-radius:20px;background:#fff;padding:22px 16px;cursor:pointer;text-align:center;font-family:var(--f);color:var(--ink)}
.mode:hover{border-color:var(--sky);background:#f0f7fd;transform:translateY(-2px)}
.mode .big{font-size:56px;line-height:1.1}.mode h2{margin:6px 0 4px;font-size:26px}.mode p{margin:0;color:var(--muted);font-size:17px}
.opts{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;align-items:center;margin:8px 0 12px;font-size:18px;font-weight:600}
.opts select{font:600 18px var(--f);padding:7px 10px;border-radius:10px;border:2px solid var(--line)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:800;font-size:20px;margin-bottom:8px}
.dots{display:flex;gap:5px;flex-wrap:wrap}.dots i{width:22px;height:9px;border-radius:5px;background:#e2d8c6}.dots i.cur{background:var(--sky)}.dots i.y{background:var(--green)}.dots i.n{background:var(--red)}
.pic{max-width:440px;margin:6px auto 10px;border-radius:20px;overflow:hidden;border:5px solid #fff;box-shadow:0 8px 22px #0003;background:#fff}
.pic svg{display:block;width:100%;height:auto}
.pic img.ph{display:block;width:100%;aspect-ratio:4/3;object-fit:contain;background:#fff}
.pic svg.ho-svg{aspect-ratio:4/3}
.desc{text-align:center;font-size:clamp(30px,5vw,46px);font-weight:800;margin:6px 0 12px;min-height:1.4em}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ans{font:800 clamp(24px,4vw,34px) var(--f);padding:16px 10px;border-radius:18px;border:3px solid var(--line);background:#fff;cursor:pointer;color:var(--ink);display:flex;gap:10px;align-items:center;justify-content:center}
.ans:hover:not(:disabled){border-color:var(--sky);background:#f0f7fd}
.ans .k{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#efe6d6;font-size:17px;flex:none}
.ans.ok{background:var(--green);border-color:var(--green);color:#fff}.ans.ok .k{background:#fff;color:var(--green)}
.ans.no{background:var(--red-soft);border-color:var(--red);color:#8a2b3d}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.yn button{font:800 clamp(28px,5vw,42px) var(--f);padding:22px 10px;border-radius:22px;border:0;cursor:pointer;color:#fff;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.yn .y{background:var(--green)}.yn .n{background:var(--red)}
.yn button:disabled{opacity:.45;cursor:default}.yn button.picked{outline:6px solid #23233a55}
.yn .ico{font-size:58px;line-height:1}
.fb{min-height:44px;text-align:center;font-size:26px;font-weight:800;margin:10px 0}
.fb.ok{color:var(--green)}.fb.no{color:var(--red)}
.nextrow{text-align:center}
.end{text-align:center;padding:20px 0}.stars{font-size:70px;color:var(--gold);letter-spacing:6px}
.end h2{font-size:38px;margin:6px 0}
.tog{font:600 15px var(--f);border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;cursor:pointer;color:var(--ink)}
[hidden]{display:none!important}
@media(max-width:620px){.modes{grid-template-columns:1fr}.answers{grid-template-columns:1fr}}
</style>

  if (it.ph) return `<img class="ph" src="${(window.BAYIT_PH || {})[it.ph]}" alt="">`;
  if (it.ho) return HouseOut.svg({ vb: fit43(HouseOut.box(it.ho, 24)) });
  if (it.hov) return HouseOut.svg({ vb: it.hov, kids: it.kids, extra: it.extra });
  return HomeArt.svg(it.k);
}
let mode = 'normal', deck = [], i = 0, score = 0, answered = false, res = [], voiceOn = false;
const heVoice = () => (speechSynthesis.getVoices() || []).find(v => /^(he|iw)/i.test(v.lang));
function say(t){ if (!voiceOn || !('speechSynthesis' in window)) return; const v = heVoice(); if (!v) return; speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.voice = v; u.lang = v.lang; u.rate = .85; speechSynthesis.speak(u); }

function pickWrong(item, n){
  const same = shuffle(POOL.filter(x => x !== item && x.c === item.c)), other = shuffle(POOL.filter(x => x !== item && x.c !== item.c));
  return same.concat(other).slice(0, n);
}
function start(m){
  mode = m; voiceOn = $('voice').value === '1'; POOL = SETS[$("wset").value] || ITEMS;
  let n = +$("nQ").value; const pool = shuffle(POOL); n = Math.min(n, pool.length);
  deck = pool.slice(0, n).map((it, k) => {
    if (m === 'normal') return { it, opts: shuffle([it, ...pickWrong(it, 3)]) };
    const fits = k % 2 === 0;                                     /* half of the sentences fit the picture */
    return { it, fits, shown: fits ? it : pickWrong(it, 1)[0] };
  });
  deck = shuffle(deck); i = 0; score = 0; res = [];
  $('start').hidden = true; $('end').hidden = true; $('game').hidden = false; show();
}
function dots(){ $('dots').innerHTML = deck.map((_, k) => `<i class="${k === i && !answered ? 'cur' : res[k] === true ? 'y' : res[k] === false ? 'n' : ''}"></i>`).join(''); $('score').textContent = '⭐ ' + score; }
function show(){
  const q = deck[i]; answered = false; $('fb').textContent = ''; $('fb').className = 'fb'; $('next').hidden = true;
  $("pic").innerHTML = picOf(q.it);
  const area = $('area');
  if (mode === 'normal'){
    $('desc').textContent = 'מַה זֶה?';
    area.className = 'answers'; area.innerHTML = '';
    q.opts.forEach((o, n) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'ans'; b.dataset.k = o.k; b.innerHTML = `<span class="k">${n + 1}</span><span>${o.he}</span>`; b.onclick = () => pickNormal(o, b); area.appendChild(b); });
  } else {
    $('desc').textContent = q.shown.d;
    area.className = 'yn'; area.innerHTML = `<button class="y" id="yBtn" type="button"><span class="ico">✔</span>מַתְאִים</button><button class="n" id="nBtn" type="button"><span class="ico">✖</span>לֹא מַתְאִים</button>`;
    $('yBtn').onclick = () => pickEasy(true, $('yBtn')); $('nBtn').onclick = () => pickEasy(false, $('nBtn'));
  }
  dots(); const spoken = mode === 'normal' ? 'מַה זֶה?' : q.shown.d; setTimeout(() => say(spoken), 250);
}
function finishQ(right){
  answered = true; res[i] = right; if (right) score++;
  $('fb').className = 'fb ' + (right ? 'ok' : 'no'); $('fb').textContent = right ? 'נָכוֹן! כָּל הַכָּבוֹד! 🎉' : 'אוּפְּס! לֹא הַפַּעַם';
  $('next').hidden = false; $('next').textContent = i === deck.length - 1 ? 'לַתּוֹצָאוֹת ✓' : 'הַבָּא ◀'; $('next').focus({ preventScroll: true }); dots();
}
function pickNormal(o, btn){
  if (answered) return; const q = deck[i], right = o === q.it;
  document.querySelectorAll('.ans').forEach(b => { b.disabled = true; if (b.dataset.k === q.it.k) b.classList.add('ok'); });
  if (!right) btn.classList.add('no');
  $('desc').textContent = q.it.he; say(q.it.he); finishQ(right);
}
function pickEasy(yes, btn){
  if (answered) return; const q = deck[i], right = yes === q.fits;
  $('yBtn').disabled = $('nBtn').disabled = true; btn.classList.add('picked');
  if (!right){ $('desc').textContent = q.it.d; }                  /* show the sentence that does fit */
  say(q.it.d); finishQ(right);
}
function next(){ if (!answered) return; i++; if (i < deck.length) show(); else end(); }
function end(){
  $('game').hidden = true; $('end').hidden = false;
  const r = score / deck.length, s = r >= .9 ? 3 : r >= .6 ? 2 : 1;
  $('stars').textContent = '★'.repeat(s) + '☆'.repeat(3 - s); $('endScore').textContent = `${score} מִתּוֹךְ ${deck.length}`;
  $('endMsg').textContent = s === 3 ? 'מְצֻיָּן!' : s === 2 ? 'כָּל הַכָּבוֹד!' : 'יֹפִי! עוֹד פַּעַם?';
}
$('mNormal').onclick = () => start('normal'); $('mEasy').onclick = () => start('easy');
{ const st = new URLSearchParams(location.search).get("set"); if (st && SETS[st]) $("wset").value = st; }
{ const q = new URLSearchParams(location.search).get('mode'); if (q === 'easy' || q === 'normal') start(q); }
$('next').onclick = next;
$('again').onclick = () => start(mode);
$('menu').onclick = () => { $('end').hidden = true; $('start').hidden = false; };
document.addEventListener('keydown', e => {
  if ($('game').hidden) return;
  if (!answered){
    if (mode === 'normal' && /^[1-4]$/.test(e.key)){ const b = $('area').children[+e.key - 1]; b && b.click(); }
    if (mode === 'easy'){ if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'y' || e.key === '1') $('yBtn').click(); if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'n' || e.key === '2') $('nBtn').click(); }
  } else if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); next(); }
});
})();
</script>
<script id="fs-script">
(function(){var b=document.getElementById("fsBtn"),d=document,e=d.documentElement;
var req=e.requestFullscreen||e.webkitRequestFullscreen,ex=d.exitFullscreen||d.webkitExitFullscreen;
if(!b||!req){return}b.hidden=false;
function on(){return d.fullscreenElement||d.webkitFullscreenElement}
function lbl(){b.textContent=on()?"✕ יציאה ממסך מלא":"⛶ מסך מלא"}
b.addEventListener("click",function(){if(on()){ex.call(d)}else{req.call(e)}});
d.addEventListener("fullscreenchange",lbl);d.addEventListener("webkitfullscreenchange",lbl);})();
</script>
