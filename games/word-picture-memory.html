<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>משחק זיכרון – מילים ותמונות</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Noto Sans Hebrew",sans-serif;background:#f5f7fb;color:#17324d;text-align:center}
header{padding:18px 12px 10px}
h1{margin:0 0 8px;font-size:clamp(25px,4vw,40px)}
.subtitle{font-size:20px;margin-bottom:10px}
.info{font-size:20px;margin:7px}
.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:12px 0 18px}
.control{border:2px solid #31506b;border-radius:10px;background:white;padding:10px 18px;font-size:18px;cursor:pointer}
.control:hover{background:#e8eef4}
#game{width:min(1120px,96vw);margin:0 auto 20px;display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.card{min-height:150px;border:4px solid #1769aa;border-radius:14px;background:white;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.15);padding:0;overflow:hidden}
.card:hover:not(.locked){transform:scale(1.02)}
.card-face{width:100%;min-height:150px;display:flex;align-items:center;justify-content:center;padding:10px}
.back{background:#2686cf;color:white;font-size:64px;font-weight:bold}
.front{display:none;background:white}
.card.open .back,.card.matched .back{display:none}
.card.open .front,.card.matched .front{display:flex}
.word{font-size:clamp(25px,3vw,38px);font-weight:bold}
.picture{font-size:70px;line-height:1;display:flex;align-items:center;justify-content:center;width:100%;height:100%}
.picture img{max-width:100%;width:min(150px,100%);height:120px;object-fit:contain;display:block}
.card.matched{border-color:#16803c;cursor:default;background:#f0fff4}
.card.matched .front{background:#f0fff4}
#message{min-height:35px;font-size:23px;font-weight:bold;margin:10px 0 24px}
@media(max-width:800px){#game{grid-template-columns:repeat(4,1fr)}.card,.card-face{min-height:125px}}
@media(max-width:560px){#game{grid-template-columns:repeat(3,1fr);gap:9px}.card,.card-face{min-height:110px}.back{font-size:46px}.picture{font-size:52px}.picture img{height:90px}}
</style>
</head>

};

const pairs = [
["שולחן", exactImages["שולחן"]],
["וילון", exactImages["וילון"]],
["ספה", "🛋️"],
["מנורה", "💡"],
["מיטה", "🛏️"],
["מקרר", exactImages["מקרר"]],
["תנור", exactImages["תנור"]],
["תפוח", "🍎"],
["בניין", "🏢"],
["בית", "🏠"]
];

const game=document.getElementById("game");
const pairsDisplay=document.getElementById("pairs");
const message=document.getElementById("message");
const newGameButton=document.getElementById("newGame");
const soundButton=document.getElementById("soundButton");

let first=null, second=null, busy=false, found=0, soundOn=true;

function shuffle(a){
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  return a;
}

function render(){
  game.innerHTML="";
  message.textContent="";
  first=null; second=null; busy=false; found=0;
  pairsDisplay.textContent="0";

  const cards=[];
  pairs.forEach((p,i)=>{
    cards.push({id:i,type:"word",value:p[0]});
    cards.push({id:i,type:"picture",value:p[1]});
  });
  shuffle(cards).forEach(makeCard);
}

function makeCard(d){
  const card=document.createElement("button");
  card.type="button";
  card.className="card";
  card.dataset.id=d.id;
  card.dataset.type=d.type;
  card.setAttribute("aria-label","קלף סגור");

  const back=document.createElement("span");
  back.className="card-face back";
  back.textContent="?";

  const front=document.createElement("span");
  front.className="card-face front";

  if(d.type==="word"){
    const w=document.createElement("span");
    w.className="word";
    w.textContent=d.value;
    front.appendChild(w);
  }else{
    const pic=document.createElement("span");
    pic.className="picture";
    if(typeof d.value==="string" && d.value.startsWith("data:image/")){
      const img=document.createElement("img");
      img.src=d.value;
      img.alt="תמונה";
      pic.appendChild(img);
    }else{
      pic.textContent=d.value;
    }
    front.appendChild(pic);
  }

  card.append(back,front);
  card.addEventListener("click",()=>flip(card));
  game.appendChild(card);
}

function flip(card){
  if(busy||card.classList.contains("open")||card.classList.contains("matched")) return;
  card.classList.add("open");
  if(soundOn) beep(520,.06);

  if(!first){first=card;return}
  second=card;
  busy=true;

  const match=first.dataset.id===second.dataset.id &&
              first.dataset.type!==second.dataset.type;

  if(match){
    first.classList.remove("open"); second.classList.remove("open");
    first.classList.add("matched"); second.classList.add("matched");
    found++; pairsDisplay.textContent=found;
    if(soundOn) beep(760,.12);
    first=null; second=null; busy=false;
    if(found===pairs.length){
      message.textContent="🎉 כל הכבוד! מצאתם את כל הזוגות!";
      if(soundOn){setTimeout(()=>beep(900,.12),100);setTimeout(()=>beep(1100,.18),230)}
    }
  }else{
    setTimeout(()=>{
      first.classList.remove("open");
      second.classList.remove("open");
      first=null; second=null; busy=false;
    },900);
  }
}

function beep(freq,duration){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return;
    const ctx=new AC(),o=ctx.createOscillator(),g=ctx.createGain();
    o.frequency.value=freq;o.type="sine";g.gain.value=.08;
    o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+duration);
    o.onended=()=>ctx.close();
  }catch(e){}
}

newGameButton.addEventListener("click",render);
soundButton.addEventListener("click",()=>{
  soundOn=!soundOn;
  soundButton.textContent=soundOn?"🔊 צליל: פעיל":"🔇 צליל: כבוי";
});
render();
})();
</script>
