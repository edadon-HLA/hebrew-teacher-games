<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>מי גר איפה? — גר / גרה</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f7fb;color:#172235;font-family:Arial,"Noto Sans Hebrew",sans-serif}
.wrap{max-width:1250px;margin:auto;padding:20px}
h1{margin:0;font-size:34px} .sub{font-size:18px;color:#5b687b;margin:6px 0 18px}
.layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(330px,.65fr);gap:18px}
.card{background:#fff;border:1px solid #d9e1ea;border-radius:18px;padding:16px;box-shadow:0 5px 18px rgba(30,55,90,.07)}
#map{width:100%} svg{width:100%;height:auto;display:block}
.state{fill:#e9eef4;stroke:#fff;stroke-width:1.3;cursor:pointer}
.state:hover{fill:#cfe0ef} .state.sel{fill:#8dc7ff;stroke:#23547f;stroke-width:2.6}
.label{font-size:9px;font-weight:800;fill:#25374b;text-anchor:middle;pointer-events:none}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:#627085}
.person{display:flex;gap:14px;align-items:center;margin:17px 0}
.photo{width:115px;height:115px;border-radius:16px;object-fit:cover;border:3px solid #d9e5ef;background:#edf2f6}
.person-name{font-size:23px;font-weight:800} .state-name{font-size:17px;color:#5c7085;margin-top:5px}
.q{font-size:23px;font-weight:800;line-height:1.35;margin:12px 0 15px}
.answers{display:grid;gap:10px} button{font-family:inherit;border:0;border-radius:12px;padding:13px;font-size:18px;font-weight:800;cursor:pointer;background:#edf2f7;color:#203047}
button:hover{background:#dde7f0} button:disabled{cursor:default}
.correct{background:#d8f4df!important} .wrong{background:#ffe0e0!important}
.next{width:100%;margin-top:12px;background:#1f608f;color:#fff!important}
.score{display:flex;justify-content:space-between;color:#5d6b7d;font-weight:800}
.feedback{min-height:30px;margin-top:12px;font-size:18px;font-weight:800}
.hint{margin-top:12px;color:#69778a;font-size:14px;line-height:1.45}
@media(max-width:850px){.layout{grid-template-columns:1fr}h1{font-size:28px}.q{font-size:20px}}
</style>
</head>
<body>
<div class="wrap">
<h1>מי גר איפה? — <span style="color:#1f608f">גר / גרה</span></h1>
<div class="sub">לחצו על מדינה במפה → ראו מי גר שם → ענו על השאלה.</div>
<div class="layout">
<section class="card">
<div id="map"></div>
<div class="legend">🔵 מדינה שנבחרה &nbsp; | &nbsp; לחצו על כל מדינה כדי לפתוח את הידוען שלה.</div>
</section>
<section class="card">
<div class="score"><span>שאלה <span id="qn">1</span> מתוך 20</span><span>ניקוד: <span id="score">0</span></span></div>
<div class="person">
<img id="photo" class="photo" alt="תמונת ידוען">
<div><div id="personName" class="person-name"></div><div id="stateName" class="state-name"></div></div>
</div>
<div id="question" class="q"></div>
<div id="answers" class="answers"></div>
<div id="feedback" class="feedback" aria-live="polite"></div>
<button id="next" class="next" disabled>לשאלה הבאה ←</button>
<div class="hint">המטרה: לתרגל את המילים <b>גר</b> ו־<b>גרה</b>, ולחבר בין שם האדם לבין המדינה.</div>
</section>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>

m%20by%20Gage%20Skidmore.jpg"}, {"abbr": "MT", "state": "מונטנה", "name": "Hugh Jackman", "img": "https://commons.wikimedia.org/wiki/Special:FilePath/Hugh%20Jackman%202012.jpg"}, {"abbr": "NE", "state": "נברסקה", "name": "Warren Buffett", "img": "https://commons.wikimedia.org/wiki/Special:FilePath/Warren%20Buffett%20May%202015.jpg"}, {"abbr": "NV", "state": "נבדה", "name": "Andre Agassi", "img": "https://commons.wikimedia.org/wiki/Special:FilePath/Andre%20Agassi%20at%20Wimbledon%202003.jpg"}, {"abbr": "NH", "state": "ניו המפשייר", "name": "Sarah Silverman", "img": "https://commons.wikimedia.org/wiki/Special:FilePath/Sarah%20Silverman%202015.jpg"}, {"abbr": "NJ", "state": "ניו ג׳רזי", "name": "Bruce Springsteen", "img": "https://commons.wikimedia.org/wiki/Special:FilePath/Bruce%20Springsteen%20-%20Roskilde%202012.jpg"}, {"abbr": "NM", "state": "ניו מקסיקו", "name": "Neil Patrick Harris", "img": "https://commons.wikimedia.org/wiki/Special:FilePath/Neil%20Patrick%20Harris%202014.jpg"}, {"abbr": "NY", "state": "ניו יורק", "name": "Sarah Jessica Parker", "img": "https://commons.wikimedia.org/wiki/Special:FilePath/Sarah%20Jessica%20Parker%202021.jpg"}, {"abbr": "NC", "state": "קרוליינה הצפונית", "name": "Zach Galifianakis", "img": "https://commons.wikimedia.org/wiki/Special:FilePath/Zach%20Galifianakis%202011.jpg"}, {"abbr": "ND", "state": "דקוטה הצפונית", "name": "Josh Duhamel", "img": "https://commons.wikimedia.org/wiki/Special:FilePath/Josh%20Duhamel%202011.jpg"}, {"abbr": "OH", "state": "אוהיו", "name": "LeBron James", "img": "https://commons.wikimedia.org/wiki/Special:FilePath/LeBron%20James%20%2851909739316%29.jpg"}, {"abbr": "OK", "state": "אוקלהומה", "name": "Carrie Underwood", "img": "https://commons.wikimedia.org/wiki/Special:FilePath/Carrie%20Underwood%20CMA%20Music%20Festival%202012.jpg"}, {"abbr": "OR", "state": "אורגון", "name": "Matt Groening", "img": "https://commons.wikimedia.org/wiki/Special:FilePath/Matt%20Groening%20by%20Gage%20Skidmore.jpg"}, {"abbr": "PA", "state": "פנסילבניה", "name": "Taylor Swift", "img": "https://commons.wikimedia.org/wiki/Special:FilePath/Taylor%20Swift%20Red%20Tour%20at%20Lincoln%20Financial%20Field%202015.jpg"}, {"abbr": "RI", "state": "רוד איילנד", "name": "Meredith Vieira", "img": "https://commons.wikimedia.org/wiki/Special:FilePath/Meredith%20Vieira%202012.jpg"}, {"abbr": "SC", "state": "קרוליינה הדרומית", "name": "James Brown", "img": "https://commons.wikimedia.org/wiki/Special:FilePath/James%20Brown%20%28cropped%29.jpg"}, {"abbr": "SD", "state": "דקוטה הדרומית", "name": "January Jones", "img": "https://commons.wikimedia.org/wiki/Special:FilePath/January%20Jones%202015.jpg"}, {"abbr": "TN", "state": "טנסי", "name": "Morgan Freeman", "img": "https://commons.wikimedia.org/wiki/Special:FilePath/Morgan%20Freeman%202014.jpg"}, {"abbr": "TX", "state": "טקסס", "name": "Beyoncé", "img": "https://commons.wikimedia.org/wiki/Special:FilePath/Beyonce%20-%20The%20Formation%20World%20Tour%2C%20London%202016.jpg"}, {"abbr": "UT", "state": "יוטה", "name": "Post Malone", "img": "https://commons.wikimedia.org/wiki/Special:FilePath/Post%20Malone%20July%202021.jpg"}, {"abbr": "VT", "state": "ורמונט", "name": "John Oates", "img": "https://commons.wikimedia.org/wiki/Special:FilePath/John%20Oates%202013.jpg"}, {"abbr": "VA", "state": "וירג׳יניה", "name": "Sandra Bullock", "img": "https://commons.wikimedia.org/wiki/Special:FilePath/Sandra%20Bullock%20Cannes%202018.jpg"}, {"abbr": "WA", "state": "וושינגטון", "name": "Bill Gates", "img": "https://commons.wikimedia.org/wiki/Special:FilePath/Bill%20Gates%20June%202015.png"}, {"abbr": "WV", "state": "וירג׳יניה המערבית", "name": "Jennifer Garner", "img": "https://commons.wikimedia.org/wiki/Special:FilePath/Jennifer%20Garner%202018.jpg"}, {"abbr": "WI", "state": "ויסקונסין", "name": "Chris Farley", "img": "https://commons.wikimedia.org/wiki/Special:FilePath/Chris%20Farley%201997.jpg"}, {"abbr": "WY", "state": "ויומינג", "name": "Matthew Fox", "img": "https://commons.wikimedia.org/wiki/Special:FilePath/Matthew%20Fox%202008.jpg"}];
const questions = [["NY", "מי גר בניו יורק?", "שרה ג׳סיקה פרקר", "ביונסה", 0], ["TX", "איפה ביונסה גרה?", "טקסס", "ניו יורק", 0], ["NJ", "מי גר בניו ג׳רזי?", "ברוס ספרינגסטין", "טיילור סוויפט", 0], ["PA", "איפה טיילור סוויפט גרה?", "פנסילבניה", "פלורידה", 0], ["HI", "מי גר בהוואי?", "ברונו מארס", "מורגן פרימן", 0], ["TN", "איפה מורגן פרימן גר?", "טנסי", "אוהיו", 0], ["CA", "מי גר בקליפורניה?", "ג׳ניפר אניסטון", "ג׳וליה רוברטס", 0], ["GA", "איפה ג׳וליה רוברטס גרה?", "ג׳ורג׳יה", "יוטה", 0], ["OH", "מי גר באוהיו?", "לברון ג׳יימס", "ביל גייטס", 0], ["WA", "איפה ביל גייטס גר?", "וושינגטון", "טקסס", 0], ["UT", "מי גר ביוטה?", "פוסט מאלון", "ברוס ספרינגסטין", 0], ["FL", "איפה טום בריידי גר?", "פלורידה", "מיין", 0], ["MA", "מי גר במסצ׳וסטס?", "מאט דיימון", "טיילור סוויפט", 0], ["MN", "איפה פרינס גר?", "מינסוטה", "נבדה", 0], ["MI", "מי גר במישיגן?", "מדונה", "ביונסה", 0], ["ME", "איפה סטיבן קינג גר?", "מיין", "קליפורניה", 0], ["NV", "מי גר בנבדה?", "אנדרה אגאסי", "מת׳יו פוקס", 0], ["CO", "איפה קווין קוסטנר גר?", "קולורדו", "ניו יורק", 0], ["AZ", "מי גר באריזונה?", "אמה סטון", "אופרה וינפרי", 0], ["LA", "איפה ריס וית׳רספון גרה?", "לואיזיאנה", "וירג׳יניה", 0]];
const byAbbr = Object.fromEntries(people.map(p=>[p.abbr,p]));
const fips = {1:"AL",2:"AK",4:"AZ",5:"AR",6:"CA",8:"CO",9:"CT",10:"DE",11:"DC",12:"FL",13:"GA",15:"HI",16:"ID",17:"IL",18:"IN",19:"IA",20:"KS",21:"KY",22:"LA",23:"ME",24:"MD",25:"MA",26:"MI",27:"MN",28:"MS",29:"MO",30:"MT",31:"NE",32:"NV",33:"NH",34:"NJ",35:"NM",36:"NY",37:"NC",38:"ND",39:"OH",40:"OK",41:"OR",42:"PA",44:"RI",45:"SC",46:"SD",47:"TN",48:"TX",49:"UT",50:"VT",51:"VA",53:"WA",54:"WV",55:"WI",56:"WY"};
let current=0, score=0, answered=false;

const photo=document.getElementById("photo"), personName=document.getElementById("personName"),
stateName=document.getElementById("stateName"), question=document.getElementById("question"),
answers=document.getElementById("answers"), feedback=document.getElementById("feedback"),
next=document.getElementById("next"), qn=document.getElementById("qn"), scoreEl=document.getElementById("score");

function selectState(abbr){
  document.querySelectorAll(".state").forEach(x=>x.classList.toggle("sel",x.dataset.abbr===abbr));
  const p=byAbbr[abbr];
  if(!p) return;
  photo.src=p.img;
  photo.alt="תמונה של "+p.name;
  personName.textContent=p.name;
  stateName.textContent=p.state;
}

function renderQuestion(){
  answered=false; next.disabled=true; feedback.textContent="";
  const q=questions[current], p=byAbbr[q[0]];
  qn.textContent=current+1; scoreEl.textContent=score;
  selectState(q[0]);
  question.textContent=q[1];
  answers.innerHTML="";
  [q[2],q[3]].forEach((text,i)=>{
    const b=document.createElement("button");
    b.type="button"; b.textContent=text;
    b.addEventListener("click",()=>answer(i,b));
    answers.appendChild(b);
  });
}

function answer(i,button){
  if(answered) return;
  answered=true;
  const q=questions[current];
  [...answers.children].forEach((b,j)=>{
    b.disabled=true;
    if(j===q[4]) b.classList.add("correct");
  });
  if(i===q[4]){
    score++; button.classList.add("correct");
    feedback.textContent="✓ נכון! מצוין!";
  }else{
    button.classList.add("wrong");
    feedback.textContent="✗ לא נכון. התשובה הנכונה היא: "+q[q[4]+2];
  }
  scoreEl.textContent=score; next.disabled=false;
}

next.addEventListener("click",()=>{current=(current+1)%questions.length;renderQuestion();});

async function buildMap(){
  const us=await fetch("https://cdn.jsdelivr.net/npm/us-atlas@3.0.1/states-10m.json").then(r=>r.json());
  const W=760,H=540;
  const svg=d3.select("#map").append("svg").attr("viewBox",`0 0 ${W} ${H}`);
  const states=topojson.feature(us,us.objects.states);
  const projection=d3.geoAlbersUsa().fitExtent([[12,12],[W-12,H-12]],states);
  const path=d3.geoPath(projection);
  svg.selectAll(".state").data(states.features).join("path")
    .attr("class","state")
    .attr("data-abbr",d=>fips[d.id]||"")
    .attr("d",path)
    .on("click",(e,d)=>selectState(fips[d.id]));
  svg.selectAll(".label").data(states.features).join("text")
    .attr("class","label")
    .attr("x",d=>path.centroid(d)[0])
    .attr("y",d=>path.centroid(d)[1])
    .text(d=>fips[d.id]||"");
}
buildMap().catch(()=>{
  document.getElementById("map").innerHTML='<div style="padding:60px;text-align:center">המפה זקוקה לחיבור לאינטרנט בפעם הראשונה.</div>';
});
renderQuestion();
</script>
</body>
</html>
