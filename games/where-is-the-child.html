 ["garden","⚽","מְשַׂחֵק","מְשַׂחֶקֶת","כַּדּוּרֶגֶל","💨","jump"],
 ["garden","👟","רָץ","רָצָה","","💨","run"],
 ["garden",WCAN+"🪴"+HOSE,"מַשְׁקֶה","מַשְׁקָה","צְמָחִים","💦","sway"],
 ["bath","🪥","מְצַחְצֵחַ","מְצַחְצַחַת","שִׁנַּיִם","🫧","sway"],
 ["bath","🚿","מִתְקַלֵּחַ","מִתְקַלַּחַת","","💦","sway"],
 ["bath","🧼","רוֹחֵץ","רוֹחֶצֶת","יָדַיִם","🫧","sway"]
];
var SUBJ={m:["הַיֶּלֶד","👦"],f:["הַיַּלְדָּה","👧"]};
function clue(a,g){return SUBJ[g][0]+" "+(g==="m"?a[2]:a[3])+(a[4]?" "+a[4]:"")}
function sentence(a,g,rk){return clue(a,g)+" "+ROOMS[rk||a[0]][2]+"."}
var $=function(i){return document.getElementById(i)};
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
var ROOMC={living:[245,432],kitchen:[520,446],bed:[290,236],bath:[575,276],garden:[400,530]};
function drawDots(){var h="";for(var i=0;i<rounds.length;i++)h+='<span class="dot'+(i<idx?" done":i===idx?" now":"")+'"></span>';$("dots").innerHTML=h}
var rounds,idx,score,tries,locked,selected,cur;
function build(){
  var pool=shuffle(ACTS.slice()),chosen=[],seen={};
  pool.forEach(function(a){if(!seen[a[0]]){seen[a[0]]=1;chosen.push(a)}});
  pool.forEach(function(a){if(chosen.length<12&&chosen.indexOf(a)<0)chosen.push(a)});
  var gs=shuffle(["m","m","m","m","m","m","f","f","f","f","f","f"]);
  var r=chosen.map(function(a,i){return [a,gs[i]]});
  for(var t=0;t<300;t++){
    shuffle(r);var ok=true;
    for(var i=1;i<r.length;i++)if(r[i][0][0]===r[i-1][0][0]){ok=false;break}
    if(ok)break;
  }
  return r;
}
var gameId=0;
function showStart(){
  gameId++;
  $("game").style.display="none";$("end").style.display="none";$("start").style.display="block";
  $("q").textContent="אֵיפֹה הַיֶּלֶד?";$("score").textContent="";$("dots").innerHTML="";$("reset").style.display="none";
}
function start(){
  gameId++;$("start").style.display="none";$("reset").style.display="";
  rounds=build();idx=0;score=0;
  $("end").style.display="none";$("game").style.display="block";
  drawScore();show();
}
function drawScore(){$("score").textContent="נְקֻדּוֹת: "+score}
function say(t,c){var m=$("msg");m.textContent=t;m.className=c||""}
function show(){
  var old=document.querySelector(".tok");if(old)old.remove();drawDots();
  cur=rounds[idx];tries=0;locked=false;selected=false;
  var a=cur[0],g=cur[1],c=$("char");
  c.classList.remove("sel","drag");c.style.transform="";
  $("who").textContent=SUBJ[g][1];$("act").innerHTML=a[1];$("act").style.fontSize=(a[1].charAt(0)==="<"||Array.from(a[1]).length>2)?"0.7em":"";$("who").className="m-"+a[6];$("fx").textContent=a[5];
  $("q").textContent="אֵיפֹה "+SUBJ[g][0]+"?";
  $("clue").textContent=clue(a,g);
  $("hint").textContent="גִּרְרוּ אֶת "+SUBJ[g][0]+" לַחֶדֶר הַנָּכוֹן. אֶפְשָׁר גַּם לִלְחֹץ עַל הַדְּמוּת וְאָז עַל הַחֶדֶר.";
  say("");
  document.querySelectorAll(".room").forEach(function(r){r.classList.remove("ok","no","hot")});
}
function answer(key){
  if(locked)return;
  var room=$(key);
  if(key===cur[0][0]||(cur[0][7]&&cur[0][7].indexOf(key)>=0)){
    locked=true;if(tries===0)score++;drawScore();
    room.classList.add("ok");
    var t=document.createElementNS("http://www.w3.org/2000/svg","text");t.setAttribute("class","tok");t.setAttribute("x",ROOMC[key][0]);t.setAttribute("y",ROOMC[key][1]);t.textContent=SUBJ[cur[1]][1]+(cur[0][1].charAt(0)==="<"?"🪴":cur[0][1]);room.appendChild(t);
    say(sentence(cur[0],cur[1],key),"good");
    $("char").classList.remove("sel");
    var gid=gameId;setTimeout(function(){if(gid!==gameId)return;idx++;if(idx>=rounds.length)finish();else show()},3200);
  }else{
    tries++;selected=false;
    var c=$("char");c.classList.remove("sel","drag");c.style.transform="";
    c.classList.add("shake");setTimeout(function(){c.classList.remove("shake")},400);
    room.classList.add("no");setTimeout(function(){room.classList.remove("no")},700);
    say("לֹא נָכוֹן. נַסּוּ שׁוּב!","bad");
  }
}
function finish(){
  $("game").style.display="none";$("dots").innerHTML="";$("end").style.display="block";
  $("q").textContent="כָּל הַכָּבוֹד!";
  $("final").textContent="נְקֻדּוֹת: "+score+" מִתּוֹךְ "+rounds.length;
}
// wiring
(function(){
  document.querySelectorAll(".room").forEach(function(b){
    b.addEventListener("click",function(){
      if(locked)return;
      if(!selected){say("לִחְצוּ קֹדֶם עַל הַדְּמוּת.","bad");return}
      answer(b.dataset.k);
    });
    b.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();b.dispatchEvent(new Event("click"))}});
  });
  var c=$("char"),sx,sy,on=false,moved=0;
  function hit(e){
    var l=document.elementsFromPoint(e.clientX,e.clientY);
    for(var i=0;i<l.length;i++){var r=l[i].closest&&l[i].closest(".room");if(r)return r}
    return null;
  }
  function toggle(){if(locked)return;selected=!selected;c.classList.toggle("sel",selected);say(selected?"עַכְשָׁו לִחְצוּ עַל הַחֶדֶר.":"")}
  c.addEventListener("pointerdown",function(e){if(locked)return;on=true;moved=0;sx=e.clientX;sy=e.clientY;c.setPointerCapture(e.pointerId)});
  c.addEventListener("pointermove",function(e){
    if(!on)return;var dx=e.clientX-sx,dy=e.clientY-sy;moved=Math.max(moved,Math.abs(dx)+Math.abs(dy));
    if(moved>8){c.classList.add("drag");c.style.transform="translate("+dx+"px,"+dy+"px)"}
    var t=hit(e);document.querySelectorAll(".room").forEach(function(b){b.classList.toggle("hot",b===t)});
  });
  c.addEventListener("pointerup",function(e){
    if(!on)return;on=false;c.classList.remove("drag");
    document.querySelectorAll(".room").forEach(function(b){b.classList.remove("hot")});
    if(moved<=8){c.style.transform="";toggle();return}
    var t=hit(e);
    if(t)answer(t.dataset.k);else c.style.transform="";
  });
  c.addEventListener("pointercancel",function(){on=false;c.style.transform="";c.classList.remove("drag")});
  c.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();toggle()}});
  $("again").onclick=start;$("go").onclick=start;$("reset").onclick=start;
})();
showStart();
</script>
</body>
