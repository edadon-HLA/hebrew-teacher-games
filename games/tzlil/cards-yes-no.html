<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>כַּרְטִיסֵי ✔ / ✘</title>
<style>
/* 4 cards on one A4 page (2 x 2): two sets of one ✔ card and one ✘ card — cut along the dashed lines */
@page{size:A4;margin:8mm}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;font-family:Arial,sans-serif}
.sheet{width:194mm;height:281mm;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.c{border:1.5px dashed #9aa3b2;display:grid;place-items:center;overflow:hidden}
.c span{display:grid;place-items:center;width:78mm;height:78mm;border-radius:50%;font-size:190pt;font-weight:900;line-height:1;color:#fff}
.y span{background:#2f9d55}.n span{background:#e2506a}
@media screen{body{background:#eee;padding:10px}.sheet{background:#fff;box-shadow:0 2px 12px #0003}}
</style>
</head>
<body>
<div class="sheet">
  <div class="c y"><span>✔</span></div><div class="c n"><span>✘</span></div>
  <div class="c y"><span>✔</span></div><div class="c n"><span>✘</span></div>
</div>
</body>
</html>
