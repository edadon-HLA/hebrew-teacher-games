<style>
/* Layout: one-screen classroom game — sentence strip on top, illustrated scene in the middle, two giant answer buttons below. */
:root{
  --bg:#eaf4fc; --surface:#ffffff; --ink:#23233a; --muted:#5f6b7d; --line:#cfe0ef;
  --yes:#2f9d55; --yes-soft:#dcf2e3; --no:#e2506a; --no-soft:#fde3e7; --sky:#2a8bd0; --gold:#f2b01e;
  --stage:#fff8ec; --floor:#f1dfc4;
  --f-display:'Rubik','Segoe UI',Arial,sans-serif; --f-he:'Noto Sans Hebrew','Arial Hebrew','Segoe UI',Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#141b26; --surface:#1f2836; --ink:#f1f4f8; --muted:#a3b0c2; --line:#2f3b4d; --yes-soft:#1d3a29; --no-soft:#45252f; --sky:#62b4f0; color-scheme:dark; } }
:root[data-theme="dark"]{ --bg:#141b26; --surface:#1f2836; --ink:#f1f4f8; --muted:#a3b0c2; --line:#2f3b4d; --yes-soft:#1d3a29; --no-soft:#45252f; --sky:#62b4f0; color-scheme:dark; }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0; height:100%}
body{background:var(--bg); color:var(--ink); font-family:var(--f-he); display:flex; flex-direction:column}
button{font:inherit; color:inherit; cursor:pointer}
:focus-visible{outline:3px solid var(--sky); outline-offset:3px}
.he{font-family:var(--f-he); direction:rtl; unicode-bidi:isolate}
svg{direction:ltr}

.bar{display:flex; flex-wrap:wrap; align-items:center; gap:10px 16px; padding:12px 16px; border-bottom:2px solid var(--line); background:var(--surface)}
.bar h1{margin:0; font-size:22px; font-weight:800; display:flex; gap:10px; align-items:baseline; flex-wrap:wrap}
.bar h1 .he{font-size:20px; color:var(--muted); font-weight:600}
.back{color:var(--muted); text-decoration:none; font-weight:600; font-size:14px}
.back:hover{color:var(--ink)}
.dots{display:flex; gap:5px; flex-wrap:wrap}
.dots i{width:12px; height:12px; border-radius:50%; background:var(--line); display:block}
.dots i.cur{background:var(--sky); transform:scale(1.25)}
.dots i.y{background:var(--yes)} .dots i.n{background:var(--no)}
.score{font-family:var(--f-display); direction:ltr; unicode-bidi:isolate; font-weight:800; font-variant-numeric:tabular-nums; font-size:18px}
.spacer{flex:1}
.tog{border:2px solid var(--line); background:var(--surface); border-radius:10px; padding:5px 10px; font-weight:600; font-size:14px}
.tog[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}

main{flex:1; display:flex; flex-direction:column; align-items:center; gap:14px; padding:14px 16px 18px; min-height:0}
.sentence{width:min(900px,100%); min-height:92px; background:var(--surface); border:3px solid var(--ink); border-radius:22px; display:flex; justify-content:center; align-items:center; flex-wrap:wrap; gap:0 .35em; padding:10px 18px; font-family:var(--f-he); font-size:clamp(30px,5.6vw,58px); font-weight:800; direction:rtl; position:relative}
.sentence span{display:inline-block; animation:wordIn .45s cubic-bezier(.2,1.6,.4,1) both}
@keyframes wordIn{from{transform:translateY(20px) scale(.6); opacity:0}}
.sentence.hidden span{filter:blur(14px); opacity:.35}
.sentence .ear{font-family:var(--f-display); font-size:20px; color:var(--muted); font-weight:600; direction:ltr}

.stage{position:relative; width:min(760px,100%); flex:1; min-height:220px; display:grid; place-items:center}
.stage svg.scene{width:100%; height:100%; max-height:52vh}
.verdict{position:absolute; inset:0; display:grid; place-items:start; padding:10px; pointer-events:none}
.verdict .stamp{width:clamp(80px,14vw,130px); aspect-ratio:1; border-radius:50%; display:grid; place-items:center; color:#fff; font-size:clamp(46px,8vw,80px); font-weight:800; animation:stamp .5s cubic-bezier(.2,1.6,.4,1) both; box-shadow:0 10px 30px rgba(0,0,0,.25)}
.verdict .stamp.y{background:var(--yes)} .verdict .stamp.n{background:var(--no)}
@keyframes stamp{from{transform:scale(2.2) rotate(-20deg); opacity:0}}

.answers{display:grid; grid-template-columns:1fr 1fr; gap:16px; width:min(760px,100%)}
.ans{border:0; border-radius:22px; padding:16px 10px; color:#fff; font-weight:800; font-size:clamp(22px,3.6vw,32px); display:flex; flex-direction:column; align-items:center; gap:2px; box-shadow:0 7px 0 rgba(0,0,0,.25); transition:transform .1s}
.ans .sym{font-size:clamp(40px,7vw,64px); line-height:1}
.ans .he{font-size:.85em}
.ans.y{background:var(--yes)} .ans.n{background:var(--no)}
.ans:active{transform:translateY(5px); box-shadow:0 2px 0 rgba(0,0,0,.25)}
.ans:disabled{opacity:.35; cursor:default}
.ans.picked{outline:6px solid var(--ink); outline-offset:4px; opacity:1}

.feedback{width:min(760px,100%); display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px 16px; background:var(--surface); border:2px solid var(--line); border-radius:18px; padding:12px 16px}
.feedback .r{font-size:24px; font-weight:800}
.feedback .r.y{color:var(--yes)} .feedback .r.n{color:var(--no)}
.feedback .why{color:var(--muted); font-size:16px; flex:1 1 280px; min-width:0}
.feedback .why b{color:var(--ink)}
.next{background:var(--sky); color:#fff; border:0; border-radius:14px; padding:12px 22px; font-weight:800; font-size:20px}

.overlay{position:fixed; inset:0; z-index:30; display:grid; place-items:center; padding:16px; background:rgba(20,27,38,.55)}
.panel{background:var(--surface); border-radius:28px; padding:28px 24px; width:min(560px,100%); text-align:center; box-shadow:0 30px 80px rgba(0,0,0,.35)}
.panel h2{font-size:clamp(28px,5vw,40px); margin:0} .panel .he.t{font-size:clamp(26px,4.5vw,36px); font-weight:800; margin:4px 0 12px}
.panel p{color:var(--muted); line-height:1.5; margin:8px auto 18px; max-width:44ch}
.how{display:flex; justify-content:center; gap:14px; margin-bottom:18px}
.how span{display:flex; align-items:center; gap:8px; font-weight:700}
.how b{width:40px; height:40px; border-radius:12px; display:grid; place-items:center; color:#fff; font-size:22px}
.go{background:var(--sky); color:#fff; border:0; border-radius:16px; padding:14px 30px; font-weight:800; font-size:24px}
.big-stars{font-size:56px; color:var(--gold); letter-spacing:8px}

/* scene animations */
.kid{animation:kidIn .6s cubic-bezier(.2,1.3,.4,1) both}
@keyframes kidIn{from{transform:translateX(-80px); opacity:0}}
.kid.love .bob{animation:bob .7s ease-in-out .7s infinite alternate}
@keyframes bob{to{transform:translateY(-8px)}}
.kid.dislike .bob{transform-origin:120px 270px; animation:lean .5s ease-out .7s both}
@keyframes lean{to{transform:rotate(-5deg)}}
.item{animation:drop .7s cubic-bezier(.3,1.5,.5,1) .15s both}
@keyframes drop{from{transform:translateY(-160px); opacity:0}}
.item.dislike .inner{transform-origin:62px 62px; transform-box:fill-box; animation:jit .35s ease-in-out 1.1s 3}
@keyframes jit{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.bubble{transform-box:fill-box; transform-origin:0% 100%; animation:bub .5s cubic-bezier(.2,1.6,.4,1) .85s both}
@keyframes bub{from{transform:scale(0); opacity:0}}
.beat{transform-box:fill-box; transform-origin:center; animation:beat .9s ease-in-out 1.3s infinite}
@keyframes beat{0%,100%{transform:scale(1)}30%{transform:scale(1.15)}}
.float{animation:floatUp 2.4s ease-out infinite}
@keyframes floatUp{0%{transform:translateY(0); opacity:0}15%{opacity:1}100%{transform:translateY(-90px); opacity:0}}
.grr{animation:grr .3s steps(2) infinite}
@keyframes grr{50%{transform:translate(2px,-2px)}}

@media (max-width:560px){ .bar h1 .he{display:none} .ans{padding:12px 6px} }
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation-duration:.01ms!important; animation-iteration-count:1!important} }
</style>

];
const SUBJ = [
  {he:'אֲנִי', en:'I', pos:'love', neg:"don't love"},
  {he:'הַתַּלְמִיד', heF:'הַתַּלְמִידָה', en:'The student', pos:'loves', neg:"doesn't love"}
];
const LOOKS = [
  {shirt:'#3d8bf2', hair:'#4a2c1a', skin:'#f2c4a0'},
  {shirt:'#ffc94a', hair:'#1f1a17', skin:'#c98d62'},
  {shirt:'#6fd38a', hair:'#b0602a', skin:'#f7d3b5'},
  {shirt:'#a46cf0', hair:'#2b2a3a', skin:'#8d5a3b'}
];
const rnd = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };

function makeDeck(){
  // half true, half false; false = "neg" (love vs. not love) or "item" (different thing)
  const truths = shuffle(Array.from({length:ROUNDS}, (_,i) => i < ROUNDS/2));
  let lastItem = null;
  return truths.map((truth, i) => {
    let item; do { item = rnd(ITEMS); } while (item === lastItem); lastItem = item;
    const subj = rnd(SUBJ);
    const sPos = Math.random() < .6;
    let pItem = item, pPos = sPos, kind = 'match';
    if (!truth){
      kind = (i % 2 === 0) ? 'neg' : 'item';
      if (kind === 'neg') pPos = !sPos;
      else { do { pItem = rnd(ITEMS); } while (pItem === item); }
    }
    const girl = Math.random() < .5;
    return {subj, item, sPos, pItem, pPos, truth, kind, girl, look:rnd(LOOKS)};
  });
}

/* ---------- drawing ---------- */
const INK2 = '#2b2a3a';
const HEART = 'M50 84 C20 62 10 46 14 32 C18 18 36 14 50 30 C64 14 82 18 86 32 C90 46 80 62 50 84Z';
function kidSVG(love, L, girl){
  const eyes = love
    ? `<path d="M93 118 Q101 108 109 118 M131 118 Q139 108 147 118" stroke="${INK2}" stroke-width="5" fill="none" stroke-linecap="round"/>
       <circle cx="88" cy="136" r="8" fill="#ff8fa3" opacity=".6"/><circle cx="152" cy="136" r="8" fill="#ff8fa3" opacity=".6"/>`
    : `<circle cx="101" cy="118" r="5" fill="${INK2}"/><circle cx="139" cy="118" r="5" fill="${INK2}"/>
       <path d="M90 102 L110 108 M150 102 L130 108" stroke="${INK2}" stroke-width="5" stroke-linecap="round"/>`;
  const mouth = love
    ? `<path d="M100 138 Q120 162 140 138 Z" fill="#9b2d3f" stroke="${INK2}" stroke-width="4" stroke-linejoin="round"/>`
    : `<path d="M103 152 Q120 138 137 152" stroke="${INK2}" stroke-width="5" fill="none" stroke-linecap="round"/>`;
  const arms = love
    ? `<path d="M78 206 C60 220 56 240 62 258" stroke="${L.shirt}" stroke-width="20" fill="none" stroke-linecap="round"/>
       <path d="M162 204 C190 196 206 186 224 176" stroke="${L.shirt}" stroke-width="20" fill="none" stroke-linecap="round"/>
       <circle cx="228" cy="174" r="11" fill="${L.skin}" stroke="${INK2}" stroke-width="3.5"/>`
    : `<path d="M80 212 C100 236 140 236 166 222" stroke="${L.shirt}" stroke-width="20" fill="none" stroke-linecap="round" style="filter:brightness(.9)"/>
       <path d="M160 212 C140 236 100 240 74 226" stroke="${L.shirt}" stroke-width="20" fill="none" stroke-linecap="round"/>
       <circle cx="168" cy="222" r="10" fill="${L.skin}" stroke="${INK2}" stroke-width="3.5"/><circle cx="72" cy="226" r="10" fill="${L.skin}" stroke="${INK2}" stroke-width="3.5"/>`;
  return `<g class="kid ${love ? 'love' : 'dislike'}"><g class="bob">
    ${girl ? `<path d="M60 120 C42 170 44 226 64 246 L176 246 C196 226 198 170 180 120Z" fill="${L.hair}" stroke="${INK2}" stroke-width="4" stroke-linejoin="round"/>` : ''}
    <path d="M62 290 C62 214 84 192 120 192 C156 192 178 214 178 290Z" fill="${L.shirt}" stroke="${INK2}" stroke-width="4"/>
    <rect x="108" y="168" width="24" height="28" fill="${L.skin}" stroke="${INK2}" stroke-width="4"/>
    <circle cx="68" cy="126" r="10" fill="${L.skin}" stroke="${INK2}" stroke-width="4"/><circle cx="172" cy="126" r="10" fill="${L.skin}" stroke="${INK2}" stroke-width="4"/>
    <circle cx="120" cy="124" r="52" fill="${L.skin}" stroke="${INK2}" stroke-width="4"/>
    <path d="M68 120 C64 74 96 60 122 64 C150 62 178 82 172 120 C158 98 140 92 122 98 C104 92 84 100 68 120Z" fill="${L.hair}" stroke="${INK2}" stroke-width="4" stroke-linejoin="round"/>
    ${girl ? `<g transform="translate(150 72)"><path d="M0 0 L-16 -12 L-16 12Z M0 0 L16 -12 L16 12Z" fill="#ef5470" stroke="${INK2}" stroke-width="3.5" stroke-linejoin="round"/><circle r="5" fill="#ef5470" stroke="${INK2}" stroke-width="3.5"/></g>` : ''}
    ${eyes}${mouth}${arms}
    ${love ? '' : `<g class="grr"><path d="M58 70 l-12 -8 M54 84 l-14 0 M184 70 l12 -8" stroke="${INK2}" stroke-width="4" stroke-linecap="round"/></g>`}
  </g></g>`;
}
function bubbleSVG(love){
  const inner = love
    ? `<g class="beat"><path d="${HEART}" transform="translate(262 18) scale(.56)" fill="#ef5470" stroke="${INK2}" stroke-width="6"/></g>`
    : `<g transform="translate(262 18) scale(.56)" stroke="${INK2}" stroke-width="6" stroke-linejoin="round">
         <path d="M50 30 C36 14 18 18 14 32 C10 46 20 62 48 84 L42 66 L52 54 L42 42Z" fill="#9aa7b8" transform="translate(-6 2) rotate(-10 50 50)"/>
         <path d="M52 30 C66 14 82 18 86 32 C90 46 80 62 52 84 L48 66 L58 54 L48 42Z" fill="#9aa7b8" transform="translate(8 2) rotate(10 50 50)"/>
       </g>`;
  return `<g class="bubble">
    <circle cx="190" cy="66" r="6" fill="#fff" stroke="${INK2}" stroke-width="3"/>
    <circle cx="210" cy="52" r="9" fill="#fff" stroke="${INK2}" stroke-width="3"/>
    <ellipse cx="290" cy="46" rx="48" ry="40" fill="#fff" stroke="${INK2}" stroke-width="4"/>
    ${inner}
  </g>`;
}
function floatHearts(love){
  if (!love) return '';
  return [0,1,2].map(i => `<g class="float" style="animation-delay:${1.2 + i*.7}s"><path d="${HEART}" transform="translate(${236 + i*36} ${210 - i*10}) scale(.22)" fill="#ef5470" stroke="${INK2}" stroke-width="8"/></g>`).join('');
}
function sceneSVG(r){
  return `<svg class="scene" viewBox="0 0 420 300" role="img" aria-label="תמונה">
    <rect x="0" y="0" width="420" height="300" rx="26" fill="#fff8ec"/>
    <ellipse cx="300" cy="282" rx="80" ry="10" fill="#e5cfaf"/>
    <ellipse cx="120" cy="288" rx="78" ry="9" fill="#e5cfaf"/>
    <g class="item ${r.pPos ? 'love' : 'dislike'}"><g transform="translate(238 140) scale(1.25)"><g class="inner">${ICONS[r.pItem.k]}</g></g></g>
    ${kidSVG(r.pPos, r.look, r.girl)}
    ${bubbleSVG(r.pPos)}
    ${floatHearts(r.pPos)}
  </svg>`;
}

/* ---------- speech ---------- */
let heVoice = null, voiceOn = false;
function findVoice(){ heVoice = (speechSynthesis.getVoices()||[]).find(v => /^(he|iw)/i.test(v.lang)) || null; $('tVoice').hidden = !heVoice; }
if ('speechSynthesis' in window){ findVoice(); speechSynthesis.onvoiceschanged = findVoice; }
function say(t){ if (!heVoice || !voiceOn) return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.voice=heVoice; u.lang=heVoice.lang; u.rate=.8; speechSynthesis.speak(u); }

/* ---------- game flow ---------- */
let deck = [], i = 0, score = 0, results = [], answered = false, textOn = true;
function sentenceText(r){
  const subj = (r.girl && r.subj.heF) || r.subj.he;
  return `${subj}${r.sPos ? '' : ' לֹא'} ${r.girl ? 'אוֹהֶבֶת' : 'אוֹהֵב'} ${r.item.he}.`;
}
function drawDots(){
  $('dots').innerHTML = deck.map((_,j) => `<i class="${j===i && !answered ? 'cur' : ''} ${results[j]===true ? 'y' : results[j]===false ? 'n' : ''}"></i>`).join('');
  $('score').textContent = `⭐ ${score}`;
}
function show(){
  const r = deck[i]; answered = false;
  const words = sentenceText(r).split(' ');
  const s = $('sentence');
  s.classList.toggle('hidden', !textOn);
  s.innerHTML = words.map((w,j) => `<span style="animation-delay:${.15 + j*.28}s">${w}</span>`).join('');
  $('stage').innerHTML = sceneSVG(r);
  $('feedback').hidden = true; $('answers').hidden = false;
  ['aYes','aNo'].forEach(id => { $(id).disabled = false; $(id).classList.remove('picked'); });
  drawDots();
  setTimeout(() => say(sentenceText(r)), 400);
}
function answer(saidYes){
  if (answered) return; answered = true;
  const r = deck[i]; const right = (saidYes === r.truth);
  results[i] = right; if (right) score++;
  $(saidYes ? 'aYes' : 'aNo').classList.add('picked');
  $(saidYes ? 'aNo' : 'aYes').disabled = true;
  $('sentence').classList.remove('hidden');
  const v = document.createElement('div'); v.className='verdict';
  /* stamp shows whether the student was right, not whether the sentence was true */
  v.innerHTML = `<div class="stamp ${right ? 'y' : 'n'}">${right ? '✓' : '✕'}</div>`;
  $('stage').appendChild(v);
  const fr = $('fbR');
  fr.className = 'r ' + (right ? 'y' : 'n');
  fr.textContent = right ? 'נָכוֹן! כָּל הַכָּבוֹד!' : 'אוּפְּס! לֹא הַפַּעַם';
  const pHe = `${r.girl ? 'הִיא' : 'הוּא'}${r.pPos ? '' : ' לֹא'} ${r.girl ? 'אוֹהֶבֶת' : 'אוֹהֵב'} ${r.pItem.he}.`;
  let why;
  if (r.truth) why = `הַתְּמוּנָה מַתְאִימָה לַמִּשְׁפָּט.`;
  else if (r.kind === 'neg') why = `בַּתְּמוּנָה: <b>${pHe}</b> שִׂימוּ לֵב לַמִּלָּה <b>לֹא</b>!`;
  else why = `בַּמִּשְׁפָּט: <b>${r.item.he}</b>. בַּתְּמוּנָה: <b>${r.pItem.he}</b>.`;
  if (!right) why = `הַתְּשׁוּבָה הַנְּכוֹנָה: <b>${r.truth ? 'נָכוֹן' : 'לֹא נָכוֹן'}</b>. ` + why;
  $('fbWhy').innerHTML = why;
  $('feedback').hidden = false;
  drawDots();
  $('bNext').focus({preventScroll:true});
}
function next(){
  if (!answered) return;
  i++;
  if (i < deck.length) show(); else finish();
}
function finish(){
  const s = score >= ROUNDS-1 ? 3 : score >= ROUNDS*0.66 ? 2 : 1;
  $('endStars').textContent = '★'.repeat(s) + '☆'.repeat(3-s);
  $('endScore').textContent = `${score} מִתּוֹךְ ${ROUNDS}`;
  $('endHe').textContent = s===3 ? 'מְצֻיָּן!' : s===2 ? 'כָּל הַכָּבוֹד!' : 'יֹפִי! עוֹד פַּעַם?';
  $('end').hidden = false; $('bAgain').focus();
}
function start(){
  deck = makeDeck(); i = 0; score = 0; results = [];
  $('start').hidden = true; $('end').hidden = true;
  show();
}
$('bStart').onclick = start;
$('bAgain').onclick = start;
$('aYes').onclick = () => answer(true);
$('aNo').onclick = () => answer(false);
$('bNext').onclick = next;
$('tText').onclick = () => { textOn = !textOn; $('tText').setAttribute('aria-pressed', textOn); $('tText').textContent = 'טקסט: ' + (textOn ? 'מוצג' : 'מוסתר'); if (!answered) $('sentence').classList.toggle('hidden', !textOn); };
$('tVoice').onclick = () => { voiceOn = !voiceOn; $('tVoice').setAttribute('aria-pressed', voiceOn); $('tVoice').textContent = 'קול: ' + (voiceOn ? 'פועל' : 'כבוי'); if (voiceOn && deck[i]) say(sentenceText(deck[i])); };
document.addEventListener('keydown', e => {
  if (!$('start').hidden || !$('end').hidden) return;
  const k = e.key.toLowerCase();
  if (k==='g' || k==='1') answer(true);
  if (k==='r' || k==='2') answer(false);
  if ((k==='enter' || k===' ' || k==='arrowleft') && answered){ e.preventDefault(); next(); }
});
// Preview frame behind the start screen
deck = makeDeck(); show();
})();
</script>
<script id="fs-script">
(function(){var b=document.getElementById("fsBtn"),d=document,e=d.documentElement;
var req=e.requestFullscreen||e.webkitRequestFullscreen,ex=d.exitFullscreen||d.webkitExitFullscreen;
if(!b||!req){return}b.hidden=false;
function on(){return d.fullscreenElement||d.webkitFullscreenElement}
function lbl(){b.textContent=on()?"✕ יציאה ממסך מלא":"⛶ מסך מלא"}
b.addEventListener("click",function(){if(on()){ex.call(d)}else{req.call(e)}});
d.addEventListener("fullscreenchange",lbl);d.addEventListener("webkitfullscreenchange",lbl);})();
</script>
