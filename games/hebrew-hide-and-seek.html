<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מַחֲבוֹאִים</title>
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI","Arial Hebrew",Arial,sans-serif;background:radial-gradient(1200px 520px at 50% -8%,#fffbe8,#ffe9b9 55%,#ffd79b) fixed;color:#3b2a1a}
.wrap{max-width:1000px;margin:auto;padding:10px}
h1{margin:6px 0 10px;font-size:clamp(26px,5.5vw,42px);color:#d35400;text-align:center;text-shadow:0 2px 0 #fff,0 6px 14px #e6510033}
.card{background:linear-gradient(#fff,#fffaf1);border:2px solid #fff;border-radius:22px;box-shadow:0 6px 20px #8a5a0033,inset 0 0 0 1px #f3d9a8;padding:14px;margin:10px 0}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:10px 18px;font-size:20px;background:#ffe0b2;color:#3b2a1a;font-weight:600;box-shadow:0 4px 0 #e0b26a;transition:transform .1s,box-shadow .1s}
button:hover{filter:brightness(1.05)}button:active{transform:translateY(3px);box-shadow:0 1px 0 #e0b26a}#start input:focus{outline:none;border-color:#ff9800;box-shadow:0 0 0 4px #ffe0b2}
button.on{background:#ff9800;color:#fff;box-shadow:0 0 0 3px #e65100}
.go{background:#43a047;color:#fff;font-size:24px}
.go:disabled{background:#bbb;cursor:not-allowed}
#start{text-align:center}
#start input{font:inherit;font-size:24px;padding:10px;border-radius:12px;border:3px solid #ffb74d;width:min(90%,320px);text-align:center;margin:10px 0}
.gender{display:flex;gap:16px;justify-content:center;margin:12px 0}
.gender button{font-size:30px;padding:16px 34px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.stats{font-size:22px;font-weight:700}
.who{font-size:clamp(22px,4vw,32px);font-weight:700}
.clue{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center;text-align:center}
#clueText{font-size:clamp(26px,5.5vw,44px);font-weight:700;color:#1a4fa0;line-height:1.5;flex:1 1 300px}
.spk{font-size:26px;background:#2196f3;color:#fff}
#vol{font-size:24px;padding:8px 14px}
#msg{min-height:40px;font-size:28px;font-weight:700;text-align:center;margin:4px 0}
#msg.ok{color:#2e7d32}#msg.bad{color:#c62828}
#tools{display:flex;gap:12px;align-items:center;justify-content:center;min-height:48px;font-size:20px;font-weight:700;color:#8a5a00}
#leave{background:#5c6bc0;color:#fff}
svg{width:100%;aspect-ratio:1000/540;height:auto;display:block;border-radius:22px;background:#fff3e0;box-shadow:0 0 0 6px #fff,0 0 0 8px #e8c891,0 14px 30px #6b4f3a44;shape-rendering:geometricPrecision;filter:saturate(1.1) contrast(1.04);text-rendering:geometricPrecision}
svg text{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.r,.z{fill:rgba(255,255,255,.001);stroke:none;cursor:pointer;outline:none}
.r:hover,.z:hover,.z.hl,.r:focus,.z:focus{fill:rgba(255,255,255,.35);stroke:#ff6f00;stroke-width:4;stroke-dasharray:10 6}
.bad{fill:rgba(229,57,53,.35)!important;stroke:#c62828!important}
svg[data-mode=easy] .z{pointer-events:none}
svg[data-mode=hard] .r{pointer-events:none}
svg[data-mode=hard] .lbl{display:none}
.enter{display:none;cursor:pointer;outline:none}
svg[data-mode=hard]:not(.zoomed) .enter{display:block}
.enter circle{fill:#ff9800;stroke:#fff;stroke-width:3}
.enter:hover circle,.enter:focus circle{fill:#e65100}
.lbl{font-family:Arial,sans-serif!important;font-size:17px;font-weight:700;fill:#3b2a1a;stroke:#fff;stroke-width:4px;paint-order:stroke;text-anchor:middle;pointer-events:none}
.pop{animation:pop .5s ease-out;transform-box:fill-box;transform-origin:center bottom;pointer-events:none}.cf{animation:fly .9s ease-out forwards;pointer-events:none}@keyframes fly{to{transform:translate(var(--dx),var(--dy));opacity:0}}
@keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
#end{text-align:center}#end h2{font-size:42px;color:#e65100}#end p{font-size:28px}
.hide{display:none!important}
</style>
</head>

  {id:'shed',       room:'garden', n:'מַחְסָן',    hard:'מֵאֲחוֹרֵי הַמַּחְסָן',              z:['p','682,400 741,346 802,400 800,480 684,480']},
  {id:'bigtree',    room:'garden', n:'עֵץ',        hard:'מֵאֲחוֹרֵי הָעֵץ הַגָּדוֹל',          z:[['c',906,270,78],['r',888,300,36,180]]},

  {id:'bench',      room:'garden', n:'סַפְסָל',    hard:'מֵאֲחוֹרֵי הַסַּפְסָל',              z:['r',692,482,104,54]},
  {id:'ball',       room:'garden', n:'כַּדּוּר',   hard:'לְיַד הַכַּדּוּר',                   z:['c',809,522,14]},
  {id:'bike',       room:'garden', n:'אוֹפַנַּיִם', hard:'לְיַד הָאוֹפַנַּיִם',                z:['r',626,494,56,40]},
  {id:'flowers',    room:'garden', n:'פְּרָחִים',  hard:'לְיַד הַפְּרָחִים',                  z:['r',826,488,120,52]},
  {id:'pots',       room:'garden', n:'עֲצִיצִים',  hard:'לְיַד הָעֲצִיצִים',                  z:['r',946,500,50,36]}

const T = {ok:n=>'כָּל הַכָּבוֹד! מְצָאתֶם אֶת '+n+'! 🎉', bad:'לֹא נָכוֹן. נַסּוּ שׁוּב!'};
/* ===== END CONTENT ===== */

const $ = id => document.getElementById(id);
const NIK = /[\u0591-\u05C7]/g;
const NS = 'http://www.w3.org/2000/svg';
const svg = $('house'), VIEW0 = '0 0 1000 540';
let S = {name:'', g:null, level:'easy', score:0, tries:0, idx:0, deck:[], cur:null, lock:false, zoom:null, muted:false, clue:''};

function shapes(p){return typeof p.z[0]==='string'?[p.z]:p.z;}
function box(z){
  if(z[0]==='r')return[z[1],z[2],z[1]+z[3],z[2]+z[4]];
  if(z[0]==='c')return[z[1]-z[3],z[2]-z[3],z[1]+z[3],z[2]+z[3]];
  const n=z[1].split(/[ ,]+/).map(Number),xs=n.filter((_,i)=>i%2===0),ys=n.filter((_,i)=>i%2);
  return[Math.min(...xs),Math.min(...ys),Math.max(...xs),Math.max(...ys)];
}
function center(p){
  const b=shapes(p).map(box).reduce((a,c)=>[Math.min(a[0],c[0]),Math.min(a[1],c[1]),Math.max(a[2],c[2]),Math.max(a[3],c[3])]);
  return[(b[0]+b[2])/2,(b[1]+b[3])/2];
}
function mk(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);parent.appendChild(e);return e;}

(function build(){
  for(const k in ROOMS){
    const R=ROOMS[k], r=R.o||R.b;
    const e=mk('rect',{class:'r','data-id':k,x:r[0]+3,y:r[1]+3,width:r[2]-6,height:r[3]-6,role:'button','aria-label':R.he,tabindex:-1},$('rooms'));
    e.addEventListener('click',()=>pick('room',k));
    const t=mk('text',{class:'lbl',x:R.lb[0],y:R.lb[1]},$('labels'));t.textContent=R.he;
    const g=mk('g',{class:'enter','data-room':k,role:'button','aria-label':'כְּנִיסָה לַחֶדֶר: '+R.he,tabindex:-1},$('enters'));
    mk('circle',{cx:R.eb[0],cy:R.eb[1],r:16},g);
    const tt=mk('text',{x:R.eb[0],y:R.eb[1]+1,'font-size':18,'text-anchor':'middle','dominant-baseline':'central'},g);tt.textContent='🔍';
    g.addEventListener('click',()=>enterRoom(k));
  }
  PLACES.forEach(p=>{
    const parts=shapes(p).map((z,i)=>{
      const a={class:'z','data-id':p.id,'data-room':p.room,role:'button','aria-label':p.n,tabindex:-1};
      if(i)a['aria-hidden']='true';
      const e=z[0]==='r'?mk('rect',Object.assign(a,{x:z[1],y:z[2],width:z[3],height:z[4],rx:8}),$('zones'))
             :z[0]==='c'?mk('circle',Object.assign(a,{cx:z[1],cy:z[2],r:z[3]}),$('zones'))
             :mk('polygon',Object.assign(a,{points:z[1]}),$('zones'));
      e.addEventListener('click',()=>pick('place',p.id));
      return e;
    });
    parts.forEach(e=>{   // highlight every part of a multi-part item together
      e.addEventListener('mouseenter',()=>parts.forEach(x=>x.classList.add('hl')));
      e.addEventListener('mouseleave',()=>parts.forEach(x=>x.classList.remove('hl')));
    });
  });
  document.querySelectorAll('.r,.z,.enter').forEach(e=>e.addEventListener('keydown',ev=>{
    if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();e.dispatchEvent(new Event('click'));}
  }));
})();

function applyView(){
  const hard=S.level==='hard', zm=S.zoom;
  svg.dataset.mode=S.level;
  svg.classList.toggle('zoomed',!!zm);
  svg.setAttribute('viewBox',zm?ROOMS[zm].b.join(' '):VIEW0);
  document.querySelectorAll('.art').forEach(g=>g.style.display=(!zm||g.id==='a-'+zm)?'':'none');
  document.querySelectorAll('.z').forEach(e=>{
    const show=!zm||e.dataset.room===zm;
    e.style.display=show?'':'none';e.setAttribute('tabindex',hard&&show&&!e.hasAttribute('aria-hidden')?0:-1);
  });
  document.querySelectorAll('.r').forEach(e=>e.setAttribute('tabindex',hard?-1:0));
  document.querySelectorAll('.enter').forEach(e=>e.setAttribute('tabindex',hard&&!zm?0:-1));
  $('leave').classList.toggle('hide',!zm);
  $('hint').classList.toggle('hide',!(hard&&!zm));
}
function enterRoom(k){S.zoom=k;applyView();}
function leaveRoom(){S.zoom=null;applyView();}

function shuffleDeck(){
  let a=PLACES.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}
  a=a.slice(0,Math.min(ROUNDS,a.length));
  for(let i=1;i<a.length;i++){
    if(a[i].room===a[i-1].room){
      let j=a.findIndex((p,k)=>k>i&&p.room!==a[i-1].room&&(!a[i+1]||p.room!==a[i+1].room));
      if(j<0)j=a.findIndex((p,k)=>k>i&&p.room!==a[i-1].room);
      if(j>-1)[a[i],a[j]]=[a[j],a[i]];
    }
  }
  return a;
}

function newGame(){
  S.playing=true;S.score=0;S.tries=0;S.idx=0;S.lock=false;S.deck=shuffleDeck();S.zoom=null;
  $('lvE').classList.toggle('on',S.level==='easy');$('lvH').classList.toggle('on',S.level==='hard');
  $('lvE').setAttribute('aria-pressed',S.level==='easy');$('lvH').setAttribute('aria-pressed',S.level==='hard');
  $('av').textContent=S.g==='m'?'👦':'👧';
  $('who').textContent=S.name+' '+H[S.g==='m'?0:1]+'!';
  $('ask').textContent='אֵיפֹה '+S.name+'?';
  $('end').classList.add('hide');$('game').classList.remove('hide');
  nextRound();
}

function nextRound(){
  if(!S.playing)return;
  S.zoom=null;applyView();
  $('rev').innerHTML='';$('msg').textContent='';$('msg').className='';
  if(S.idx>=S.deck.length)return finish();
  S.cur=S.deck[S.idx];S.lock=false;
  const p=S.cur, verb=H[S.g==='m'?0:1];
  const phrase=S.level==='easy'?ROOMS[p.room].easy[Math.random()*ROOMS[p.room].easy.length|0]:p.hard;
  S.clue=S.name+' '+verb+' '+phrase+'.';   // third person: name + gender-agreed verb
  $('clueText').textContent=S.clue;
  $('sc').textContent=S.score;$('tr').textContent=S.tries;$('rd').textContent=S.idx+1;$('rt').textContent=S.deck.length;
  setTimeout(()=>{if(S.playing)speak(S.clue);},250);
}

const SAY_P=[['שיש בו','אשר יש בו']];        // spoken-only phrase fixes
const SAY_W={'מטה':'מיטה','גנה':'גינה','שלחן':'שולחן','כסאות':'כיסאות','טלויזיה':'טלוויזיה','שדה':'שידה','ברוז':'ברווז','אופנים':'אופניים'};        // spoken-only spellings (bed, garden) - add more here
function sayText(t){
  t=t.replace(NIK,'');
  SAY_P.forEach(([a,b])=>{t=t.split(a).join(b);});
  t=t.replace(/[\u05D0-\u05EA]+/g,w=>{
    for(const k in SAY_W){
      if(w===k)return SAY_W[k];
      if(w.endsWith(k)&&/^[בהלמוכש]{1,3}$/.test(w.slice(0,-k.length)))return w.slice(0,-k.length)+SAY_W[k];
    }
    return w;
  });
  return t.replace(/[^\p{L}\p{N} .,!?'-]/gu,' ').replace(/\s+/g,' ').trim();
}
let VOICES=[];
function loadV(){try{VOICES=speechSynthesis.getVoices()||[];}catch(e){}}
if('speechSynthesis' in window){loadV();speechSynthesis.addEventListener('voiceschanged',loadV);}
function pickVoice(re){
  const l=VOICES.filter(v=>re.test(v.lang.replace('_','-')));
  return l.find(v=>/google|microsoft|enhanced|premium|natural/i.test(v.name))||l.find(v=>!/compact/i.test(v.name))||l[0];
}
function speak(t,force){
  try{
    if(S.muted&&!force)return;
    if(!('speechSynthesis' in window))return;
    speechSynthesis.cancel();
    sayText(t).split(/([A-Za-z][A-Za-z' -]*)/).forEach(seg=>{
      if(!seg.trim())return;
      const en=/[A-Za-z]/.test(seg), u=new SpeechSynthesisUtterance(seg.trim());
      u.lang=en?'en-US':'he-IL';u.rate=en?.9:.85;
      const v=pickVoice(en?/^en/i:/^(he|iw)/i);if(v)u.voice=v;
      speechSynthesis.speak(u);
    });
  }catch(e){}
}
function kid(x,y,g){
  const e=mk('g',{class:'pop'},$('rev')), A=(t,a)=>mk(t,a,e);
  A('circle',{cx:x,cy:y+22,r:16,fill:g==='m'?'#42a5f5':'#ec407a',stroke:'#fff','stroke-width':3});
  if(g==='f'){A('circle',{cx:x-19,cy:y-2,r:7,fill:'#5d4037'});A('circle',{cx:x+19,cy:y-2,r:7,fill:'#5d4037'});}
  A('circle',{cx:x,cy:y-4,r:19,fill:'#ffcc9c',stroke:'#fff','stroke-width':3});
  A('path',{d:'M'+(x-19)+' '+(g==='m'?y-6:y-4)+'a19 19 0 0 1 38 0c-10-9-28-9-38 0z',fill:'#5d4037'});
  A('circle',{cx:x-7,cy:y,r:2.5,fill:'#3b2a1a'});A('circle',{cx:x+7,cy:y,r:2.5,fill:'#3b2a1a'});
  A('path',{d:'M'+(x-7)+' '+(y+7)+'q7 7 14 0',stroke:'#c0392b','stroke-width':2.5,fill:'none','stroke-linecap':'round'});
}
function burst(x,y){
  const C=['#ffca28','#ef5350','#42a5f5','#66bb6a','#ab47bc'];
  for(let i=0;i<12;i++){
    const a=i/12*6.283,d=50+Math.random()*40,c=mk('circle',{class:'cf',cx:x,cy:y,r:5,fill:C[i%5]},$('rev'));
    c.style.setProperty('--dx',Math.cos(a)*d+'px');c.style.setProperty('--dy',Math.sin(a)*d+'px');
  }
}

function pick(kind,id){
  if(S.lock)return;
  const want=kind==='room'?S.cur.room:S.cur.id;
  S.tries++;$('tr').textContent=S.tries;
  const els=document.querySelectorAll((kind==='room'?'.r':'.z')+'[data-id="'+id+'"]');
  if(id!==want){
    $('msg').textContent=T.bad;$('msg').className='bad';
    els.forEach(el=>el.classList.add('bad'));setTimeout(()=>els.forEach(el=>el.classList.remove('bad')),600);
    speak(T.bad);
    return;
  }
  S.lock=true;S.score++;$('sc').textContent=S.score;
  const okMsg=T.ok(S.name);
  $('msg').textContent=okMsg;$('msg').className='ok';
  const c=center(S.cur);
  const rb=ROOMS[S.cur.room].b, ky=Math.max(rb[1]+30,Math.min(c[1]-8,rb[1]+rb[3]-42));
  kid(c[0],ky,S.g);burst(c[0],c[1]);
  speak(okMsg);
  S.idx++;
  setTimeout(nextRound,2200);
}

function finish(){
  S.playing=false;
  $('game').classList.add('hide');$('end').classList.remove('hide');
  $('fs').textContent=S.score;
  speak('כל הכבוד! מצאתם את כל המקומות!');
}

function chkStart(){$('go').disabled=!($('nm').value.trim()&&S.g);}
$('nm').addEventListener('input',chkStart);
function setG(g){S.g=g;['m','f'].forEach(k=>{const b=$('g'+k);b.classList.toggle('on',k===g);b.setAttribute('aria-pressed',k===g);});chkStart();}
$('gm').addEventListener('click',()=>setG('m'));$('gf').addEventListener('click',()=>setG('f'));
function toStart(){
  S.playing=false;S.zoom=null;
  try{speechSynthesis.cancel();}catch(e){}
  $('game').classList.add('hide');$('end').classList.add('hide');$('start').classList.remove('hide');
  $('nm').value=S.name;if(S.g)setG(S.g);chkStart();
}
$('go').addEventListener('click',()=>{S.name=$('nm').value.trim();$('start').classList.add('hide');newGame();});
$('lvE').addEventListener('click',()=>{S.level='easy';newGame();});
$('lvH').addEventListener('click',()=>{S.level='hard';newGame();});
$('newg').addEventListener('click',toStart);
$('again').addEventListener('click',toStart);
$('spk').addEventListener('click',()=>speak(S.clue,true));
$('leave').addEventListener('click',leaveRoom);
$('vol').addEventListener('click',()=>{
  S.muted=!S.muted;$('vol').textContent=S.muted?'🔇':'🔊';$('vol').setAttribute('aria-pressed',S.muted);
  if(S.muted&&'speechSynthesis' in window)speechSynthesis.cancel();
});
