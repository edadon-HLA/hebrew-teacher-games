<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>יש מקום בתיק?</title>
<style>
:root{--bg:#fff8e7;--ink:#2b2a4c;--card:#fff;--bag:#2a9d8f;--house:#e76f51;--ok:#1f7a6f;--no:#d62839;--line:#e4d8b8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1b33;--ink:#fdf3d9;--card:#2b2950;--line:#463f7a;--ok:#5fd1c2;--no:#ff7a88}}
:root[data-theme="dark"]{--bg:#1d1b33;--ink:#fdf3d9;--card:#2b2950;--line:#463f7a;--ok:#5fd1c2;--no:#ff7a88}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Arial Hebrew",Arial,sans-serif;min-height:100vh}
h1{margin:0;font-size:clamp(22px,4vw,34px);text-align:center;padding:14px 8px 0}
.wrap{display:grid;grid-template-columns:1fr 250px;gap:14px;max-width:1000px;margin:0 auto;padding:12px}
@media(max-width:760px){.wrap{grid-template-columns:1fr}}
.stage{display:grid;grid-template-columns:1fr 1fr;gap:10px;touch-action:none}
.zone{border:4px dashed var(--line);border-radius:20px;text-align:center;padding:10px 6px;background:var(--card);transition:transform .15s}
.zone.hot{transform:scale(1.04);border-style:solid}
#zbag.hot{border-color:var(--bag)}#zhouse.hot{border-color:var(--house)}
.em{font-size:clamp(56px,12vw,96px);line-height:1}
.zone b{display:block;font-size:20px}
.meter{height:14px;border-radius:8px;background:var(--line);margin:8px 10px 4px;overflow:hidden}
#fill{height:100%;width:0;background:var(--bag);transition:width .3s}
.center{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;min-height:200px;justify-content:center}
#item{font-size:clamp(90px,20vw,140px);line-height:1;cursor:grab;user-select:none;touch-action:none;position:relative;z-index:5}
#item.drag{cursor:grabbing;z-index:50;filter:drop-shadow(0 10px 8px rgba(0,0,0,.3))}
#word{font-size:clamp(28px,6vw,44px);font-weight:700;margin-top:4px}
#msg{min-height:34px;font-size:20px;font-weight:600;text-align:center;padding:4px}
.good{color:var(--ok)}.bad{color:var(--no)}
.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-14px)}75%{transform:translateX(14px)}}
@media(prefers-reduced-motion:reduce){.shake{animation:none}}
.side{display:flex;flex-direction:column;gap:12px}
.list{background:var(--card);border-radius:16px;padding:10px 12px;border:2px solid var(--line)}
.list h2{margin:0 0 6px;font-size:18px}
.list.b{border-color:var(--bag)}.list.h{border-color:var(--house)}
.list ul{list-style:none;margin:0;padding:0;min-height:28px;font-size:18px}
.list li{padding:2px 0}
button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:10px 16px;background:var(--bag);color:#fff;cursor:pointer}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
svg.ic{width:1em;height:1em;vertical-align:-.12em}
.pop{animation:pop .5s}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@media(prefers-reduced-motion:reduce){.pop{animation:none}}
#done{display:none;text-align:center;padding:20px}
</style>
<style id="site-navigation">.site-nav{position:sticky;top:0;z-index:9999;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 16px;background:rgba(255,255,255,.97);border-bottom:1px solid #dfe4ec;box-shadow:0 3px 12px rgba(20,30,50,.08);font-family:Arial,"Noto Sans Hebrew",sans-serif;direction:rtl}.site-nav .nav-title{font-weight:900;color:#182235;margin-left:auto}.site-nav a,.site-nav button{appearance:none;border:1px solid #dfe4ec;background:#fff;color:#27324a;text-decoration:none;font:700 14px Arial,"Noto Sans Hebrew",sans-serif;border-radius:10px;padding:8px 12px;cursor:pointer}.site-nav a:hover,.site-nav button:hover{background:#f1f4f9}.site-nav .nav-home{background:#182235;color:#fff;border-color:#182235}.site-nav .nav-back{background:#eef2ff;color:#3730a3;border-color:#d9defd}@media(max-width:600px){.site-nav{padding:8px}.site-nav .nav-title{width:100%;margin:0 0 2px}.site-nav a,.site-nav button{font-size:13px;padding:7px 9px}}</style></head>
<body><nav class="site-nav"><span class="nav-title">🎓 משחקי עברית</span><a class="nav-home" href="../index.html">דף הבית</a><a href="index.html">🎮 משחקים</a><a href="../full-lessons/index.html">📚 שיעורים מלאים</a><button class="nav-back" onclick="if(history.length>1)history.back();else location.href='index.html'">← חזרה</button></nav>
<h1>יש מקום בתיק? 🎒</h1>
<div class="wrap">
  <div>
    <div class="stage" id="stage">
      <div class="zone" id="zbag"><div class="em" id="bagem">🎒</div><b id="bagname">תיק 1</b><div class="meter"><div id="fill"></div></div><small id="room"></small></div>
      <div class="zone" id="zhouse"><div class="em">🏠</div><b>הבית</b></div>
      <div class="center">
        <div id="item" role="img" aria-label="פריט"></div>
        <div id="word"></div>
        <div id="msg" aria-live="polite">יש מקום בתיק? גררו את הפריט לתיק או לבית.</div>
      </div>
    </div>
    <div id="done"><h2>כל הכבוד! 🎉</h2><button id="again">משחק חדש</button></div>
  </div>
  <div class="side">
    <div class="list b"><h2>🎒 בתיק</h2><ul id="lbag"></ul></div>
    <div class="list h"><h2>🏠 בבית</h2><ul id="lhouse"></ul></div>
  </div>
</div>
<script>
var CAP=10;
var OVEN='<svg class="ic" viewBox="0 0 64 64"><rect x="8" y="6" width="48" height="52" rx="6" fill="#d9dde3" stroke="#555" stroke-width="3"/><rect x="8" y="6" width="48" height="13" rx="6" fill="#b8bec7" stroke="#555" stroke-width="3"/><circle cx="20" cy="12.5" r="2.5" fill="#555"/><circle cx="32" cy="12.5" r="2.5" fill="#555"/><circle cx="44" cy="12.5" r="2.5" fill="#555"/><line x1="16" y1="24" x2="48" y2="24" stroke="#555" stroke-width="3" stroke-linecap="round"/><rect x="14" y="30" width="36" height="22" rx="3" fill="#2b2a4c" stroke="#555" stroke-width="3"/><rect x="18" y="34" width="12" height="5" rx="2" fill="#fff" opacity=".3"/></svg>';
var FRIDGE='<svg class="ic" viewBox="0 0 64 64"><rect x="16" y="4" width="32" height="56" rx="5" fill="#e8f1f8" stroke="#555" stroke-width="3"/><line x1="16" y1="24" x2="48" y2="24" stroke="#555" stroke-width="3"/><rect x="40" y="10" width="3" height="10" rx="1.5" fill="#555"/><rect x="40" y="29" width="3" height="16" rx="1.5" fill="#555"/><rect x="21" y="8" width="8" height="4" rx="2" fill="#fff" opacity=".8"/></svg>';
var BAGS=[["🎒","#2a9d8f"],["🛍️","#7b5ea7"],["🧳","#d98a1f"]];
var bi=0;
var ITEMS=[
["🍎","תַּפּוּחַ",1],["🍌","בָּנָנָה",1],["🥛","כּוֹס",1],["✏️","עִפָּרוֹן",1],["🍴","מַזְלֵג",1],["💡","מְנוֹרָה",1],["👟","נַעַל",1],["📖","סֵפֶר",1],
["📱","טֶלֶפוֹן",1],["⚽","כַּדּוּר",1],["🧸","דֻּבִּי",1],["🥘","סִיר",1],["📺","טֶלֶוִיזְיָה",12],[FRIDGE,"מְקָרֵר",12],[OVEN,"תַּנּוּר",12],["🛋️","סַפָּה",14],["🛏️","מִטָּה",14],["🪑","כִּסֵּא",12],["🚪","דֶּלֶת",13],["🚿","מִקְלַחַת",13]
];
var deck,cur,used,bag,house,busy;
var $=function(i){return document.getElementById(i)};
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function applyBag(){
  var b=BAGS[bi%BAGS.length];
  document.documentElement.style.setProperty("--bag",b[1]);
  $("bagem").textContent=b[0];$("bagname").textContent="תיק "+(bi+1);
  var z=$("zbag");z.classList.remove("pop");void z.offsetWidth;if(bi>0)z.classList.add("pop");
}
function start(){deck=shuffle(ITEMS.slice());used=0;bag=[];house=[];bi=0;applyBag();$("done").style.display="none";$("stage").style.display="grid";say("יש מקום בתיק? גררו את הפריט לתיק או לבית.","");render();next()}
function render(){
  $("fill").style.width=(used/CAP*100)+"%";
  $("room").textContent="נשאר מקום: "+(CAP-used);
  var h="",last=-1;
  bag.forEach(function(x){if(x[3]!==last){last=x[3];h+="<li><b>תיק "+(last+1)+"</b></li>"}h+="<li>"+x[0]+" "+x[1]+"</li>"});
  $("lbag").innerHTML=h||"<li>ריק</li>";
  $("lhouse").innerHTML=house.map(function(x){return"<li>"+x[0]+" "+x[1]+"</li>"}).join("")||"<li>ריק</li>";
}
function next(){
  if(!deck.length){$("stage").style.display="none";$("done").style.display="block";return}
  cur=deck.pop();busy=false;
  var it=$("item");it.innerHTML=cur[0];it.style.transform="";it.classList.remove("drag");
  $("word").textContent=cur[1];
}
function say(t,c){var m=$("msg");m.textContent=t;m.className=c}
function drop(target){
  var fits=used+cur[2]<=CAP;
  var full=false;
  if(target==="bag"&&fits){used+=cur[2];bag.push(cur.concat([bi]));say("נכון! יש מקום בתיק ל"+cur[1]+".","good");
    var left=CAP-used;full=left<=0&&deck.some(function(i){return i[2]<=CAP});
    if(full)say("נכון! התיק מלא. הנה תיק "+(bi+2)+"!","good")}
  else if(target==="house"&&!fits){house.push(cur);say("נכון! אין מקום בתיק ל"+cur[1]+".","good")}
  else{
    var it=$("item");it.style.transform="";it.classList.add("shake");setTimeout(function(){it.classList.remove("shake")},400);
    say(target==="bag"?"אין מקום בתיק. נסו את הבית.":"יש מקום בתיק! נסו שוב.","bad");return}
  render();busy=true;
  setTimeout(function(){if(full){bi++;used=0;applyBag();render()}next()},full?1600:900);
}
(function(){
  var it=$("item"),sx,sy,on=false;
  function hit(id,x,y){var r=$(id).getBoundingClientRect();return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom}
  it.addEventListener("pointerdown",function(e){if(busy)return;on=true;sx=e.clientX;sy=e.clientY;it.setPointerCapture(e.pointerId);it.classList.add("drag")});
  it.addEventListener("pointermove",function(e){
    if(!on)return;it.style.transform="translate("+(e.clientX-sx)+"px,"+(e.clientY-sy)+"px)";
    $("zbag").classList.toggle("hot",hit("zbag",e.clientX,e.clientY));
    $("zhouse").classList.toggle("hot",hit("zhouse",e.clientX,e.clientY));
  });
  it.addEventListener("pointerup",function(e){
    if(!on)return;on=false;it.classList.remove("drag");
    $("zbag").classList.remove("hot");$("zhouse").classList.remove("hot");
    if(hit("zbag",e.clientX,e.clientY))drop("bag");
    else if(hit("zhouse",e.clientX,e.clientY))drop("house");
    else it.style.transform="";
  });
  it.addEventListener("pointercancel",function(){on=false;it.style.transform="";it.classList.remove("drag")});
})();
$("again").onclick=start;
start();
</script>
</body>
</html>
