<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>כַּרְטִיסֵי מִסְפָּרִים 1–4</title>
<style>
/* Response cards 1-4: one A4 page = one set for one student (2 x 2), cut along the dashed lines.
   Same colors as the numbered answer boxes on the lesson page. Letter-safe box 190 x 255 mm. Does not depend on the topic. */
@page{size:A4;margin:21mm 10mm}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;font-family:Arial,sans-serif}
.sheet{width:190mm;height:255mm;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;break-inside:avoid}
.c{border:1.5px dashed #9aa3b2;display:grid;place-items:center;overflow:hidden}
.c span{display:grid;place-items:center;width:78mm;height:78mm;border-radius:50%;font-size:180pt;font-weight:900;line-height:1;color:#fff}
.tools{display:flex;justify-content:center;gap:10px;padding:12px;font-family:'Segoe UI',Arial,sans-serif}
.tools button,.tools a{font:800 18px 'Segoe UI',Arial,sans-serif;border:2px solid #2f9d55;background:#e9f6ec;color:#1d6a39;border-radius:12px;padding:8px 16px;cursor:pointer;text-decoration:none}
@media screen{body{background:#eee;padding:0 10px 10px}.sheet{background:#fff;box-shadow:0 2px 12px #0003}}
@media print{.tools{display:none}}
</style>
</head>
<body>
<div class="tools"><button type="button" onclick="window.print()">🖨️ הַדְפָּסָה</button><a href="index.html">→ חֲזָרָה לַשִּׁעוּר</a></div>
<div class="sheet">
  <div class="c"><span style="background:#2a8bd0">1</span></div><div class="c"><span style="background:#2f9d55">2</span></div>
  <div class="c"><span style="background:#e0a31f">3</span></div><div class="c"><span style="background:#e2506a">4</span></div>
</div>
</body>
</html>
