<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>כַּרְטִיסֵי תְּשׁוּבָה — הַחֶדֶר שֶׁלִּי</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@400;700;800&family=Rubik:wght@800&display=swap" rel="stylesheet">
<style>
/* p1 number cards 1-10 (2 x 5) · p2 room picture cards (2 x 4) · p3 room word cards (2 x 4) · p4 verb cards (2 x 2) — cut along the dashed lines */
@page{size:A4;margin:21mm 10mm}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:#23233a;font-family:'Noto Sans Hebrew',Arial,sans-serif}
.sheet{width:190mm;height:255mm;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;page-break-after:always}
.sheet:last-child{page-break-after:auto}
.r5{grid-template-rows:repeat(5,minmax(0,1fr))}.r4{grid-template-rows:repeat(4,minmax(0,1fr))}.r2{grid-template-rows:repeat(2,minmax(0,1fr))}
.c{border:1.5px dashed #9aa3b2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2mm;overflow:hidden;padding:2mm}
.n b{font:800 64pt/1 'Rubik',Arial,sans-serif}.n small{font-size:16pt;font-weight:800;color:#7a4cc2}
.p img{max-height:58mm;max-width:88mm;object-fit:contain;border-radius:3mm}
.w b{font-size:40pt;font-weight:800}
.v b{font-size:48pt;font-weight:800}.v small{font-size:16pt;font-weight:800;color:#7a4cc2}
@media screen{body{background:#eee;padding:10px}.sheet{background:#fff;box-shadow:0 2px 12px #0003;margin-bottom:12px}}
</style>
<script src="hacheder-sheli/data.js?v=1"></script>
</head>
<body>
<div class="sheet r5" id="nums"></div>
<div class="sheet r4" id="pics"></div>
<div class="sheet r4" id="words"></div>
<div class="sheet r2">
  <div class="c v"><b>מְסַדֵּר</b><small>הוּא</small></div><div class="c v"><b>מְסַדֶּרֶת</b><small>הִיא</small></div>
  <div class="c v"><b>מְבַקֵּשׁ</b><small>הוּא</small></div><div class="c v"><b>מְבַקֶּשֶׁת</b><small>הִיא</small></div>
</div>
<script>
const N = ['אַחַת', 'שְׁתַּיִם', 'שָׁלוֹשׁ', 'אַרְבַּע', 'חָמֵשׁ', 'שֵׁשׁ', 'שֶׁבַע', 'שְׁמוֹנֶה', 'תֵּשַׁע', 'עֶשֶׂר'];
document.getElementById('nums').innerHTML = N.map((he, i) => `<div class="c n"><b>${i + 1}</b><small>${he}</small></div>`).join('');
const R = [['bed', 'מִיטָּה'], ['table', 'שׁוּלְחָן'], ['door', 'דֶּלֶת'], ['window', 'חַלּוֹן'], ['lamp', 'מְנוֹרָה'], ['chair', 'כִּסֵּא'], ['curtain', 'וִילוֹן'], ['wardrobe', 'אָרוֹן']];
document.getElementById('pics').innerHTML = R.map(([k]) => `<div class="c p"><img src="${HACHEDER.PHOTOS[k]}" alt=""></div>`).join('');
document.getElementById('words').innerHTML = R.map(([, he]) => `<div class="c w"><b>${he}</b></div>`).join('');
</script>
</body>
</html>
