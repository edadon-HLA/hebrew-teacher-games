<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>דָּנָה בָּאָה הַבַּיְתָה — מְמַסְפְּרִים · הַבַּיִת שֶׁלָּנוּ 2</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@400;700;800&family=Rubik:wght@800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/print-ind.css?v=1">
<style>
/* R2 #2: the Dana story (lesson-2 frames) in mixed order, write 1-5; 2 per page; p2 = answer key */
.rows{display:grid;grid-template-rows:repeat(5,minmax(0,1fr));gap:1.4mm;flex:1;min-height:0}
.row{display:grid;grid-template-columns:13mm 27mm 1fr;gap:3mm;align-items:center}
.box{width:12mm;height:12mm;border:.6mm solid #1f2433;border-radius:2mm;display:flex;align-items:center;justify-content:center;font:800 20pt 'Rubik',sans-serif;color:#2456a6}
.row .pi-ph{width:27mm;height:18.5mm;border:.3mm solid #c9ccd3;border-radius:1.5mm}
.row .s{font-size:13.5pt;font-weight:700;line-height:1.3}
</style>
<script src="../games/house-outside-art.js?v=1"></script>
<script src="../shared/print-ind.js?v=1"></script>
</head>
<body>
<div id="pages"></div>
<script>
const fit = (x, y, w) => [x, y, w, w * 3 / 4];
/* the lesson-2 story frames (bayit-shelanu/lesson-2.js), printed in the spec's mixed order; n = answer */
const FR = [
  [4, fit(606, 50, 344), [{ x: 700, y: 147, s: .66, g: 'f' }], 'דָּנָה עוֹלָה בַּמַּעֲלִית לְקוֹמָה חָמֵשׁ. הִיא הוֹלֶכֶת בַּמִּסְדְּרוֹן.'],
  [5, fit(712, 60, 176), [{ x: 842, y: 147, s: .72, g: 'f' }], 'אֵין לָהּ מַפְתֵּחַ! דָּנָה מְצַלְצֶלֶת בַּפַּעֲמוֹן. אִמָּא בַּבַּיִת.'],
  [1, fit(400, 20, 740), [], 'זֶה הַבִּנְיָן שֶׁל דָּנָה. בַּבִּנְיָן יֵשׁ חָמֵשׁ קוֹמוֹת.'],
  [3, fit(600, 420, 240), [{ x: 668, y: 560, s: .85, g: 'f' }], 'בַּכְּנִיסָה יֵשׁ תֵּבַת דֹּאַר שֶׁל דָּנָה: דִּירָה מִסְפָּר תֵּשַׁע.'],
  [2, fit(170, 395, 300), [{ x: 330, y: 588, s: 1, g: 'f' }], 'דָּנָה נִכְנֶסֶת בַּשַּׁעַר. יֵשׁ חָצֵר וַחֲנָיָה.'] ];
const half = ex => `${PI.top('דָּנָה בָּאָה הַבַּיְתָה', { tag: ex ? 'Answer key' : '' })}
  ${PI.ins(0, 'כִּתְבוּ 1-5 בַּמִּשְׁבֶּצֶת: מָה קוֹדֶם?')}
  <div class="rows">${FR.map(([n, vb, kids, t]) => `<div class="row"><span class="box">${ex ? n : ''}</span>${PI.pic(HouseOut.svg({ vb, kids }))}<span class="s">${t}</span></div>`).join('')}</div>`;
document.getElementById('pages').innerHTML = PI.halves(half(false)) + PI.halves(half(true), '');
</script>
</body>
</html>
