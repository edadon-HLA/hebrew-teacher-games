<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>כַּרְטִיסֵי תְּשׁוּבָה — קָרוֹב אוֹ רָחוֹק?</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@400;700;800&display=swap" rel="stylesheet">
<style>
/* p1 numbers 1-10 (2 x 5) · p2 קָרוֹב / רָחוֹק + ✔ נָכוֹן / ✘ לֹא נָכוֹן (2 x 2). Letter-safe box 190 x 255 mm; cut along the dashed lines. */
@page{size:A4;margin:21mm 10mm}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:#23233a;font-family:'Noto Sans Hebrew',Arial,sans-serif}
.sheet{width:190mm;height:255mm;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;page-break-after:always;overflow:hidden}
.sheet:last-child{page-break-after:auto}
.s5{grid-template-rows:repeat(5,minmax(0,1fr))}.s2{grid-template-rows:repeat(2,minmax(0,1fr))}
.c{border:1.5px dashed #9aa3b2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2mm;overflow:hidden;min-height:0}
.n b{font:800 60pt/1 Arial,sans-serif}.n small{font-size:20pt;font-weight:800;color:#7a4cc2}
.w b{font-size:50pt;font-weight:800}.w .ic{font:800 46pt/1 Arial,sans-serif;letter-spacing:6mm;color:#7a4cc2}
.w .big{font-size:80pt;line-height:1}
@media screen{body{background:#eee;padding:10px}.sheet{background:#fff;box-shadow:0 2px 12px #0003;margin-bottom:12px}}
</style>
</head>
<body>
<div class="sheet s5" id="p1"></div>
<div class="sheet s2">
  <div class="c w"><span class="ic">••</span><b>קָרוֹב</b></div>
  <div class="c w"><span class="ic">•&nbsp;&nbsp;&nbsp;&nbsp;•</span><b>רָחוֹק</b></div>
  <div class="c w"><span class="big" style="color:#2f9d55">✔</span><b>נָכוֹן</b></div>
  <div class="c w"><span class="big" style="color:#e2506a">✘</span><b>לֹא נָכוֹן</b></div>
</div>
<script>
const NUMS = ['אַחַת', 'שְׁתַּיִם', 'שָׁלוֹשׁ', 'אַרְבַּע', 'חָמֵשׁ', 'שֵׁשׁ', 'שֶׁבַע', 'שְׁמוֹנֶה', 'תֵּשַׁע', 'עֶשֶׂר'];
document.getElementById('p1').innerHTML = NUMS.map((he, i) => `<div class="c n"><b>${i + 1}</b><small>${he}</small></div>`).join('');
</script>
</body>
</html>
