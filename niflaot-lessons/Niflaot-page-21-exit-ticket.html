<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<title>Exit Ticket — Niflaot page 21: how many?</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@400;700;800&display=swap" rel="stylesheet">
<style>
/* 4 exit tickets on one A4 page (2 x 2), cut along the dashed lines */
@page{size:A4;margin:21mm 10mm}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:#23233a;font-family:'Noto Sans Hebrew',Arial,sans-serif}
.sheet{width:190mm;height:255mm;margin:0 auto;display:grid;grid-template-columns:95mm 95mm;grid-template-rows:127.5mm 127.5mm;overflow:hidden;break-inside:avoid}
.t{padding:5mm 5mm 4mm;border:1px dashed #9aa3b2;display:flex;flex-direction:column;gap:2mm;height:127.5mm;min-height:0;overflow:hidden}
.hd{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #7a4cc2;padding-bottom:1.5mm}
.hd b{font-size:15pt;font-weight:800}
.hd span{font-size:8.5pt;color:#6b6880}
.name{font-size:11pt;font-weight:700;display:flex;gap:2mm;align-items:flex-end}
.name i{flex:1;border-bottom:1.2px solid #23233a;height:6mm}.name i.d{flex:.7}.name span.dt{margin-inline-start:3mm}
.q{font-size:10.5pt;font-weight:800;margin-top:1mm}
.he{direction:rtl;text-align:right;font-size:13pt;font-weight:700;line-height:3}
.he i{display:inline-block;width:40mm;border-bottom:1.2px solid #23233a;height:1em}
.he .o{color:#16527d;font-weight:800;white-space:nowrap}
.self{margin-top:2mm;font-size:9.5pt;display:flex;flex-direction:column;gap:1.5mm}
.self .r{display:flex;gap:2mm;flex-wrap:wrap;align-items:center}
.self .r span.b{border:1px solid #9aa3b2;border-radius:3mm;padding:0 2mm}
bdi{unicode-bidi:isolate}
/* every question line: [number box] [item] [choices], left to right, so all lines start at the same edge */
.row{display:grid;grid-template-columns:7mm 1fr auto;align-items:center;gap:2.5mm;direction:ltr}
.row .n{display:inline-grid;place-items:center;width:7mm;height:7mm;border-radius:50%;background:#7a4cc2;color:#fff;font-size:10pt;font-weight:800}
.row .pic{font-size:14pt;letter-spacing:.2mm;white-space:nowrap}
.row .w{font-size:17pt;font-weight:800;color:#16527d;text-align:left}
.row .ch{display:flex;gap:2.5mm;direction:ltr}
.row .ch span{display:inline-grid;place-items:center;min-width:10mm;height:10mm;padding:0 2mm;border:1.2px solid #9aa3b2;border-radius:5mm;font-size:13pt;font-weight:800}
.row .ch.he span{font-size:14pt;direction:rtl;line-height:1;padding:0 3mm 1.2mm}
.row.r1{grid-template-columns:7mm 1fr;row-gap:1.5mm}.row.r1 .ch{grid-column:2}
.row.wr{grid-template-columns:7mm auto 1fr}.row .dg{font-size:20pt;font-weight:800;color:#7a4cc2}
.row.wr i{height:10mm;border-bottom:1.2px solid #23233a}
.t>*{flex-shrink:0}
@media screen{body{background:#eee;padding:10px}.sheet{background:#fff;box-shadow:0 2px 12px #0003}}
</style>
</head>
<body>
<div class="sheet" id="sheet"></div>
<script>
const one = `<div class="t">
  <div class="hd"><b>🎟️ Exit Ticket</b><span>Niflaot · page 21 · <bdi dir="rtl">כַּמָּה?</bdi></span></div>
  <div class="name">Name: <i></i><span class="dt">Date:</span><i class="d"></i></div>
  <div class="q">How many? Count and circle the word:</div>
  <div class="row r1"><span class="n">1</span><span class="pic">🍎🍎🍎🍎🍎</span><span class="ch he"><span><bdi dir="rtl">אַרְבַּע</bdi></span><span><bdi dir="rtl">חָמֵשׁ</bdi></span><span><bdi dir="rtl">שֵׁשׁ</bdi></span></span></div>
  <div class="q">Read the word and circle the number:</div>
  <div class="row"><span class="n">2</span><span class="w"><bdi dir="rtl">שֵׁשׁ</bdi></span><span class="ch"><span>3</span><span>6</span><span>7</span></span></div>
  <div class="row"><span class="n">3</span><span class="w"><bdi dir="rtl">שְׁמוֹנֶה</bdi></span><span class="ch"><span>8</span><span>2</span><span>10</span></span></div>
  <div class="q">Write the number in Hebrew:</div>
  <div class="row wr"><span class="n">4</span><span class="dg">7</span><i></i></div>
  <div class="self"><div>Today I can count and read numbers in Hebrew:</div>
    <div class="r"><span class="b">yes</span><span class="b">almost</span><span class="b">not yet</span></div></div>
</div>`;
document.getElementById('sheet').innerHTML = one.repeat(4);
</script>
</body>
</html>
