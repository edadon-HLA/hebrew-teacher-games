<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<title>Exit Ticket — Niflaot pages 22-24</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@400;700;800&display=swap" rel="stylesheet">
<style>
/* 4 exit tickets on one A4 page (2 x 2), cut along the dashed lines */
@page{size:A4;margin:8mm}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:#23233a;font-family:'Noto Sans Hebrew',Arial,sans-serif}
.sheet{width:194mm;height:281mm;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.t{padding:5mm 5mm 4mm;border:1px dashed #9aa3b2;display:flex;flex-direction:column;gap:2mm;overflow:hidden}
.hd{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #7a4cc2;padding-bottom:1.5mm}
.hd b{font-size:15pt;font-weight:800}
.hd span{font-size:8.5pt;color:#6b6880}
.name{font-size:11pt;font-weight:700;display:flex;gap:2mm;align-items:flex-end}
.name i{flex:1;border-bottom:1.2px solid #23233a;height:6mm}.name i.d{flex:.7}.name span.dt{margin-inline-start:3mm}
.q{font-size:10.5pt;font-weight:800;margin-top:1mm}
.he{direction:rtl;text-align:right;font-size:13pt;font-weight:700;line-height:2}
.he i{display:inline-block;width:30mm;border-bottom:1.2px solid #23233a;height:1em}
.he .o{color:#16527d;font-weight:800;white-space:nowrap}
.self{margin-top:auto;font-size:9.5pt;display:flex;flex-direction:column;gap:1.5mm}
.self .r{display:flex;gap:2mm;flex-wrap:wrap;align-items:center}
.self .r span.b{border:1px solid #9aa3b2;border-radius:3mm;padding:0 2mm}
.hw{font-size:8.5pt;color:#6b6880;border-top:1px dotted #9aa3b2;padding-top:1mm}
bdi{unicode-bidi:isolate}
@media screen{body{background:#eee;padding:10px}.sheet{background:#fff;box-shadow:0 2px 12px #0003}}
</style>
</head>
<body>
<div class="sheet" id="sheet"></div>
<script>
const one = `<div class="t">
  <div class="hd"><b>🎟️ Exit Ticket</b><span>Niflaot pages 22-24 · <bdi dir="rtl">מֵאֵיפֹה הֵם?</bdi></span></div>
  <div class="name">Name: <i></i><span class="dt">Date:</span><i class="d"></i></div>
  <div class="q">Part 1 — Complete the sentences about yourself:</div>
  <div class="he">אֲנִי מִ<i></i>.<br>אֲנִי גָּר / גָּרָה בְּ<i></i>.</div>
  <div class="q">Part 2 — Circle <bdi dir="rtl">בְּ</bdi> or <bdi dir="rtl">מִ</bdi>:</div>
  <div class="he">1. דָּוִיד בָּא <span class="o">( בְּ / מִ )</span> פָּרִיז.<br>2. עַכְשָׁו הוּא גָּר <span class="o">( בְּ / מִ )</span> יִשְׂרָאֵל.<br>3. דָּנָה גָּרָה <span class="o">( בְּ / מִ )</span> אֵילַת.</div>
  <div class="self"><div>Today I can say where I live and where I come from:</div>
    <div class="r"><span class="b">yes</span><span class="b">almost</span><span class="b">not yet</span></div>
    <div class="hw">Homework (optional): Bring a photo of your grandparents and tell where they are from.</div></div>
</div>`;
document.getElementById('sheet').innerHTML = one.repeat(4);
</script>
</body>
</html>
