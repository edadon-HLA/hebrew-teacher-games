<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Change password</title><link rel="stylesheet" href="exam.css"></head>
<body><main><div class="card gate">
<h2>יצירת סיסמה חדשה<span class="en">Create a new exams password</span></h2>
<input id="p" type="text" placeholder="new password" dir="ltr">
<button class="btn" onclick="ExamAuth.sha(document.getElementById('p').value).then(function(h){document.getElementById('o').value='window.EXAM_PASS_HASH = '+String.fromCharCode(34)+h+String.fromCharCode(34)+';'})">Generate</button>
<p>Replace the hash line in <b>config.js</b> with the result:</p>
<textarea id="o" rows="4" style="width:100%" dir="ltr" readonly></textarea>
<p class="en">Delete this file from the site after you use it.</p>
</div></main>
<script src="config.js"></script><script src="exam.js"></script></body></html>
