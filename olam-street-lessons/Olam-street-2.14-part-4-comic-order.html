<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>מָה קָרָה קֹדֶם? · רחוב העולם 2.14 חלק 4 (להדפסה)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@400;700;800&display=swap">
<style>
/* Independent worksheet: 6 real comic panels in mixed order, students write 1-6. Page 2 = key (numbers in green).
   Panels in story order: 1, 3, 5, 8, 10, 12 (olam-2.14-panels, PMAP in olam-2.14-data.js). Letter-safe box 190 x 255 mm. */
@page{size:A4;margin:21mm 10mm}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:#111;font-family:'Noto Sans Hebrew',Arial,sans-serif}
.page{width:190mm;height:255mm;margin:0 auto;display:flex;flex-direction:column;page-break-after:always;break-after:page;overflow:hidden;padding:2mm 3mm}
.page:last-child{page-break-after:auto;break-after:auto}
.hd{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:4mm}
.hd .nm{font-size:13pt;font-weight:700;display:flex;gap:2mm;align-items:flex-end}.hd .nm i{flex:1;border-bottom:1.2px solid #111;height:6mm}
.hd b{font-size:22pt;font-weight:800}
.hd .tag{font-size:9pt;color:#888;text-align:left}.hd .key{font-size:11pt;color:#1b8a3a;font-weight:800;text-align:left}
.ins{font-size:15pt;font-weight:800;margin:2mm 0 4mm;text-align:center}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,minmax(0,1fr));gap:5mm}
.cell{position:relative;border:1.5px solid #444;border-radius:3mm;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#fff}
.cell img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.num{position:absolute;top:2mm;right:2mm;width:15mm;height:15mm;border:2px solid #111;border-radius:2mm;background:#fff;display:grid;place-items:center;font-size:26pt;font-weight:800;line-height:1}
.key .num{color:#1b8a3a;border-color:#1b8a3a}
@media screen{body{background:#eee;padding:10px}.page{background:#fff;box-shadow:0 2px 12px #0003;margin-bottom:12px}}
</style>
</head>
<body>
<div id="out"></div>
<script>
/* printed order (RTL: right -> left, top -> bottom) and the story number of each panel */
const ORDER = [8, 1, 12, 5, 10, 3], STORY = { 1: 1, 3: 2, 5: 3, 8: 4, 10: 5, 12: 6 };
const sheet = key => `<div class="page${key ? ' key' : ''}">
  <div class="hd"><div class="nm">שֵׁם: <i></i></div><b>מָה קָרָה קֹדֶם?</b>${key ? '<div class="key">מַפְתֵּחַ · Answer key</div>' : '<div class="tag"><bdi dir="ltr">2.14 · 4</bdi></div>'}</div>
  <div class="ins">כִּתְבוּ 1–6 לְפִי הַסִּפּוּר.</div>
  <div class="grid">${ORDER.map(p => `<div class="cell"><img src="olam-2.14-panels/panel-${p}.jpg" alt=""><span class="num">${key ? STORY[p] : ''}</span></div>`).join('')}</div></div>`;
document.getElementById('out').innerHTML = sheet() + sheet(true);
</script>
</body>
</html>
