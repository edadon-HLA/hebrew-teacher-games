<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>דּוֹמִינוֹ — 15 מִלִּים · רחוב העולם 2.14 חלק 3 (להדפסה)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@400;700;800&display=swap">
<style>
/* Comic-words dominoes (rows 1-3, 15 words): 16 tiles, 8 per page (2 x 4) in mixed order, page 3 = the chain (answer key).
   Tile = RIGHT half picture (L214.ART) | LEFT half word. Chain right -> left. Letter-safe box 190 x 255 mm. */
@page{size:A4;margin:21mm 10mm}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:#111;font-family:'Noto Sans Hebrew','Segoe UI Emoji',Arial,sans-serif}
.page{width:190mm;height:255mm;margin:0 auto;position:relative;page-break-after:always;break-after:page;overflow:hidden;padding-top:6mm}
.page:last-child{page-break-after:auto;break-after:auto}
.lab{position:absolute;top:0;left:0;right:0;text-align:center;font-size:8.5pt;color:#888;line-height:5mm}
.grid{display:grid;grid-template-columns:repeat(2,90mm);grid-auto-rows:42mm;justify-content:center;direction:ltr}
.t{position:relative;display:grid;grid-template-columns:1fr 1fr;border:1.5px solid #111;margin:-0.75px;direction:ltr;overflow:hidden}
.t>div{display:flex;align-items:center;justify-content:center;text-align:center;direction:rtl;min-width:0;padding:2mm}
.t .wd{border-right:1.5px dashed #777;font-size:22pt;font-weight:800;line-height:1.2}
.t .pc svg{height:34mm;width:auto;max-width:41mm}
.t .pc.st,.t .wd.end{font-size:20pt;font-weight:800;color:#333}
.t .set{position:absolute;bottom:.8mm;left:1.5mm;font-size:7pt;color:#aaa;direction:ltr}
.howto{font-size:11pt;color:#444;text-align:center;margin:0 0 4mm}
.chain{display:grid;grid-template-columns:repeat(4,45mm);grid-auto-rows:21mm;gap:5mm 2mm;justify-content:center;direction:rtl}
.chain .t{margin:0;direction:ltr}
.chain .t .wd{font-size:11pt}.chain .t .pc svg{height:16mm;max-width:20mm}.chain .t .pc.st,.chain .t .wd.end{font-size:10pt}
.chain .n{position:absolute;top:.5mm;right:1mm;font-size:7pt;color:#888}
.chain .t .set{display:none}
@media screen{body{background:#eee;padding:10px}.page{background:#fff;box-shadow:0 2px 12px #0003;margin-bottom:12px}}
</style>
</head>
<body>
<div id="out"></div>
<script src="../games/food-art.js"></script>
<script src="../games/hungry-art.js?v=3"></script>
<script src="olam-2.14-data.js?v=1"></script>
<script>
const L = L214;
/* chain order (spec): picture of tile i+1 = the word of tile i */
const KEYS = ['festival', 'cheese', 'marir', 'baderech', 'prefer', 'matok', 'holchim', 'mitchashek', 'lavan', 'hungry', 'yum', 'pri', 'laatzor', 'dessert', 'kadima'];
const tile = i => {   /* i = 0..15 */
  const right = i === 0 ? '<div class="pc st">★ הַתְחָלָה</div>' : `<div class="pc">${L.ART[KEYS[i - 1]]}</div>`;
  const left = i === 15 ? '<div class="wd end">🏁 סוֹף</div>' : `<div class="wd">${L.HE[KEYS[i]]}</div>`;
  return `<div class="t">${left}${right}<span class="set">2.14</span></div>`;
};
/* mixed order on the sheet (fixed, so every printed set is the same) */
const MIX = [9, 3, 14, 0, 6, 11, 2, 15, 12, 5, 8, 1, 13, 7, 4, 10];
const sheet = (ids, n) => `<div class="page"><div class="lab">דּוֹמִינוֹ · רְחוֹב הָעוֹלָם <bdi dir="ltr">2.14</bdi> · דַּף ${n} מִתּוֹךְ 2 · גּוֹזְרִים לְאֹרֶךְ הַקַּוִּים הַשְּׁלֵמִים</div><div class="grid">${ids.map(tile).join('')}</div></div>`;
const key = `<div class="page"><div class="lab">מַפְתֵּחַ · Answer key</div>
  <p class="howto">מַתְחִילִים מִ־★ הַתְחָלָה ⬅ הַתְּמוּנָה שֶׁל הַקְּלָף הַבָּא נוֹגַעַת בַּמִּלָּה ⬅ עַד 🏁 סוֹף.</p>
  <div class="chain">${Array.from({ length: 16 }, (_, i) => tile(i).replace('<div class="t">', `<div class="t"><span class="n">${i + 1}</span>`)).join('')}</div></div>`;
document.getElementById('out').innerHTML = sheet(MIX.slice(0, 8), 1) + sheet(MIX.slice(8), 2) + key;
</script>
</body>
</html>
