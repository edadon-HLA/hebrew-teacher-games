<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>גְּרַף הַכִּתָּה · רחוב העולם 2.25–2.26 (להדפסה)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@400;700;800&display=swap">
<style>
/* Independent sheet (class data, no key): colour the class survey counts (8 foods of p.19, 0-25 squares), then complete the line.
   2 per A4 (top / bottom, cut line). Photos = OLAM225.FOODS (credits on the lesson page). Letter-safe box 190 x 255 mm. */
@page{size:A4;margin:21mm 10mm}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:#111;font-family:'Noto Sans Hebrew',Arial,sans-serif}
.page{width:190mm;height:255mm;margin:0 auto;display:grid;grid-template-rows:125mm 5mm 125mm;overflow:hidden}
.cut{border-top:1.5px dashed #777;align-self:center;position:relative}
.cut::after{content:'✂';position:absolute;top:-3mm;left:2mm;font-size:10pt;color:#777;background:#fff;padding:0 1mm;line-height:1}
.ws{display:flex;flex-direction:column;padding:1.5mm 3mm;overflow:hidden}
.hd{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:4mm}
.hd .nm{font-size:12pt;font-weight:700;display:flex;gap:2mm;align-items:flex-end}.hd .nm i{flex:1;border-bottom:1.2px solid #111;height:6mm}
.hd b{font-size:19pt;font-weight:800}.hd .tag{font-size:9pt;color:#888;text-align:left}
.ins{font-size:12pt;font-weight:800;margin:.5mm 0 1.5mm;text-align:center}
.chart{display:grid;grid-template-columns:7mm repeat(8,1fr);gap:0 1.5mm;direction:rtl}
.axis{display:grid;grid-template-rows:repeat(25,3mm);font-size:6.5pt;color:#555;text-align:center;line-height:3mm}
.col{display:grid;grid-template-rows:repeat(25,3mm);border:1px solid #444}
.col i{border-top:.6px solid #bbb}.col i:first-child{border-top:0}.col i:nth-child(5n+1){border-top-color:#666}
.lab{grid-column:2 / -1;display:grid;grid-template-columns:repeat(8,1fr);gap:0 1.5mm;margin-top:1mm}
.lab div{text-align:center;font-size:9pt;font-weight:800;line-height:1.15}
.lab img{width:100%;height:10mm;object-fit:cover;border-radius:1mm;display:block;margin-bottom:.5mm;filter:contrast(1.1)}
.sent{margin-top:auto;display:flex;gap:2mm;align-items:flex-end;font-size:14pt;font-weight:800}
.sent i{flex:1;border-bottom:1.5px solid #111;height:8mm}
@media screen{body{background:#eee;padding:10px}.page{background:#fff;box-shadow:0 2px 12px #0003}}
</style>
</head>
<body>
<div id="out"></div>
<script src="olam-2.25-data.js?v=1"></script>
<script>
const F = OLAM225.FOODS;
const axis = `<div class="axis">${Array.from({ length: 25 }, (_, i) => `<span>${25 - i}</span>`).join('')}</div>`;
const sheet = `<div class="ws">
  <div class="hd"><div class="nm">שֵׁם: <i></i></div><b>גְּרַף הַכִּתָּה</b><div class="tag"><bdi dir="ltr">2.25</bdi></div></div>
  <div class="ins">צִבְעוּ לְפִי הַסֶּקֶר.</div>
  <div class="chart">${axis}${F.map(() => `<div class="col">${'<i></i>'.repeat(25)}</div>`).join('')}
    <div class="lab">${F.map(f => `<div><img src="${f.img}" alt="">${f.he}</div>`).join('')}</div></div>
  <div class="sent"><span>הֲכִי אוֹהֲבִים לֶאֱכוֹל</span><i></i><span>.</span></div></div>`;
document.getElementById('out').innerHTML = `<div class="page">${sheet}<div class="cut"></div>${sheet}</div>`;
</script>
</body>
</html>
