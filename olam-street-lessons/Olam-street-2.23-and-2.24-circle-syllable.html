<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>מַקִּיפִים אֶת הַהֲבָרָה · רחוב העולם 2.23 (להדפסה)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@400;700;800&display=swap">
<style>
/* Classwork "circle the syllable": 2 sheets per A4 (dashed cut line), 8 rows x 6 syllables from the workbook page only; page 2 = answer key + teacher list */
@page{size:A4;margin:21mm 10mm}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:#23233a;font-family:'Noto Sans Hebrew',Arial,sans-serif}
.page{width:190mm;height:255mm;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;page-break-after:always}
.page:last-child{page-break-after:auto}
.sh{height:127.5mm;display:flex;flex-direction:column;gap:1.4mm;padding:2mm 1mm;overflow:hidden}
.sh+.sh{border-top:1.5px dashed #9aa3b2}
.hd{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #e2506a;padding-bottom:1.4mm;gap:6mm}
.hd b{font-size:19pt;font-weight:800}.hd span{font-size:10pt;color:#6b6880}
.name{font-size:12pt;font-weight:700;display:flex;gap:2mm;align-items:flex-end;width:62mm}.name i{flex:1;border-bottom:1.2px solid #23233a;height:6mm}
.how{font-size:11pt;color:#4a4a5e;margin:0;direction:ltr;text-align:left}
.rows{flex:1;min-height:0;display:grid;grid-template-rows:repeat(8,minmax(0,1fr));gap:1.2mm}
.r{display:grid;grid-template-columns:9mm repeat(6,1fr);gap:2.5mm;align-items:center}
.r .n{width:7mm;height:7mm;border-radius:50%;background:#2a8bd0;color:#fff;display:grid;place-items:center;font-size:11pt;font-weight:800}
.r span{position:relative;display:grid;place-items:center;height:100%;border:1.2px solid #cfd6e0;border-radius:2.5mm;font-size:28pt;font-weight:700;line-height:1}
.r span.ok::after{content:'';position:absolute;inset:.6mm 4mm;border:2.2px solid #2f9d55;border-radius:50%}
.tl{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:2mm 8mm;font-size:15pt;font-weight:700}
.tl b{font-size:22pt;color:#2f9d55;margin-inline-start:2mm}
.kh{font-size:13pt;font-weight:800;margin:0}
@media screen{body{background:#eee;padding:10px}.page{background:#fff;box-shadow:0 2px 12px #0003;margin-bottom:12px}}
</style>
</head>
<body>
<div id="pages"></div>
<script>
/* workbook p.17 (2.23 path) only; ב without dagesh, exactly as printed. [syllables box 1 -> 6, teacher's box (1-6)] */
const LESSON = '2.23', PAGE = 17;
const ROWS = [
  [['בַ', 'גוּ', 'נַ', 'גֹ', 'גִי', 'גַ'], 2],
  [['רוּ', 'בֹ', 'גוּ', 'נִי', 'נוּ', 'בוּ'], 5],
  [['גָ', 'בָ', 'בִי', 'בוּ', 'נָ', 'בֹ'], 3],
  [['בוּ', 'גֹ', 'נֹ', 'רוּ', 'בֹ', 'רֹ'], 6],
  [['נַ', 'טַ', 'נֹ', 'בַ', 'נִ', 'נוּ'], 1],
  [['בִי', 'גָ', 'טִי', 'נָ', 'טָ', 'בָ'], 5],
  [['גֹ', 'נִי', 'טִי', 'בִ', 'רוּ', 'גִי'], 3],
  [['נוּ', 'רֹ', 'טִי', 'רוּ', 'בֹ', 'טַ'], 4] ];
const sheet = key => `<div class="sh"><div class="hd"><div class="name">שֵׁם: <i></i></div><b>מַקִּיפִים אֶת הַהֲבָרָה</b><span>רְחוֹב הָעוֹלָם <bdi dir="ltr">${LESSON}</bdi>${key ? ' · מַפְתֵּחַ' : ''}</span></div>
  <p class="how">Circle the syllable your teacher says.</p>
  <div class="rows">${ROWS.map(([s, k], i) => `<div class="r"><span class="n">${i + 1}</span>${s.map((x, j) => `<span class="${key && j + 1 === k ? 'ok' : ''}">${x}</span>`).join('')}</div>`).join('')}</div></div>`;
const list = `<div class="sh"><p class="kh">לַמּוֹרֶה — הַמּוֹרֶה אוֹמֵר (פַּעֲמַיִם בְּכָל שׁוּרָה) · חוֹבֶרֶת עַמּוּד ${PAGE}</p>
  <ul class="tl">${ROWS.map(([s, k], i) => `<li>שׁוּרָה ${i + 1}: <b>${s[k - 1]}</b></li>`).join('')}</ul></div>`;
document.getElementById('pages').innerHTML = `<div class="page">${sheet(false)}${sheet(false)}</div><div class="page">${sheet(true)}${list}</div>`;
</script>
</body>
</html>
