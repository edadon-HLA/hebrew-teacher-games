<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>דַּף שִׂיחָה · רחוב העולם (חִמּוּם כּוֹתְבִים שִׂיחָה, להדפסה)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@400;700;800&display=swap">
<style>
/* Warm-up B "כּוֹתְבִים שִׂיחָה" chat slip (Olam 2.19-2.20 and 2.23-2.24): 4 per A4 (2 x 2, cut lines).
   Each slip: name + 4 handwriting lines (top + base line, light dashed middle guide), marked א ב א ב. Letter-safe box 190 x 255 mm. */
@page{size:A4;margin:21mm 10mm}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:#111;font-family:'Noto Sans Hebrew',Arial,sans-serif}
.sheet{width:190mm;height:255mm;margin:0 auto;display:grid;grid-template-columns:95mm 95mm;grid-template-rows:127.5mm 127.5mm}
.s{border:1.2px dashed #777;padding:4mm 5mm;display:flex;flex-direction:column;overflow:hidden;height:127.5mm}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:4mm}
.top b{font-size:16pt;font-weight:800}
.nm{flex:1;font-size:11pt;font-weight:700;display:flex;gap:2mm;align-items:flex-end}.nm i{flex:1;border-bottom:1.2px solid #111;height:5mm}
.rows{flex:1;display:grid;grid-template-rows:repeat(4,1fr);gap:2mm;margin-top:3mm}
.r{display:grid;grid-template-columns:9mm 1fr;align-items:center;gap:2mm}
.r .w{width:8mm;height:8mm;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12pt;font-weight:800}
.r .a{background:#2a6fb0}.r .b{background:#c8435c}
.ln{height:18mm;border-top:1.3px solid #444;border-bottom:1.3px solid #444;position:relative}
.ln::after{content:'';position:absolute;left:0;right:0;top:50%;border-top:1px dashed #aaa}
.tag{font-size:7.5pt;color:#999;text-align:left}
@media screen{body{background:#eee;padding:10px}.sheet{background:#fff;box-shadow:0 2px 12px #0003}}
</style>
</head>
<body>
<div id="out"></div>
<script>
const slip = `<div class="s"><div class="top"><b>כּוֹתְבִים שִׂיחָה</b><div class="nm">שֵׁם: <i></i></div></div>
  <div class="rows">${['a', 'b', 'a', 'b'].map(k => `<div class="r"><span class="w ${k}">${k === 'a' ? 'א' : 'ב'}</span><div class="ln"></div></div>`).join('')}</div>
  <div class="tag">Olam Street · chat slip</div></div>`;
document.getElementById('out').innerHTML = `<div class="sheet">${slip.repeat(4)}</div>`;
</script>
</body>
</html>
