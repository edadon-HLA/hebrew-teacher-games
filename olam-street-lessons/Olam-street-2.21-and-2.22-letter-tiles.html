<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>אוֹתִיּוֹת לִגְזִירָה · רחוב העולם 2.21–2.22 (להדפסה)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@400;700;800&display=swap">
<style>
/* Letter tiles סָלָט · מֶלַח (same pattern as Olam-street-2.15-and-2.16-letter-tiles.html): page 1 = 8 tiles 30 mm (cut by the teacher,
   envelope), page 2 = build-the-words sheet (2 words + "my word" bonus row), page 3 = key. Letter-safe box 190 x 255 mm. */
@page{size:A4;margin:21mm 10mm}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:#111;font-family:'Noto Sans Hebrew',Arial,sans-serif}
.page{width:190mm;height:255mm;margin:0 auto;display:flex;flex-direction:column;page-break-after:always;break-after:page;overflow:hidden;padding:2mm 3mm}
.page:last-child{page-break-after:auto;break-after:auto}
.lab{text-align:center;font-size:9pt;color:#888;margin-bottom:4mm}
.tiles{display:grid;grid-template-columns:repeat(4,30mm);grid-auto-rows:30mm;justify-content:center;direction:rtl}
.tile{position:relative;border:1.5px solid #111;margin:-.75px;display:grid;place-items:center;font-size:62pt;font-weight:800;line-height:1}
.tile i{position:absolute;bottom:.8mm;left:1.2mm;font-size:6.5pt;font-style:normal;color:#aaa;direction:ltr}
.hd{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:4mm}
.hd .nm{font-size:13pt;font-weight:700;display:flex;gap:2mm;align-items:flex-end}.hd .nm i{flex:1;border-bottom:1.2px solid #111;height:6mm}
.hd b{font-size:22pt;font-weight:800}.hd .tag{font-size:9pt;color:#888;text-align:left}.hd .key{font-size:11pt;color:#1b8a3a;font-weight:800;text-align:left}
.rows{display:grid;grid-template-rows:repeat(3,58mm);gap:5mm;margin-top:5mm}
.row{display:grid;grid-template-columns:42mm 1fr;grid-template-rows:1fr auto;gap:2mm 5mm;border:1.2px solid #bbb;border-radius:3mm;padding:2mm 3mm;min-height:0}
.row .pic{grid-row:1/3;display:grid;place-items:center;min-height:0;font-size:15pt;font-weight:800;text-align:center}.row .pic svg{max-width:40mm;max-height:40mm;width:auto;height:auto}
.boxes{display:flex;gap:2mm;justify-content:flex-start;align-items:center}
.boxes span{width:30mm;height:30mm;border:2px solid #111;border-radius:2mm;display:grid;place-items:center;font-size:52pt;font-weight:800;color:#1b8a3a;line-height:1}
.ln{border-bottom:1.5px solid #111;height:9mm;font-size:22pt;font-weight:800;color:#1b8a3a;line-height:9mm}
@media screen{body{background:#eee;padding:10px}.page{background:#fff;box-shadow:0 2px 12px #0003;margin-bottom:12px}}
</style>
</head>
<body>
<div id="out"></div>
<script src="../games/food-art.js"></script>
<script>
const TILES = ['ס', 'ל', 'ל', 'ט', 'מ', 'ח', 'ה', 'ט'];
const SALT = FoodArt.saladItems.find(f => f.id === 'salt').pic;
const ROWS = [[FoodArt.extra.salad, 'סלט', 'סָלָט'], [SALT, 'מלח', 'מֶלַח'], ['מִלָּה שֶׁלִּי', '   ', '']];
const hd = (t, key) => `<div class="hd"><div class="nm">שֵׁם: <i></i></div><b>${t}</b>${key ? '<div class="key">מַפְתֵּחַ · Answer key</div>' : '<div class="tag"><bdi dir="ltr">2.21</bdi></div>'}</div>`;
const sheet = key => `<div class="page">${hd('בּוֹנִים מִלִּים', key)}<div class="rows">${ROWS.map(([pic, w, he]) =>
  `<div class="row"><div class="pic">${pic}</div><div class="boxes">${[...w].map(c => `<span>${key && c.trim() ? c : ''}</span>`).join('')}</div><div class="ln">${key ? he : ''}</div></div>`).join('')}</div></div>`;
document.getElementById('out').innerHTML =
  `<div class="page"><div class="lab">אוֹתִיּוֹת לִגְזִירָה · רְחוֹב הָעוֹלָם <bdi dir="ltr">2.21</bdi> · הַמּוֹרֶה גּוֹזֵר מֵרֹאשׁ · סֶט אֶחָד לְכָל תַּלְמִיד (בְּמַעֲטָפָה)</div>
   <div class="tiles">${TILES.map(c => `<div class="tile">${c}<i>2.21</i></div>`).join('')}</div></div>` + sheet() + sheet(true);
</script>
</body>
</html>
