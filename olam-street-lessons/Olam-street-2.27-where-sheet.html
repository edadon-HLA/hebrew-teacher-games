<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>לְאָן הֵם הוֹלְכִים? · רחוב העולם 2.27 (להדפסה)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@400;700;800&display=swap">
<style>
/* Independent draw-a-line sheet (template: Olam-street-2.14-part-3-sweet-bitter.html): sentences 1-6 of the game (OLAM227.SENT) on
   the right, the 6 matching place pictures in mixed order on the left. 2 per A4 + page 2 = key (green lines). Letter-safe box 190 x 255 mm. */
@page{size:A4;margin:21mm 10mm}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:#111;font-family:'Noto Sans Hebrew',Arial,sans-serif}
.page{width:190mm;height:255mm;margin:0 auto;display:grid;grid-template-rows:125mm 5mm 125mm;page-break-after:always;break-after:page;overflow:hidden}
.page:last-child{page-break-after:auto;break-after:auto}
.cut{border-top:1.5px dashed #777;align-self:center;position:relative}
.cut::after{content:'✂';position:absolute;top:-3mm;left:2mm;font-size:10pt;color:#777;background:#fff;padding:0 1mm;line-height:1}
.ws{position:relative;display:flex;flex-direction:column;padding:2mm 3mm;overflow:hidden}
.hd{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:4mm}
.hd .nm{font-size:12pt;font-weight:700;display:flex;gap:2mm;align-items:flex-end}.hd .nm i{flex:1;border-bottom:1.2px solid #111;height:6mm}
.hd b{font-size:20pt;font-weight:800}.hd .tag{font-size:9pt;color:#888;text-align:left}.key-t{font-size:11pt;color:#1b8a3a;font-weight:800;text-align:left}
.ins{font-size:14pt;font-weight:800;margin:1mm 0 2mm;text-align:center}
.body{flex:1;min-height:0;display:grid;grid-template-columns:1fr 30mm 34mm;gap:0}
.col{display:grid;grid-template-rows:repeat(6,minmax(0,1fr));gap:1.2mm}
.it{display:flex;align-items:center;gap:2mm;min-height:0}
.r .it{justify-content:flex-start}
.r .fc{width:10mm;height:10mm;flex:none}.r .fc svg{width:100%;height:100%}
.r .s{font-size:12pt;font-weight:800;line-height:1.25;flex:1}
.l .it{flex-direction:row-reverse;justify-content:flex-start}
.l img{width:24mm;height:15mm;object-fit:cover;border:1px solid #444;border-radius:2mm;display:block;filter:contrast(1.1)}
.dot{width:3.5mm;height:3.5mm;border-radius:50%;background:#111;flex:none}
svg.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
@media screen{body{background:#eee;padding:10px}.page{background:#fff;box-shadow:0 2px 12px #0003;margin-bottom:12px}}
</style>
</head>
<body>
<div id="out"></div>
<script src="../games/comic-art.js"></script>
<script src="olam-2.27-data.js?v=1"></script>
<script>
const D = OLAM227, S = D.SENT.slice(0, 6);
const MIX = [3, 0, 5, 1, 4, 2];   /* left column order (indexes into S), fixed */
const sheet = key => `<div class="ws${key ? ' key' : ''}">
  <div class="hd"><div class="nm">שֵׁם: <i></i></div><b>לְאָן הֵם הוֹלְכִים?</b>${key ? '<div class="key-t">מַפְתֵּחַ · Answer key</div>' : '<div class="tag"><bdi dir="ltr">2.27</bdi></div>'}</div>
  <div class="ins">חַבְּרוּ בְּקַו.</div>
  <div class="body">
    <div class="col r">${S.map((s, i) => `<div class="it" data-s="${i}"><span class="fc">${ComicArt.face(s.who)}</span><span class="s">${i + 1}. ${s.s}</span><span class="dot"></span></div>`).join('')}</div>
    <div></div>
    <div class="col l">${MIX.map(i => `<div class="it" data-p="${i}"><img src="${D.BY[S[i].id].img}" alt=""><span class="dot"></span></div>`).join('')}</div>
  </div></div>`;
document.getElementById('out').innerHTML = `<div class="page">${sheet()}<div class="cut"></div>${sheet()}</div>` + `<div class="page">${sheet(true)}<div></div><div></div></div>`;
function drawKey(){ const ws = document.querySelector('.ws.key'), o = ws.getBoundingClientRect(); let s = '<svg class="lines" xmlns="http://www.w3.org/2000/svg">';
  ws.querySelectorAll('[data-s]').forEach(a => { const b = ws.querySelector(`[data-p="${a.dataset.s}"]`), d1 = a.querySelector('.dot').getBoundingClientRect(), d2 = b.querySelector('.dot').getBoundingClientRect();
    s += `<line x1="${d1.left + d1.width / 2 - o.left}" y1="${d1.top + d1.height / 2 - o.top}" x2="${d2.left + d2.width / 2 - o.left}" y2="${d2.top + d2.height / 2 - o.top}" stroke="#1b8a3a" stroke-width="3" stroke-linecap="round"/>`; });
  ws.insertAdjacentHTML('beforeend', s + '</svg>'); }
(document.fonts ? document.fonts.ready : Promise.resolve()).then(drawKey);
</script>
</body>
</html>
