<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>כרטיסי תשובה · רחוב העולם 2.10–2.13 (להדפסה)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@400;700;800&display=swap">
<style>
/* Pages 1–2: DOUBLE-SIDED food cards (picture on the front, word on the back) — print duplex, flip on the LONG edge.
   Pages 3–4: the same cards single-sided (pictures, then words). Page 5: the בְּסֵדֶר feeling card + instructions. */
@page{size:A4;margin:8mm}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:#23233a;font-family:'Noto Sans Hebrew',Arial,sans-serif}
.page{width:194mm;height:281mm;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(4,1fr);direction:ltr;page-break-after:always;break-after:page;position:relative}
.page:last-child{page-break-after:auto;break-after:auto}
.page.big{grid-template-rows:1fr 1fr}
.c{border:1.5px dashed #6b6880;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:3mm;gap:2mm;overflow:hidden;direction:rtl}
.c.pic svg{height:40mm;width:auto;max-width:86mm}
.c.pic .emo{font-size:62pt;line-height:1}
.c.word .w{font-size:30pt;font-weight:800;line-height:1.2;padding:0 2mm}
.c.back{background:#fffaf0}
.c.feel .f svg{width:60mm;height:60mm;display:block}
.c.feel .w{font-size:34pt;font-weight:800}
.c.feel .tag{font-size:12pt;font-weight:800;color:#6b6880}
.c.note{align-items:flex-start;justify-content:flex-start;text-align:right;font-size:12pt;line-height:1.6;color:#4a4a5e;border-style:dotted}
.c.note b{font-size:14pt;color:#23233a}
.lab{position:absolute;top:-1mm;left:0;right:0;text-align:center;font-size:8pt;color:#9aa3b2;direction:rtl}
@media screen{body{background:#eee;padding:10px}.page{background:#fff;box-shadow:0 2px 12px #0003;margin-bottom:12px}}
</style>
</head>
<body>
<div id="out"></div>
<script src="../games/food-art.js"></script>
<script src="../games/feel-art.js"></script>
<script>
const F = FoodArt.foods2;
const front = f => `<div class="c pic">${FoodArt.html(f.pic)}</div>`;
const back = f => `<div class="c word back"><div class="w">${f.he}</div></div>`;
/* pages 1–2: back page rows are mirrored so each word sits exactly behind its picture (flip on the long edge) */
const fronts = F.map(front), backs = [];
for (let r = 0; r < 4; r++) { backs.push(back(F[r * 2 + 1])); backs.push(back(F[r * 2])); }
const feel = f => `<div class="c feel"><div class="f">${FeelArt.face(f.id)}</div><div class="w">${f.he}</div><div class="tag">כַּרְטִיס רֶגֶשׁ · חָדָשׁ</div></div>`;
const note = `<div class="c note"><div><b>🎴 כַּרְטִיסֵי תְּשׁוּבָה — רְחוֹב הָעוֹלָם <bdi dir="ltr">2.10–2.13</bdi></b><br>
<b>הַדְפָּסָה דּוּ־צְדָדִית (עַמּוּדִים 1–2):</b> מַדְפִּיסִים דּוּ־צְדָדִי וְהוֹפְכִים עַל הַצַּד הָאָרֹךְ. בְּכָל כַּרְטִיס — תְּמוּנָה מִצַּד אֶחָד וּמִלָּה בַּצַּד הַשֵּׁנִי. גּוֹזְרִים לְאֹרֶךְ הַקַּוִּים הַמְּקֻוָּקָוִים. סֵט אֶחָד לְכָל תַּלְמִיד.<br>
<b>הַדְפָּסָה חַד־צְדָדִית (עַמּוּדִים 3–4):</b> דַּף אֶחָד שֶׁל כַּרְטִיסֵי תְּמוּנָה וְדַף אֶחָד שֶׁל כַּרְטִיסֵי מִלָּה.<br>
• רָמָה 1: הַמִּלָּה עַל הַלּוּחַ — מַרְימִים כַּרְטִיס תְּמוּנָה. רָמָה 2: הַתְּמוּנָה עַל הַלּוּחַ — מַרְימִים כַּרְטִיס מִלָּה.<br>
• "3… 2… 1… הָרִימוּ!" — כֻּלָּם יַחַד.<br>
• מְחַלְּקִים בִּתְחִלַּת הַתִּרְגּוּל וְאוֹסְפִים בַּסּוֹף — אֶפְשָׁר לְהִשְׁתַּמֵּשׁ שׁוּב.</div></div>`;
const page = (cells, cls, label) => `<div class="page ${cls || ''}">${label ? `<div class="lab">${label}</div>` : ''}${cells.join('')}</div>`;
document.getElementById('out').innerHTML =
  page(fronts, '', 'דּוּ־צְדָדִי · צַד קִדְמִי — תְּמוּנוֹת') +
  page(backs, '', 'דּוּ־צְדָדִי · צַד אֲחוֹרִי — מִלִּים (הַשּׁוּרוֹת מְשֻׁקָּפוֹת כְּדֵי שֶׁיִּתְאִימוּ; הוֹפְכִים עַל הַצַּד הָאָרֹךְ)') +
  page(F.map(front), '', 'חַד־צְדָדִי · כַּרְטִיסֵי תְּמוּנָה') +
  page(F.map(f => `<div class="c word"><div class="w">${f.he}</div></div>`), '', 'חַד־צְדָדִי · כַּרְטִיסֵי מִלָּה') +
  page([feel(FeelArt.beseder), note], 'big', '');
</script>
</body>
</html>
