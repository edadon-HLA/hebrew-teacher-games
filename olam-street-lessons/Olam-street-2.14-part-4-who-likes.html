<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>מִי אוֹהֵב מָה? · רחוב העולם 2.14 חלק 4 (להדפסה)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@400;700;800&display=swap">
<style>
/* Independent worksheet: chart "who likes what?" (same key as the page's chart, KEY in Olam-street-2.14-part-4.html).
   2 per page (top / bottom) + page 2 = key. Row אֲנִי = the student's own taste (no answer). Letter-safe box 190 x 255 mm. */
@page{size:A4;margin:21mm 10mm}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:#111;font-family:'Noto Sans Hebrew',Arial,sans-serif}
.page{width:190mm;height:255mm;margin:0 auto;display:grid;grid-template-rows:125mm 5mm 125mm;page-break-after:always;break-after:page;overflow:hidden}
.page:last-child{page-break-after:auto;break-after:auto}
.cut{border-top:1.5px dashed #777;align-self:center;position:relative}
.cut::after{content:'✂';position:absolute;top:-3mm;left:2mm;font-size:10pt;color:#777;background:#fff;padding:0 1mm;line-height:1}
.ws{display:flex;flex-direction:column;padding:2mm 3mm;overflow:hidden}
.hd{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:4mm}
.hd .nm{font-size:12pt;font-weight:700;display:flex;gap:2mm;align-items:flex-end}.hd .nm i{flex:1;border-bottom:1.2px solid #111;height:6mm}
.hd b{font-size:20pt;font-weight:800}
.hd .tag{font-size:9pt;color:#888;text-align:left}.hd .key{font-size:11pt;color:#1b8a3a;font-weight:800;text-align:left}
.ins{font-size:14pt;font-weight:800;margin:1mm 0 2mm;text-align:center}
table{border-collapse:collapse;width:100%;flex:1;table-layout:fixed}
th,td{border:1.5px solid #111;text-align:center;vertical-align:middle;padding:1mm}
th{height:27mm;font-size:13pt;font-weight:800}th svg{height:17mm;width:auto;max-width:34mm;display:block;margin:0 auto}th .emo{display:block;font-size:40pt;line-height:1.1}
td.rn{width:36mm;font-size:14pt;font-weight:800}
td.rn .f{display:inline-block;width:12mm;height:12mm;vertical-align:middle;margin-inline-end:2mm}td.rn .f svg{width:100%;height:100%}
td.c{font-size:24pt;font-weight:800;color:#1b8a3a}
tr.me td{background:#f4f4f4}
@media screen{body{background:#eee;padding:10px}.page{background:#fff;box-shadow:0 2px 12px #0003;margin-bottom:12px}}
</style>
</head>
<body>
<div id="out"></div>
<script src="../games/food-art.js"></script>
<script src="../games/hungry-art.js?v=3"></script>
<script src="../games/comic-art.js"></script>
<script src="olam-2.14-data.js?v=1"></script>
<script>
const L = L214, COLS = ['pizza', 'pasta', 'chocolate', 'mango'], ROWS = ['keren', 'dan', 'roni'];
const KEY = { keren: ['pizza', 'pasta', 'chocolate', 'mango'], dan: ['pizza', 'chocolate'], roni: ['pizza', 'pasta', 'chocolate', 'mango'] };
const face = who => window.ComicArt ? ComicArt.face(who) : '';
const sheet = key => `<div class="ws">
  <div class="hd"><div class="nm">שֵׁם: <i></i></div><b>מִי אוֹהֵב מָה?</b>${key ? '<div class="key">מַפְתֵּחַ · Answer key</div>' : '<div class="tag"><bdi dir="ltr">2.14 · 4</bdi></div>'}</div>
  <div class="ins">סַמְּנוּ ✔.</div>
  <table><tr><th></th>${COLS.map(c => `<th>${L.ART[c] || ''}${L.HE[c]}</th>`).join('')}</tr>
  ${ROWS.map(r => `<tr><td class="rn"><span class="f">${face(r)}</span>${L.CHARS[r].he}</td>${COLS.map(c => `<td class="c">${key && KEY[r].includes(c) ? '✔' : ''}</td>`).join('')}</tr>`).join('')}
  <tr class="me"><td class="rn">אֲנִי</td>${COLS.map(() => '<td class="c"></td>').join('')}</tr></table></div>`;
document.getElementById('out').innerHTML =
  `<div class="page">${sheet()}<div class="cut"></div>${sheet()}</div>` +
  `<div class="page">${sheet(true)}<div></div><div></div></div>`;
</script>
</body>
</html>
