<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>הַסָּלָט שֶׁלִּי · רחוב העולם 2.19–2.20 (להדפסה)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@400;700;800&display=swap">
<style>
/* Independent sheet (draw + copy, personal, no key): empty salad bowl to draw in, 4 writing lines, word bank of the
   8 salad items (FoodArt.saladItems), sentence to complete. 1 per A4. Letter-safe box 190 x 255 mm. */
@page{size:A4;margin:21mm 10mm}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:#111;font-family:'Noto Sans Hebrew',Arial,sans-serif}
.page{width:190mm;height:255mm;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;padding:2mm 3mm}
.hd{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:4mm}
.hd .nm{font-size:13pt;font-weight:700;display:flex;gap:2mm;align-items:flex-end}.hd .nm i{flex:1;border-bottom:1.2px solid #111;height:6mm}
.hd b{font-size:22pt;font-weight:800}.hd .tag{font-size:9pt;color:#888;text-align:left}
.ins{font-size:13pt;font-weight:800;margin:2mm 0 3mm;text-align:center}
.mid{display:grid;grid-template-columns:140mm 1fr;gap:4mm;align-items:center}
.bowl svg{width:140mm;height:auto;display:block}
.lines{display:grid;gap:9mm}.lines i{display:block;border-bottom:1.5px solid #111;height:8mm}
.bank{margin-top:4mm;border:2px solid #111;border-radius:4mm;padding:2mm 3mm}
.bank h3{margin:0 0 1mm;font-size:12pt;text-align:center}
.bank .g{display:grid;grid-template-columns:repeat(4,1fr);gap:2mm}
.bank .it{display:flex;align-items:center;gap:2mm;font-size:13pt;font-weight:800}
.bank .it .p{width:13mm;height:13mm;display:grid;place-items:center;flex:none}.bank .it .p svg{max-width:13mm;max-height:13mm;width:auto;height:auto}.bank .it .p .emo{font-size:26pt;line-height:1}
.sent{margin-top:5mm;display:grid;grid-template-columns:auto 1fr;gap:2mm;align-items:end;font-size:18pt;font-weight:800}
.sent i{border-bottom:1.5px solid #111;height:10mm}
@media screen{body{background:#eee;padding:10px}.page{background:#fff;box-shadow:0 2px 12px #0003}}
</style>
</head>
<body>
<div id="out"></div>
<script src="../games/food-art.js"></script>
<script>
const bowl = `<svg viewBox="0 0 280 170" xmlns="http://www.w3.org/2000/svg"><path d="M10 40 H270 Q262 150 140 160 Q18 150 10 40 Z" fill="none" stroke="#111" stroke-width="3"/>
  <ellipse cx="140" cy="40" rx="130" ry="14" fill="none" stroke="#111" stroke-width="2.5"/><path d="M95 160 Q140 172 185 160" fill="none" stroke="#111" stroke-width="3"/></svg>`;
const ITEMS = ['tomato', 'cucumber', 'onion', 'parsley', 'lemon', 'oliveoil', 'salt', 'pepper'].map(id => FoodArt.saladItems.find(f => f.id === id));
document.getElementById('out').innerHTML = `<div class="page">
  <div class="hd"><div class="nm">שֵׁם: <i></i></div><b>הַסָּלָט שֶׁלִּי</b><div class="tag"><bdi dir="ltr">2.19</bdi></div></div>
  <div class="ins">צַיְּרוּ בַּקְּעָרָה מָה שֶׁאַתֶּם אוֹהֲבִים בַּסָּלָט, וְכִתְבוּ אֶת הַמִּלִּים.</div>
  <div class="mid"><div class="bowl">${bowl}</div><div class="lines"><i></i><i></i><i></i><i></i></div></div>
  <div class="bank"><h3>מַחְסַן מִלִּים</h3><div class="g">${ITEMS.map(f => `<div class="it"><span class="p">${FoodArt.html(f.pic)}</span>${f.he}</div>`).join('')}</div></div>
  <div class="sent"><span>בַּסָּלָט אֲנִי אוֹהֵב</span><i></i></div></div>`;
</script>
</body>
</html>
