<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>מָתוֹק אוֹ מָרִיר? · רחוב העולם 2.14 חלק 3 (להדפסה)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@400;700;800&display=swap">
<style>
/* Independent worksheet (draw a line, no cutting): 2 identical sheets per page (top / bottom) + page 2 = answer key.
   Photos = the 8 Wikimedia photos of the part-3 page's SORT array (credits on that page). Letter-safe box 190 x 255 mm. */
@page{size:A4;margin:21mm 10mm}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:#111;font-family:'Noto Sans Hebrew',Arial,sans-serif}
.page{width:190mm;height:255mm;margin:0 auto;display:grid;grid-template-rows:125mm 5mm 125mm;page-break-after:always;break-after:page;overflow:hidden}
.page:last-child{page-break-after:auto;break-after:auto}
.cut{border-top:1.5px dashed #777;align-self:center;position:relative}
.cut::after{content:'✂';position:absolute;top:-3mm;left:2mm;font-size:10pt;color:#777;background:#fff;padding:0 1mm;line-height:1}
.ws{position:relative;display:flex;flex-direction:column;padding:2mm 3mm;overflow:hidden}
.hd{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:4mm}
.hd .nm{font-size:12pt;font-weight:700;display:flex;gap:2mm;align-items:flex-end}.hd .nm i{flex:1;border-bottom:1.2px solid #111;height:6mm}
.hd b{font-size:20pt;font-weight:800}
.hd .tag{font-size:9pt;color:#888;text-align:left}
.key-t{font-size:11pt;color:#1b8a3a;font-weight:800;text-align:left}
.ins{font-size:14pt;font-weight:800;margin:1mm 0 2mm;text-align:center}
.body{flex:1;min-height:0;display:grid;grid-template-columns:42mm 1fr 42mm;gap:0;align-items:stretch}
.col{display:grid;grid-template-rows:repeat(4,minmax(0,1fr));gap:1.5mm}
.it{display:flex;align-items:center;gap:2mm;min-height:0}
.col.r .it{flex-direction:row}         /* RTL: photo at the outer (right) edge, dot toward the middle */
.col.l .it{flex-direction:row-reverse} /* photo at the outer (left) edge */
.it .p{display:flex;flex-direction:column;align-items:center;width:32mm;min-height:0}
.it img{width:30mm;height:17mm;object-fit:cover;border:1px solid #444;border-radius:2mm;display:block;filter:contrast(1.12)}
.it .w{font-size:12pt;font-weight:800;line-height:1.25;white-space:nowrap}
.dot{width:4mm;height:4mm;border-radius:50%;background:#111;flex:none}
.mid{display:grid;grid-template-rows:1fr 1fr;gap:5mm;padding:1mm 12mm}
.box{border:2.5px solid #111;border-radius:5mm;display:flex;align-items:center;justify-content:center;gap:4mm;min-height:0}
.box svg{height:26mm;width:auto}
.box b{font-size:24pt;font-weight:800}
svg.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
@media screen{body{background:#eee;padding:10px}.page{background:#fff;box-shadow:0 2px 12px #0003;margin-bottom:12px}}
</style>
</head>
<body>
<div id="out"></div>
<script src="../games/food-art.js"></script>
<script src="../games/hungry-art.js?v=3"></script>
<script src="olam-2.14-data.js?v=1"></script>
<script>
const L = L214;
const wm = p => 'https://thumb.wikimedia.org/wikipedia/commons/thumb/' + p + '/500px-' + p.split('/').pop();
/* same photos and answers as SORT on Olam-street-2.14-part-3.html; order = spec (right column 1-4, left column 5-8) */
const IT = [['עוּגַת שׁוֹקוֹלָד', 'e/e4/Slice_of_chocolate_cake_at_the_office.jpg', 'm'], ['לִימוֹן', '6/6f/Lemon_with_white_background.jpg', 'r'],
  ['מַנְגּוֹ', '3/34/Mango_on_white.jpg', 'm'], ['קָפֶה', '4/45/A_small_cup_of_coffee.JPG', 'r'],
  ['שׁוֹקוֹלָד מָרִיר', 'd/d8/Malagos_Chocolate_white_bg.jpg', 'r'], ['דְּבַשׁ', 'd/d6/Jar_and_honey_stick.jpg', 'm'],
  ['אֶשְׁכּוֹלִית', 'b/b7/Empty_grapefruit_halfs.jpg', 'r'], ['סֻכָּרִיּוֹת', '3/3d/Sixlets-Candies.jpg', 'm']];
const item = ([he, p, ok]) => `<div class="it" data-ok="${ok}"><div class="p"><img src="${wm(p)}" alt="${he}"><span class="w">${he}</span></div><span class="dot"></span></div>`;
const sheet = key => `<div class="ws${key ? ' key' : ''}">
  <div class="hd"><div class="nm">שֵׁם: <i></i></div><b>מָתוֹק אוֹ מָרִיר?</b>${key ? '<div class="key-t">מַפְתֵּחַ · Answer key</div>' : '<div class="tag"><bdi dir="ltr">2.14 · 3</bdi></div>'}</div>
  <div class="ins">חַבְּרוּ בְּקַו: מָתוֹק אוֹ מָרִיר?</div>
  <div class="body">
    <div class="col r">${IT.slice(0, 4).map(item).join('')}</div>
    <div class="mid"><div class="box" data-box="m">${L.ART.matok}<b>מָתוֹק</b></div><div class="box" data-box="r">${L.ART.marir}<b>מָרִיר</b></div></div>
    <div class="col l">${IT.slice(4).map(item).join('')}</div>
  </div></div>`;
document.getElementById('out').innerHTML =
  `<div class="page">${sheet()}<div class="cut"></div>${sheet()}</div>` +
  `<div class="page">${sheet(true)}<div class="cut" style="visibility:hidden"></div><div></div></div>`;
/* answer key: green lines from each dot to its box */
function drawKey(){
  const ws = document.querySelector('.ws.key'), o = ws.getBoundingClientRect();
  let s = `<svg class="lines" xmlns="http://www.w3.org/2000/svg">`;
  ws.querySelectorAll('.it').forEach(it => {
    const d = it.querySelector('.dot').getBoundingClientRect(), b = ws.querySelector(`[data-box="${it.dataset.ok}"]`).getBoundingClientRect();
    const right = it.closest('.col').classList.contains('r');
    const ya = d.top + d.height / 2, x1 = d.left + d.width / 2 - o.left, y1 = ya - o.top;
    const x2 = (right ? b.right : b.left) - o.left, y2 = Math.min(Math.max(ya, b.top + 14), b.bottom - 14) - o.top;
    s += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#1b8a3a" stroke-width="3" stroke-linecap="round"/>`;
  });
  ws.insertAdjacentHTML('beforeend', s + '</svg>');
}
(document.fonts ? document.fonts.ready : Promise.resolve()).then(drawKey);
</script>
</body>
</html>
