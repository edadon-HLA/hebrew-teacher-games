<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>כרטיס יציאה · רחוב העולם 2.23–2.24 (להדפסה)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@400;600;800&display=swap">
<style>
/* 4 exit tickets on one A4 page (2 x 2), cut along the dashed lines */
@page{size:A4;margin:21mm 10mm}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:#23233a;font-family:'Noto Sans Hebrew',Arial,sans-serif}
.sheet{width:190mm;height:255mm;margin:0 auto;display:grid;grid-template-columns:95mm 95mm;grid-template-rows:127.5mm 127.5mm;overflow:hidden;break-inside:avoid}
.t{padding:5mm 5mm 4mm;border:1px dashed #9aa3b2;display:flex;flex-direction:column;gap:2.4mm;height:127.5mm;min-height:0;overflow:hidden}
.hd{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #e2506a;padding-bottom:1.5mm}
.hd b{font-size:15pt;font-weight:800}
.hd span{font-size:8.5pt;color:#6b6880}
.name{font-size:11pt;font-weight:700;display:flex;gap:2mm;align-items:flex-end}
.name i{flex:1;border-bottom:1.2px solid #23233a;height:6mm}
.q{font-size:11pt;font-weight:800;margin-top:1mm}
.task{font-size:12.5pt;font-weight:800;color:#16527d;background:#eaf3ff;border-radius:2mm;padding:1.5mm 2mm;line-height:1.6}
.lines{display:flex;flex-direction:column;gap:3mm}
.line{position:relative;height:16mm;border-top:1px solid #7bbfe6;border-bottom:1px solid #7bbfe6;background:#fcfbf7}
.line::after{content:'';position:absolute;left:0;right:0;top:50%;border-top:1px dashed #f08a8a}
.strip{display:grid;grid-template-columns:repeat(10,1fr);gap:1mm;border:1px solid #d6dde7;border-radius:2mm;padding:1mm;direction:rtl}
.strip .ic{height:9mm;display:grid;place-items:center}.strip svg{width:100%;height:9mm;display:block}.strip .emo{font-size:18pt;line-height:1}
.self{margin-top:2mm;display:flex;flex-direction:column;gap:1.3mm;font-size:9.5pt}
.self div{display:flex;justify-content:space-between;align-items:center;gap:2mm}
.self .f{display:flex;gap:1.5mm;font-size:12pt;white-space:nowrap}
.self .f span{display:inline-grid;place-items:center;width:6.5mm;height:6.5mm;border:1px solid #9aa3b2;border-radius:50%}
.tip{font-size:8pt;color:#6b6880}
.t{direction:ltr}.en{direction:ltr;text-align:left}.t .task{direction:rtl;text-align:right}.t bdi{unicode-bidi:isolate}
.name span{font-size:11pt;font-weight:700;margin-inline-start:3mm}.name i.d{flex:.7}
.t>*{flex-shrink:0}
@media screen{body{background:#eee;padding:10px}.sheet{background:#fff;box-shadow:0 2px 12px #0003}}
/* 2.23–2.24: missing letters + handwriting, picture hints */
.row{display:grid;grid-template-columns:7mm 1fr;align-items:center;gap:2.5mm;direction:ltr}
.row .n{display:inline-grid;place-items:center;width:7mm;height:7mm;border-radius:50%;background:#2a8bd0;color:#fff;font-size:10pt;font-weight:800}
.fills{display:flex;justify-content:space-around;direction:rtl;font-size:19pt;font-weight:800;color:#16527d}
.fills .gap{display:inline-block;min-width:8mm;border:1.5px dashed #e2506a;border-radius:2mm;text-align:center;color:#c4c9d4;margin:0 .3mm}
.wr{display:grid;grid-template-columns:auto 1fr auto;gap:2.5mm;align-items:center;direction:rtl}
.wr b{font-size:16pt;font-weight:800;color:#16527d;min-width:18mm}
.wr .ln{height:13mm;border-top:1px solid #7bbfe6;border-bottom:1px solid #7bbfe6;background:#fcfbf7;position:relative}
.wr .ln::after{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px dashed #f08a8a}
.wr .hint{width:16mm;height:13mm;display:grid;place-items:center}.wr .hint svg{width:100%;height:13mm;display:block}.wr .hint img{width:16mm;height:13mm;object-fit:cover;border-radius:2mm;display:block}
</style>
</head>
<body>
<div class="sheet" id="sheet"></div>
<script src="../games/food-art.js"></script>
<script>
const CHEESE = FoodArt.html(FoodArt.foods4.find(f => f.id === 'cheese').pic);
const THIRSTY = 'https://upload.wikimedia.org/wikipedia/commons/thumb/8/8d/Young_child_drinks_from_a_glass_while_standing_in_a_kitchen.jpg/500px-Young_child_drinks_from_a_glass_while_standing_in_a_kitchen.jpg';
const SELF = ["I can write <bdi dir=\"rtl\">ג ב י נ ה</bdi> and <bdi dir=\"rtl\">צ מ א</bdi>", "I can read <bdi dir=\"rtl\">גְּבִינָה</bdi> and <bdi dir=\"rtl\">צָמֵא</bdi>"];
const one = `<div class="t">
  <div class="hd"><b>🎟️ Exit Ticket</b><span>Olam Street <bdi dir="ltr">2.23–2.24</bdi></span></div>
  <div class="name">Name: <i></i><span>Date:</span><i class="d"></i></div>
  <div class="row"><span class="n">1</span><span class="q en" style="margin:0">Fill in the missing letter:</span></div>
  <div class="fills"><span>גְּבִי<span class="gap">◌ָ</span>ה</span><span><span class="gap">◌ָ</span>מֵא</span><span>גְּ<span class="gap">◌ִ</span>ינָה</span></div>
  <div class="row"><span class="n">2</span><span class="q en" style="margin:0">Write by hand:</span></div>
  <div class="wr"><b>גְּבִינָה</b><div class="ln"></div><span class="hint">${CHEESE}</span></div>
  <div class="wr"><b>צָמֵא</b><div class="ln"></div><span class="hint"><img src="${THIRSTY}" alt=""></span></div>
  <div class="self">${SELF.map(s => `<div><span>${s}</span><span class="f"><span>😀</span><span>🙂</span><span>😕</span></span></div>`).join('')}</div>
</div>`;
document.getElementById('sheet').innerHTML = one.repeat(4);
</script>
</body>
</html>
