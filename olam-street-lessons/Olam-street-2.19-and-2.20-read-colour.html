<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>קוֹרְאִים וְצוֹבְעִים · רחוב העולם 2.19–2.20 (להדפסה)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@400;700;800&display=swap">
<style>
/* Independent sheet: read each syllable of the p.15 path (ס ל ט ח ה) and colour it by its nikud. Colour key = swatches only
   (no colour words): אַ / אָ yellow · אֹ blue · אוּ green · אִ red. Page 2 = key (tinted cells). Letter-safe box 190 x 255 mm. */
@page{size:A4;margin:21mm 10mm}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:#111;font-family:'Noto Sans Hebrew',Arial,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.page{width:190mm;height:255mm;margin:0 auto;display:flex;flex-direction:column;page-break-after:always;break-after:page;overflow:hidden;padding:2mm 3mm}
.page:last-child{page-break-after:auto;break-after:auto}
.hd{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:4mm}
.hd .nm{font-size:13pt;font-weight:700;display:flex;gap:2mm;align-items:flex-end}.hd .nm i{flex:1;border-bottom:1.2px solid #111;height:6mm}
.hd b{font-size:22pt;font-weight:800}.hd .tag{font-size:9pt;color:#888;text-align:left}.hd .key{font-size:11pt;color:#1b8a3a;font-weight:800;text-align:left}
.ins{font-size:13pt;font-weight:800;margin:2mm 0 3mm;text-align:center}
.legend{display:flex;justify-content:center;gap:5mm;border:2px solid #111;border-radius:4mm;padding:2mm 4mm;margin:0 auto 5mm;width:max-content}
.legend div{display:flex;align-items:center;gap:2mm;font-size:24pt;font-weight:800}
.legend span{width:12mm;height:9mm;border:1.5px solid #111;border-radius:2mm}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(4,minmax(0,1fr));gap:3mm}
.c{border:2px solid #111;border-radius:4mm;display:grid;place-items:center;font-size:44pt;font-weight:800;line-height:1}
@media screen{body{background:#eee;padding:10px}.page{background:#fff;box-shadow:0 2px 12px #0003;margin-bottom:12px}}
</style>
</head>
<body>
<div id="out"></div>
<script>
const COL = { y: '#ffd84d', b: '#6fb2f0', g: '#7ed38f', r: '#f27f7f' };
const SYL = ['חַ', 'סָ', 'לֹ', 'טוּ', 'הִ', 'סַ', 'לָ', 'חֹ', 'סוּ', 'טִ', 'לַ', 'הָ', 'טֹ', 'לוּ', 'חִ', 'טַ', 'חָ', 'סֹ', 'הוּ', 'לִ'];
/* the spec list repeats every 5 syllables, so in a 5-column grid every column would be one vowel: lay it out in a fixed mixed order */
const ORDER = [0, 7, 14, 3, 11, 18, 5, 12, 1, 9, 16, 4, 13, 8, 19, 2, 10, 17, 6, 15];
SYL.splice(0, SYL.length, ...ORDER.map(i => SYL[i]));
const kind = s => s.includes('וּ') ? 'g' : s.includes('ֹ') ? 'b' : s.includes('ִ') ? 'r' : 'y';
const LEG = [['אַ / אָ', 'y'], ['אֹ', 'b'], ['אוּ', 'g'], ['אִ', 'r']];
const sheet = key => `<div class="page">
  <div class="hd"><div class="nm">שֵׁם: <i></i></div><b>קוֹרְאִים וְצוֹבְעִים</b>${key ? '<div class="key">מַפְתֵּחַ · Answer key</div>' : '<div class="tag"><bdi dir="ltr">2.20</bdi></div>'}</div>
  <div class="ins">קִרְאוּ כָּל הֲבָרָה וּצְבְעוּ לְפִי הַנִּקּוּד.</div>
  <div class="legend">${LEG.map(([t, k]) => `<div>${t}<span style="background:${COL[k]}"></span></div>`).join('')}</div>
  <div class="grid">${SYL.map(s => `<div class="c" style="${key ? 'background:' + COL[kind(s)] : ''}">${s}</div>`).join('')}</div></div>`;
document.getElementById('out').innerHTML = sheet() + sheet(true);
</script>
</body>
</html>
